 [{"text": "Use it. Pre-empt her strategy in your own pitch and take the wind out of hers.", "effects": {"career": 14, "affection_priya": -10, "set_flags": ["betrayed_priya"]}, "next": "betray"}, {"text": "Delete it unread past the first line, and tell her it happened.", "effects": {"affection_priya": 12, "reputation": 5, "set_flags": ["priya_respect"]}, "next": "fair"}, {"text": "Walk it back to her desk yourself and hand it over.", "effects": {"affection_priya": 11, "reputation": 4, "set_flags": ["priya_respect"]}, "next": "return"}]}, "betray": {"speaker": "", "text": "You use it. Your pitch lands hard precisely because it strangles hers before she can breathe. It works. It works beautifully. You feel sick about exactly none of it until you see her face when she realizes.", "next": "betrayend"}, "betrayend": {"speaker": "", "text": "You got closer to the chair today. You also just taught Priya that she was right about people all along. That's going to cost more than a promotion.", "terminal": true}, "fair": {"speaker": "Priya", "text": "You... deleted it. You had my entire strategy and you deleted it and then TOLD me. Who does that? Nobody does that. You lunatic. Okay. Okay. I owe you one, and I hate owing people, so consider me deeply annoyed and — thank you.", "next": "end"}, "return": {"speaker": "Priya", "text": "You walked it back. To my face. You could've buried me and instead you're standing at my desk being — decent. I don't know what to do with you. I really, genuinely do not.", "next": "end"}, "end": {"speaker": "", "text": "You didn't take the shot. In a building full of people who would have, that means something to her she doesn't have words for yet.", "terminal": true}}}, "p_a2_fallout": {"start": "n1", "nodes": {"n1": {"speaker": "", "variants": [{"if": "betrayed_priya", "text": "Week 6. Priya finds you by the lift. The warmth is gone, replaced by something colder and more careful. She knows exactly what you did.", "next": "cold"}, {"text": "Week 6. Priya drops into the chair beside yours, uninvited, two coffees in hand. She slides one to you. It's the good upstairs one.", "next": "warm"}]}, "cold": {"speaker": "Priya", "text": "That was a clean kill. Genuinely well executed. I'd have done it too, once. I keep telling myself that. It doesn't help.", "next": "coldc"}, "coldc": {"speaker": "You", "choices": [{"text": "'Priya — I'm sorry. It was the job. It wasn't about you.'", "effects": {"affection_priya": 3}, "next": "coldsorry"}, {"text": "Say nothing. There's no version of this she wants to hear.", "effects": {"affection_priya": -2}, "next": "coldsilent"}]}, "coldsorry": {"speaker": "Priya", "text": "'It was the job.' That's what they all say. That's what HE said. You know what — fine. Lesson relearned. Trust no one, especially the ones who make you want to.", "next": "coldend"}, "coldsilent": {"speaker": "Priya", "text": "Nothing. Right. At least you're not insulting me with an apology. We're competitors now. Only that. It's cleaner this way. It's what I should've kept it as.", "next": "coldend"}, "coldend": {"speaker": "", "text": "She walks off. Whatever was building between you just got locked behind a door you may have welded shut yourself.", "terminal": true}, "warm": {"speaker": "Priya", "text": "I've been trying to figure out your angle for three days. What you did with my strategy — sorry, what you DIDN'T do — makes no strategic sense. So either you're an idiot, or you're the first person here who isn't playing me. I've decided you're not an idiot.", "next": "warmc"}, "warmc": {"speaker": "You", "choices": [{"text": "'No angle. I just don't want to win by becoming someone you'd be right about.'", "effects": {"affection_priya": 9}, "next": "warma"}, {"text": "'Maybe I just like the version of this where we're honest.'", "effects": {"affection_priya": 8}, "next": "warma"}]}, "warma": {"speaker": "Priya", "text": "...Someone I'd be right about. You caught that. From the water cooler, weeks ago. You've been paying attention to me this whole time. That's — nobody pays attention to me. They watch me. It's different. Drink your coffee before it's cold, new hire.", "next": "warmend"}, "warmend": {"speaker": "", "text": "She stays in the chair beside you for the rest of the afternoon, sparring over the model, closer than rivals have any business being.", "terminal": true}}}, "p_a2_wall": {"start": "n1", "nodes": {"n1": {"speaker": "", "variants": [{"if": "betrayed_priya", "text": "Week 7. You corner her on the fire stairs — the only place she can't storm away from. She's still frost, but she stays. Barely.", "next": "n2"}, {"text": "Week 7. Late. The fire stairs. You find Priya sitting on the top step, armor off, and for once she doesn't put it back on when she sees you.", "next": "n2"}]}, "n2": {"speaker": "Priya", "text": "You want to know why I'm like this. Everyone does. Fine. My second year, I built something brilliant and I trusted the wrong person with it. A mentor. He put his name on it and let me thank HIM for the opportunity. I never made that mistake again. I made myself un-stealable-from instead. This — the armor — it works.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'It works. It's also lonely as hell, and you deserve more than un-stealable.'", "effects": {"affection_priya": 12, "set_flags": ["priya_wall"]}, "next": "open"}, {"text": "'He was a coward. That was about him, not a flaw in you for trusting.'", "effects": {"affection_priya": 11, "set_flags": ["priya_wall"]}, "next": "open"}, {"text": "'Makes sense. Armor's smart in a place like this.'", "effects": {"affection_priya": 3}, "next": "guarded"}]}, "open": {"speaker": "Priya", "text": "...I don't cry at work. I want that on the record. This is a — a stress response. To being SEEN, which I do not consent to. ...Don't move. Just. Stay there a second. This is nice. I hate that it's nice.", "next": "openend"}, "openend": {"speaker": "", "text": "The armor's on the step beside her, and she's letting you sit next to it. For Priya, that's the most naked thing in the world.", "terminal": true}, "guarded": {"speaker": "Priya", "text": "Smart. Right. Yeah. Armor's smart. ...I thought for a second you were going to say something else. Doesn't matter. Forget it. We should get back.", "next": "guardedend"}, "guardedend": {"speaker": "", "text": "She's back behind the plate before you've finished blinking. The door in the wall was open for a moment, and you talked past it.", "terminal": true}}}, "p_a2_night": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 8. The Lighthouse offsite. Everyone's downstairs getting loud. You find Priya on the fire escape of the hotel with a bottle and two glasses, like she was waiting.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "One glass. We have a fight to finish next week and I refuse to lose because I let my guard down at an offsite. But — one glass. With you. Off the record.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Off the record — I don't actually want to beat you. I want to be next to you.'", "effects": {"affection_priya": 11}, "next": "confess"}, {"text": "'One glass. And then we go back to being terrifying rivals in the morning.'", "effects": {"affection_priya": 7}, "next": "banter"}]}, "confess": {"speaker": "Priya", "text": "...You can't say that. We have a WEEK. You can't just — say the true thing on a fire escape and expect me to have a strategy for it. I don't have a strategy for you. That's the entire problem. That's been the problem since the water cooler.", "next": "end"}, "banter": {"speaker": "Priya", "text": "Terrifying rivals in the morning. My favourite kind of person. ...But right now, on this fire escape, you're not terrifying. You're kind of the opposite. Don't let it go to your head. Okay, let it go a little to your head.", "next": "end"}, "end": {"speaker": "", "text": "One glass turns into a long, quiet hour, shoulders touching, the fight forgotten. Four weeks left, and neither of you wants the morning to come.", "terminal": true}}}, "p_a3_looms": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 9. The decision lands next week. Priya intercepts you before your morning coffee, all business again — but her eyes give her away.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "I need the real answer, not the gallant one. If they hand you the chair — do you take it? Because I need to know whether to armor up against you or not. Tell me true.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'I don't know yet. But I won't take it in a way that unmakes what we've got.'", "effects": {"affection_priya": 9}, "next": "honest"}, {"text": "'Yes. And I'd still want you. I'm not going to pretend I don't want both.'", "effects": {"affection_priya": 6, "career": 4}, "next": "both"}, {"text": "'Honestly? Half of me hopes they give it to you so I don't have to choose.'", "effects": {"affection_priya": 7}, "next": "coward"}]}, "honest": {"speaker": "Priya", "text": "That's the real answer. Good. I can plan around real. It's the pretty lies that ruin me. Thank you for not being pretty about it.", "next": "end"}, "both": {"speaker": "Priya", "text": "Both. Of course you want both, you greedy, honest thing. So do I. That's what makes this a knife fight I don't actually want to win. Fair warning: I'm still going to fight it well.", "next": "end"}, "coward": {"speaker": "Priya", "text": "Ha — the coward's hope. I've had it too. But don't wish the choice away. If they hand it to you, you take it and we deal with the mess like adults. I'd rather have the mess with you than a clean win without.", "next": "end"}, "end": {"speaker": "", "text": "She squares her shoulders and walks off to prepare for war. But she looked back once. Priya never looks back.", "terminal": true}}}, "p_a3_offer": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 10. Marcus closes the door. The lead is yours if you want it — you edged her out, barely, on the final pitch. Priya doesn't know yet. What do you do?", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Make us co-leads. She's too good to lose and so is this.'", "effects": {"affection_priya": 10, "career": 6, "set_flags": ["priya_share", "priya_respect"]}, "next": "share"}, {"text": "'I'll take it. I fought clean and I won. I won't apologize for that.'", "effects": {"career": 14, "set_flags": ["priya_took"]}, "next": "took"}, {"text": "'Give it to Priya. She's carried more scars for this than I have.'", "effects": {"affection_priya": 12, "career": -6, "set_flags": ["priya_backed", "priya_respect"]}, "next": "backed"}]}, "share": {"speaker": "Marcus", "text": "Co-leads. With Priya, of all people. That's either genius or a bloodbath waiting to happen. ...Pitch it to me properly and I'll take it up. Tell her yourself — she'll want to hear it from you, though she'd rather die than say so.", "next": "end"}, "took": {"speaker": "Marcus", "text": "It's yours. You earned it clean, and that matters. How you carry it past her desk in the next ten minutes — that's the part that decides what kind of lead you are.", "next": "end"}, "backed": {"speaker": "Marcus", "text": "You want me to give it to the person you just beat. ...That's a hell of a thing. I'll be honest, it tells me you'd have been good in the chair. Leave it with me. And be sure — Priya does not forgive being pitied.", "next": "end"}, "end": {"speaker": "", "text": "You leave the office holding your choice like something breakable. Down the aisle, Priya is about to learn what you did with the win.", "terminal": true}}}, "p_a3_react": {"start": "n1", "nodes": {"n1": {"speaker": "", "variants": [{"if": "priya_share", "text": "You find her first, before the org chart can. You tell her: you had it outright, and you asked them to split it with her.", "next": "share"}, {"if": "priya_took", "text": "She finds out from the announcement, not from you. She's at your desk before the applause dies down, unreadable.", "next": "took"}, {"text": "Word travels fast. By noon she knows you were offered the chair and told Marcus to give it to her. She corners you, furious and undone.", "next": "backed"}]}, "share": {"speaker": "Priya", "text": "You had it. CLEAN. And you asked them to hand me half of your win. Do you have any idea how that lands on a person who's spent her whole career sure she'd have to take everything alone?", "next": "sharec"}, "sharec": {"speaker": "You", "choices": [{"text": "'I don't want a version of the win where I had to beat you to get it.'", "effects": {"affection_priya": 10}, "next": "sharea"}, {"text": "'Un-stealable-from, remember? So I gave you something instead of taking one.'", "effects": {"affection_priya": 11}, "next": "sharea"}]}, "sharea": {"speaker": "Priya", "text": "...You remembered. 'Un-stealable-from.' You threw my own armor back at me as a GIFT. I am going to co-lead this launch with you and I am going to be insufferable about it and you are going to love it. Deal. Partner.", "next": "end"}, "took": {"speaker": "Priya", "text": "You won. Clean, like we said. I can't even be angry — that was the deal, and you kept it. Congratulations. Genuinely. It's just going to take me a minute to be genuine about it out loud.", "next": "tookc"}, "tookc": {"speaker": "You", "choices": [{"text": "'A clean fight was always the respect. This doesn't have to end us.'", "effects": {"affection_priya": 8}, "next": "tooka"}, {"text": "'You'd have taken it too. And I'd have congratulated you and meant it.'", "effects": {"affection_priya": 6}, "next": "tooka"}]}, "tooka": {"speaker": "Priya", "text": "...I would have taken it. And you would have been gracious, because you're irritatingly like that. Okay. Give me the weekend to be a professional about my feelings, and then — then let's see what's left when the fight's over.", "next": "end"}, "backed": {"speaker": "Priya", "text": "I did NOT ask you to do that. I don't want the chair as charity from the person I — do you have ANY idea what you've done? You've made it impossible to keep hating you as a coping strategy.", "next": "backedc"}, "backedc": {"speaker": "You", "choices": [{"text": "'It's not charity. You earned it in blood years ago. I just refused to let you lose it to me.'", "effects": {"affection_priya": 10}, "next": "backeda"}, {"text": "'I'd rather see you have it than have it myself. That's not pity. That's the truth.'", "effects": {"affection_priya": 9}, "next": "backeda"}]}, "backeda": {"speaker": "Priya", "text": "...In blood. You said in blood. Nobody has ever — okay. I'm keeping the chair. And I'm keeping you, because clearly you cannot be trusted to protect your own interests and someone has to. That someone is me now. Don't argue.", "next": "end"}, "end": {"speaker": "", "text": "One week to the gala. Whatever you two are, it survived the one thing that was built to destroy it.", "terminal": true}}}, "p_a3_before": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 11. The night before the launch and the gala. You find Priya on the fire escape, of course. It's become yours, the two of you. A rival's treaty line turned into something softer.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "Big day tomorrow. Launch goes live, the fight's finally over, and we find out what's underneath all that competing we did. Terrifying. I don't do terrifying well. Present situation excepted.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Whatever tomorrow decides about the launch — I already know what I want us to be.'", "effects": {"affection_priya": 8}, "next": "sure"}, {"text": "'One fight at a time. Let's get through tomorrow and see what's standing.'", "effects": {"affection_priya": 3}, "next": "unsure"}]}, "sure": {"speaker": "Priya", "text": "...You and your true things on fire escapes. Save me a dance tomorrow. I'll pretend to hate it. I will not, in fact, hate it. That's as close to a love confession as you're getting from me tonight.", "next": "end"}, "unsure": {"speaker": "Priya", "text": "One fight at a time. Sensible. Cowardly. Correct. ...Save me a dance anyway, in case tomorrow makes us both braver than we are right now.", "next": "end"}, "end": {"speaker": "", "text": "The city glows below the fire escape, oblivious. Tomorrow the fight ends. Whatever's been growing in its shadow finally gets to stand in the light.", "terminal": true}}}, "priya_end_partners": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Lighthouse launches to a packed, glittering room, and when leadership calls it a triumph, two names go up together — the two people who spent a whole quarter trying to out-think each other.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "Co-leads. Partners. The un-stealable-from woman, sharing a win on purpose. If you'd told me that in week one I'd have had you escorted out. And now look at us. Revolting. I love it. Don't tell anyone I said 'love.'", "next": "n3"}, "n3": {"speaker": "", "text": "She holds out her hand on the dance floor — a challenge and a surrender in the same gesture, because with Priya they were always the same thing.", "next": "n4"}, "n4": {"speaker": "Priya", "text": "You promised me a dance. Try to keep up. You never could, quite.", "next": "end"}, "end": {"speaker": "", "text": "★ TRUE ENDING — 'Rivals, Reforged'. The best fight you ever had, you both won. Fade to black. — Thanks for playing Priya's route.", "terminal": true}}}, "priya_end_spark": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Lighthouse launches. One of you got the chair; the fight is finally, genuinely over. What's left is quieter and realer than the competition ever was.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "We spent a quarter armed to the teeth and it still ended here, with me letting you see the wobbly parts. I let ONE person past the armor in five years. Congratulations, it's you. Don't waste it.", "next": "n3"}, "n3": {"speaker": "", "text": "It isn't tidy — careers rarely are, and neither is she. But she finds you across the room, drops the professional face, and stays.", "next": "end"}, "end": {"speaker": "", "text": "♥ ENDING — 'Past the Armor'. Not simple. Real, though — and with Priya, real is the rarest thing she has to give. Fade to black. — Thanks for playing Priya's route.", "terminal": true}}}, "priya_end_rivals": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Lighthouse launches. You and Priya clink glasses as the thing you both understood best — worthy rivals, clean fighters, mutual and total respect. It never quite tipped into more.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "Best competition I ever had. You kept me honest, and I don't say that to anyone. Whatever that was on the fire escape — maybe it needed a braver quarter than this one. But I respect you more than anyone in this building, and from me, that's the whole vault.", "next": "n3"}, "n3": {"speaker": "", "text": "She toasts you, sharp and sincere, and moves on. No bitterness. Just two people who sharpened each other and never quite reached for the rest.", "next": "end"}, "end": {"speaker": "", "text": "▲ ENDING — 'Worthy Rivals'. Respect without the romance. With Priya, that's no small thing. Fade to black. — Thanks for playing Priya's route.", "terminal": true}}}, "priya_end_burned": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Lighthouse launches. Across the room, Priya lifts her glass to you — polite, cold, complete. The warmth you almost had is sealed behind the armor for good.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "You played it well. I mean that. You also taught me I was right the first time — that the smart move is to trust no one, especially the ones who make you want to. So. Thank you for the reminder. It's a useful one.", "next": "n3"}, "n3": {"speaker": "", "text": "She turns back to the room, unreachable, exactly as un-stealable-from as she promised herself she'd stay. You proved her point. It wins you nothing you'll want later.", "next": "end"}, "end": {"speaker": "", "text": "— ENDING — 'Point Proven'. Some walls you help build higher. Fade to black. — Thanks for playing Priya's route. Restart from the title to try for a different one.", "terminal": true}}}, "priya_filler": {"start": "n1", "nodes": {"n1": {"speaker": "Priya", "text": "I'm three moves deep on the Lighthouse model and you're interrupting my flow. Come back when I've won this round, and bring something interesting.", "terminal": true}}}, "priya_after": {"start": "n1", "nodes": {"n1": {"speaker": "Priya", "text": "That's the whole fight, start to finish. Don't get sentimental about it. (Priya's route complete — restart from the title for a different ending, or go find someone else on this floor worth your time.)", "terminal": true}}}};
const EVENTS = [{"id": "ev_printer", "title": "Printer jam", "text": "The printer is eating Priya's final pitch deck, page by page, with audible joy. She looks about to commit a crime.", "choices": [{"text": "Wrestle the printer for her", "effects": {"affection_priya": 5, "energy": -5}, "result": "You emerge with toner on your face and her deck intact. 'Don't make it weird,' she says. It's the nicest thing she's said all week."}, {"text": "Email her the digital copy you kept", "effects": {"affection_priya": 3, "career": 2}, "result": "'You kept a backup of MY deck?' She looks suspicious, then grateful, then suspicious again."}, {"text": "Slip quietly away", "effects": {"energy": 2}, "result": "You escape. Behind you, the printer sounds like it's winning."}]}, {"id": "ev_birthday", "title": "Birthday cake", "text": "It's someone in Finance's birthday. There's a cake in the kitchen the size of a car tyre.", "choices": [{"text": "Join in, sing badly, eat cake", "effects": {"reputation": 4, "energy": 6}, "result": "You sing the worst harmony the ninth floor has ever heard. People love it."}, {"text": "Grab a slice for Noah in the corner", "effects": {"affection_noah": 5, "reputation": 1}, "if": "noticed_noah", "result": "Noah stares at the cake like nobody has ever brought him cake before. Possibly nobody has."}, {"text": "Keep working", "effects": {"career": 2}, "result": "You hear the cheering from your desk. The spreadsheet does not cheer."}]}, {"id": "ev_boss_drop", "title": "Surprise visit", "text": "Vaughn strolls the floor unannounced, asking random people 'what they're adding to Lighthouse.' He's heading your way.", "choices": [{"text": "Give a crisp two-line answer", "effects": {"career": 4, "energy": -3}, "result": "He nods, mildly impressed. 'Concise. I like concise.' You feel slightly dirty for enjoying that."}, {"text": "Credit the whole team", "effects": {"reputation": 5, "affection_marcus": 3}, "result": "'Team player,' he says, like it's a diagnosis. Marcus, across the room, gives you a tiny nod."}, {"text": "Pretend to be on a call", "effects": {"energy": 1}, "result": "You talk earnestly to nobody about 'synergies' until he leaves. Zara saw everything."}]}, {"id": "ev_wifi", "title": "Wi-Fi outage", "text": "The office Wi-Fi dies. Forty people look up from their screens and remember the others exist.", "choices": [{"text": "Start an impromptu whiteboard session", "effects": {"career": 3, "reputation": 3, "energy": -4}, "result": "Without screens, ideas fly. Marcus says 'that's solid' twice in an hour, a new record."}, {"text": "Wander to the design pod", "effects": {"affection_kai": 5, "energy": 3}, "result": "Kai is delighted. 'Analogue hour! Pencils for everyone!'"}, {"text": "Take an early lunch", "effects": {"energy": 8}, "result": "The café is empty and the soup is excellent."}]}, {"id": "ev_rain", "title": "Sudden downpour", "text": "A storm hits right as people are heading out. Zara is standing at the door without an umbrella, staring at the sky like it owes her money.", "choices": [{"text": "Share your umbrella", "effects": {"affection_zara": 6}, "result": "It's a small umbrella. You both get half-soaked and laugh the whole way to the station."}, {"text": "Lend it to her and run for it", "effects": {"affection_zara": 4, "energy": -4}, "result": "You arrive home drenched. She texts a photo of your umbrella with a heart emoji."}]}, {"id": "ev_mistake", "title": "Spotted a mistake", "text": "You notice a wrong number in the forecast that went out to the whole floor this morning. Noah built that model.", "choices": [{"text": "Tell Noah privately", "effects": {"affection_noah": 6, "career": 1}, "if": "noticed_noah", "result": "He fixes it in four minutes and sends a quiet correction. 'Thank you for not doing that in public,' he whispers."}, {"text": "Reply-all with the correction", "effects": {"career": 3, "reputation": -3}, "result": "You're right, and everyone knows you're right. Nobody thanks you for it."}, {"text": "Leave it", "effects": {}, "result": "Someone else spots it on Thursday. It causes a small, avoidable panic."}]}, {"id": "ev_lunch_invite", "title": "Lunch crowd", "text": "A group from Marketing invites you to their legendary Thursday lunch.", "choices": [{"text": "Go", "effects": {"reputation": 5, "energy": 4}, "result": "Three hours of gossip compressed into one. You learn who actually runs this building (it's the receptionist)."}, {"text": "Politely decline", "effects": {"career": 2}, "result": "They say 'next time' in a way that might mean it."}]}, {"id": "ev_fire_drill", "title": "Fire drill", "text": "The alarm goes off. Fire drill. Everyone files out to the car park. Priya is standing alone, still holding her laptop.", "choices": [{"text": "Stand with Priya and talk shop", "effects": {"affection_priya": 5}, "result": "You argue about the Lighthouse rollout for twenty minutes. It's the most fun either of you has had all week."}, {"text": "Stand with Zara and gossip", "effects": {"affection_zara": 4, "reputation": 1}, "result": "Zara has a running commentary on everyone's fire-drill outfits. It's devastating."}, {"text": "Enjoy the sunshine alone", "effects": {"energy": 6}, "result": "Ten quiet minutes in the sun. You hadn't realised how much you needed that."}]}, {"id": "ev_late_request", "title": "5pm request", "text": "At 4:58pm an urgent request lands from Vaughn's office: 'Need this tonight.'", "choices": [{"text": "Stay late and smash it", "effects": {"career": 6, "energy": -14}, "result": "Done by 10pm. Vaughn replies 'k.' One letter. For four hours."}, {"text": "Reply with a realistic deadline: tomorrow noon", "effects": {"reputation": 2, "career": 1, "affection_kai": 2}, "result": "Silence, then 'fine.' Kai overhears and silently applauds."}, {"text": "Forward it to Marcus", "effects": {"affection_marcus": 2, "career": -1}, "result": "Marcus handles it. 'Next time, push back yourself,' he says, not unkindly."}]}, {"id": "ev_plant", "title": "The office plant", "text": "The big fern by the lift is dying. Nobody owns it. Everybody has opinions.", "choices": [{"text": "Adopt it", "effects": {"reputation": 3, "affection_kai": 3}, "result": "Within two weeks it's thriving. People start calling it 'your fern.' Kai draws it a tiny crown."}, {"text": "Leave it to fate", "effects": {}, "result": "Fate, it turns out, does not water plants."}]}, {"id": "ev_coffee_run", "title": "Coffee run", "text": "You're heading out for coffee. Someone shouts, 'Get one for me!' Then everyone does.", "choices": [{"text": "Take everyone's order", "effects": {"reputation": 6, "energy": -6}, "result": "Eleven coffees, two trips, one burned hand. You're a legend by lunchtime."}, {"text": "Just get your own", "effects": {"energy": 8}, "result": "Your coffee is perfect. The looks you get on the way back are less so."}]}, {"id": "ev_award", "title": "Shout-out", "text": "Marcus mentions your work in the weekly update. Publicly. With your name in bold.", "choices": [{"text": "Thank him and share the credit with Zara", "effects": {"affection_zara": 4, "affection_marcus": 3, "reputation": 3}, "result": "Zara grins. 'Sharing credit? Who raised you? Lovely.'"}, {"text": "Enjoy it quietly", "effects": {"career": 3}, "result": "You read it three times. Then a fourth, just to be sure."}]}, {"id": "ev_noah_lunch", "title": "Empty seat", "if": "noticed_noah", "text": "Noah is eating alone at the far end of the café again, reading a statistics paper for fun.", "choices": [{"text": "Sit with him", "effects": {"affection_noah": 6, "energy": 3}, "result": "He explains Bayesian priors using a sandwich. You understand maybe half. He glows the whole time."}, {"text": "Wave and keep going", "effects": {"affection_noah": 1}, "result": "He waves back, startled and pleased."}]}, {"id": "ev_gossip", "title": "Office gossip", "text": "Someone in the kitchen asks you what you really think of Priya. Several ears lean in.", "choices": [{"text": "'She's the sharpest person on this floor.'", "effects": {"affection_priya": 4, "reputation": 2}, "result": "It gets back to Priya within the hour. She says nothing. She brings you a coffee the next day."}, {"text": "Join in the gossip", "effects": {"reputation": -4, "affection_priya": -6}, "result": "It gets back to Priya within the hour too. She says nothing. That is much worse."}, {"text": "Change the subject", "effects": {"reputation": 1}, "result": "You start talking about the weather with the intensity of a meteorologist. It works."}]}, {"id": "ev_sick", "title": "Feeling rough", "text": "You wake up with a scratchy throat and the energy of a damp towel.", "choices": [{"text": "Work from home today", "effects": {"energy": 10, "career": -2}, "result": "Tea, blankets, half-speed emails. You're better by evening."}, {"text": "Push through", "effects": {"energy": -10, "career": 2}, "result": "You make it through. Barely. Zara puts a lozenge on your keyboard without comment."}]}, {"id": "ev_mentor", "title": "Ask a question", "text": "In the all-team meeting, nobody asks a question. The silence stretches. You have one.", "choices": [{"text": "Ask it", "effects": {"career": 4, "reputation": 3, "affection_marcus": 2}, "result": "It's a good question. Marcus takes notes. Two people message you afterwards: 'I was wondering that too.'"}, {"text": "Stay quiet", "effects": {}, "result": "Someone else asks it a week later and gets the credit."}]}];
const ENDING_RULES = [{"id": "burnout", "priority": 100, "conditions": {"energy_max": 0}}, {"id": "pariah", "priority": 90, "conditions": {"reputation_max": 20}}, {"id": "outplayed", "priority": 90, "conditions": {"flag_missing": "exposed_vaughn", "career_max": 40}}, {"id": "have_it_all", "priority": 50, "conditions": {"any_affection_min": 70, "career_min": 70, "reputation_min": 60}}, {"id": "romance_zara", "priority": 30, "conditions": {"top_affection": "zara", "affection_min": 60, "flag": "zara_wall_revealed"}}, {"id": "promotion", "priority": 20, "conditions": {"career_min": 70}}, {"id": "on_your_own", "priority": 10, "conditions": {}}];

/* ------------------------------------------------------------------ data */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ------------------------------------------------------------------ persistence */
const LS = {
  get(k, d) { try { const v = localStorage.getItem("oh_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("oh_" + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem("oh_" + k); } catch (e) {} }
};
const settings = Object.assign({speed:"normal", skip:"seen", master:0.7, music:0.5, sfx:0.8, ambience:true, autoDelay:1.6}, LS.get("settings", {}));
const gallery = new Set(LS.get("gallery", []));
const seen = new Set(LS.get("seen", []));
let seenDirty = false;
function persistSeen() { if (seenDirty) { LS.set("seen", [...seen]); seenDirty = false; } }

/* ------------------------------------------------------------------ state */
let G = null;
function newState(name, avatar) {
  return {name: name || "You", avatar, week:1, day:0, slot:0, room:"office",
    energy:80, career:10, reputation:40,
    aff:{zara:0, priya:0, noah:0, marcus:0, kai:0}, flags:{},
    talked:{}, chatted:{}, hist:[], eventsSeen:[], collapses:0, warned:{},
    weekStart:null, sceneLog:[], tutorialOff:false, visited:{office:true}, x:74, y:92, ended:false};
}
const flag = f => !!(G && G.flags[f]);
function setFlag(f) { G.flags[f] = true; }

/* Saved games come from browser storage, which a user could edit by hand.
   Only accept known fields with sensible values. */
const own = (o, k) => typeof k === "string" && Object.prototype.hasOwnProperty.call(o, k);
function cleanName(v) { return String(v == null ? "" : v).replace(/[\u0000-\u001f\u007f<>]/g, "").trim().slice(0, 18); }
function loadState(raw) {
  const base = newState(); if (!raw || typeof raw !== "object") return base;
  const num = (v, lo, hi, d) => (typeof v === "number" && isFinite(v)) ? clamp(Math.round(v), lo, hi) : d;
  const S = base;
  S.name = cleanName(raw.name) || "Newbie";
  S.avatar = own(ART, raw.avatar) ? raw.avatar : "av_f2";
  S.week = num(raw.week, 1, FINAL_WEEK, 1); S.day = num(raw.day, 0, DAYS.length - 1, 0); S.slot = num(raw.slot, 0, SLOTS.length - 1, 0);
  S.room = own(ROOMS, raw.room) ? raw.room : "office";
  for (const k of ["energy", "career", "reputation"]) S[k] = num(raw[k], 0, 100, base[k]);
  for (const k in S.aff) S.aff[k] = num(raw.aff && raw.aff[k], 0, 100, 0);
  const flagObj = o => { const r = Object.create(null); if (o && typeof o === "object") for (const k in o) if (/^[a-z0-9_]{1,40}$/.test(k)) r[k] = !!o[k]; return r; };
  S.flags = flagObj(raw.flags); S.talked = flagObj(raw.talked); S.chatted = flagObj(raw.chatted); S.warned = flagObj(raw.warned);
  S.visited = Object.assign(flagObj(raw.visited), {office:true});
  S.hist = Array.isArray(raw.hist) ? raw.hist.filter(a => own(ACTIONS, a)).slice(-30) : [];
  S.eventsSeen = Array.isArray(raw.eventsSeen) ? raw.eventsSeen.filter(e => EVENTS.some(x => x.id === e)) : [];
  S.sceneLog = Array.isArray(raw.sceneLog) ? raw.sceneLog.filter(id => own(STORY, id)).slice(-200) : [];
  S.collapses = num(raw.collapses, 0, 2, 0); S.tutorialOff = !!raw.tutorialOff;
  S.x = num(raw.x, 6, 94, 74); S.y = num(raw.y, 74, 95, 92);
  S.weekScenes = num(raw.weekScenes, 0, 999, 0);
  const snap = raw.weekStart; S.weekStart = snap && typeof snap === "object" ? {energy:num(snap.energy,0,100,S.energy), career:num(snap.career,0,100,S.career), reputation:num(snap.reputation,0,100,S.reputation), aff:Object.fromEntries(Object.keys(S.aff).map(k => [k, num(snap.aff && snap.aff[k], 0, 100, S.aff[k])]))} : null;
  return S;
}
function wipeAllData() {
  try { Object.keys(localStorage).filter(k => k.startsWith("oh_")).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  gallery.clear(); seen.clear(); G = null;
}

function snapshot() { return {energy:G.energy, career:G.career, reputation:G.reputation, aff:{...G.aff}}; }

/* ------------------------------------------------------------------ audio */
const Audio = {
  ctx:null, master:null, music:null, sfx:null, amb:null, musicTimer:null,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
    this.music = this.ctx.createGain(); this.music.connect(this.master);
    this.sfx = this.ctx.createGain(); this.sfx.connect(this.master);
    this.apply();
    this.startAmbience(); this.startMusic();
  },
  apply() { if (!this.ctx) return; this.master.gain.value = settings.master; this.music.gain.value = settings.music * 0.35; this.sfx.gain.value = settings.sfx; if (this.ambGain) this.ambGain.gain.value = settings.ambience ? 0.05 : 0; },
  tone(freq, dur, type = "sine", vol = 0.2, when = 0, dest) {
    if (!this.ctx) return; const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, f1, f2, vol = 0.25, q = 1.5) {
    if (!this.ctx) return; const t = this.ctx.currentTime;
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = this.ctx.createBufferSource(); s.buffer = buf; const f = this.ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = q;
    f.frequency.setValueAtTime(f1, t); f.frequency.linearRampToValueAtTime(f2, t + dur);
    const g = this.ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.08); g.gain.linearRampToValueAtTime(0, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t);
  },
  play(name) {
    if (!this.ctx) return;
    const T = this;
    ({
      click(){ T.tone(880, .06, "sine", .08); },
      tick(){ T.tone(1400 + Math.random()*200, .02, "square", .015); },
      coffee(){ T.noise(1.2, 400, 1800, .22, 2); T.tone(220, .3, "sine", .05, 1.0); },
      type(){ for (let i = 0; i < 8; i++) T.tone(1800 + Math.random()*600, .025, "square", .03, i * 0.07); },
      chime(){ T.tone(660, .4, "sine", .12); T.tone(990, .5, "sine", .08, .08); },
      heart(){ [523, 659, 784, 1047].forEach((f, i) => T.tone(f, .3, "triangle", .12, i * .07)); },
      down(){ [494, 415, 349].forEach((f, i) => T.tone(f, .3, "sine", .12, i * .09)); },
      warn(){ T.tone(330, .18, "square", .07); T.tone(330, .18, "square", .07, .25); },
      door(){ T.noise(.35, 180, 90, .3, .8); T.tone(110, .2, "sine", .1, .25); },
      step(){ T.noise(.06, 300, 200, .05, 1); },
      good(){ T.tone(784, .12, "triangle", .12); T.tone(1175, .2, "triangle", .1, .08); },
      miss(){ T.tone(160, .15, "sawtooth", .05); },
      page(){ T.noise(.18, 2500, 4000, .06, .7); },
    }[name] || (() => {}))();
  },
  motif(key) {
    const c = CAST[key]; if (!this.ctx || !c) return;
    const base = 392; c.motif.forEach((s, i) => this.tone(base * Math.pow(2, s / 12), .45, c.wave, c.wave === "sawtooth" || c.wave === "square" ? .05 : .11, i * .16, this.music));
  },
  startAmbience() {
    if (!this.ctx) return; const len = this.ctx.sampleRate * 3; const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    const s = this.ctx.createBufferSource(); s.buffer = buf; s.loop = true; const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 380;

/* ------------------------------------------------------------------ dance-off */
const Dance = {
  on:false, notes:[], score:0, hits:0, total:0, start:0, raf:0, combo:0,
  COLORS:["#ff6b8b","#5b8def","#2fb171","#f2a33a"], ARROWS:["←","↓","↑","→"],
  run() {
    this.on = true; this.notes = []; this.score = 0; this.hits = 0; this.combo = 0; const D = $("#dance"); D.classList.add("on");
    $("#lanes").innerHTML = ""; $("#pads").innerHTML = "";
    for (let i = 0; i < 4; i++) {
      const l = el("div", "lane", '<div class="hitline"></div>'); $("#lanes").appendChild(l);
      const p = el("button", "", this.ARROWS[i]); p.style.background = this.COLORS[i];
      p.addEventListener("pointerdown", ev => { ev.preventDefault(); this.hit(i); }); $("#pads").appendChild(p);
    }
    const bpm = 112, beat = 60 / bpm; let t = 2.2; const pattern = [];
    for (let b = 0; b < 30; b++) { if (Math.random() < .78) pattern.push({lane:Math.floor(Math.random() * 4), t}); if (b % 4 === 3 && Math.random() < .4) pattern.push({lane:Math.floor(Math.random() * 4), t:t + beat / 2}); t += beat; }
    this.total = pattern.length; this.end = t + 1.5;
    this.notes = pattern.map(n => { const e = el("div", "note", this.ARROWS[n.lane]); e.style.background = this.COLORS[n.lane]; $("#lanes").children[n.lane].appendChild(e); return {...n, e, done:false}; });
    this.start = performance.now() / 1000;
    if (Audio.ctx) { for (let b = 0; b < 34; b++) { const w = 2.2 + b * beat - 1.55; if (w > 0) { Audio.tone(b % 4 === 0 ? 110 : 165, .12, "sine", b % 4 === 0 ? .35 : .15, w, Audio.music); Audio.tone(330 * Math.pow(2, [0,4,7,9][b % 4] / 12), .18, "triangle", .06, w, Audio.music); } } }
    const loop = () => {
      const now = performance.now() / 1000 - this.start; const fall = 1.55;
      this.notes.forEach(n => { if (n.done) return; const p = 1 - (n.t - now) / fall; n.e.style.top = `calc(${p * 92}% - 8%)`; n.e.style.display = p < -0.05 ? "none" : "flex"; if (now - n.t > .22) { n.done = true; n.e.style.opacity = .2; this.combo = 0; this.judge("Miss", "#9aa1b2"); } });
      $("#dscore").innerHTML = `💃 DANCE-OFF · ${this.hits}/${this.total} hits · combo ${this.combo}<div class="small" style="color:#ccc">Arrow keys / WASD, or tap the pads</div>`;
      if (now > this.end) return this.finish();
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },
  hit(lane) {

    if (!c) { Audio.play("miss"); return; }
    c.done = true; c.e.style.display = "none"; this.hits++; this.combo++; Audio.play("good");

  },
  judge(t, color) { const j = $("#djudge"); j.textContent = t; j.style.color = color; j.classList.remove("on"); void j.offsetWidth; j.classList.add("on"); },
  finish() {

    const acc = this.total ? this.hits / this.total : 0; const mult = diminish("dance");
    G.hist.push("dance"); setFlag("danced");
    const rep = Math.round(2 + 8 * acc);
    const watchers = Object.keys(CAST).filter(k => whereIs(k) === G.room && !isHidden(k));

    const d = applyEffects(fx, {mult}); announce(d);
    toast(`💃 ${grade}. ${Math.round(acc * 100)}% accuracy.${watchers.length ? " " + watchers.map(k => CAST[k].name).join(" & ") + " saw everything." : ""}`, "good");
    endSlot();
  }
};

    Dialogue.start(s.id, s.track, run);
  };
  fadeThen(() => { G.room = "rooftop"; renderRoom(); }, run);
}
function gameOver(id) {
  unlock(id);
  fadeThen(() => {}, () => Dialogue.start(id, null, () => results([id])));
}
function results(ids) {
  G.ended = true; LS.del("auto");
  const items = ids.map(id => { const e = ENDINGS.find(x => x.id === id); const K = KIND[e.kind]; return `<div class="tile end"><div class="k" style="color:${K[1]}">${K[0]}${e.who ? " · " + CAST[e.who].name : ""}</div><h4>${esc(e.title)}</h4></div>`; }).join("");
  const n = ENDINGS.filter(e => gallery.has(e.id)).length;
  openSheet(`<h2>Thanks for playing, ${esc(G.name)}</h2><div class="grid g2">${items}</div>
    <p style="margin-top:.8em">Final meters: ⚡ ${G.energy} · 💼 ${G.career} · ⭐ ${G.reputation}<br>Endings collected: <b>${n}/${ENDINGS.length}</b></p>
    <p class="small">Lines you have already read can be skipped next time, so a replay goes much faster.</p>
    <div class="row" style="display:flex;gap:.5em;flex-wrap:wrap"><button class="btn primary" id="r-new">Play again</button><button class="btn" id="r-gal">🏆 See all endings</button><button class="btn" id="r-title">Title screen</button></div>`, false);
  $("#r-new").addEventListener("click", () => { closeSheet(true); showTitle(); newGameScreen(); });
  $("#r-gal").addEventListener("click", () => { openGallery(); });
  $("#r-title").addEventListener("click", () => { closeSheet(true); showTitle(); });
}

/* ------------------------------------------------------------------ title */
function showTitle() {
  const T = $("#title"); T.style.display = "flex"; T.style.backgroundImage = `url(${ART.bg_office.src})`;
  const auto = LS.get("auto", null); const n = ENDINGS.filter(e => gallery.has(e.id)).length;
  T.innerHTML = `<div class="inner"><h1>Office Hours</h1><div class="sub">One quarter. Five colleagues. Twenty-six endings.</div><div class="menu">
    ${auto ? `<button class="btn primary" id="t-cont">Continue · ${saveSummary(auto).split(" · ")[0]}</button>` : ""}
    <button class="btn ${auto ? "" : "primary"}" id="t-new">New game</button>
    <button class="btn" id="t-load">Load game</button>
    <button class="btn" id="t-gal">Endings gallery · ${n}/${ENDINGS.length}</button>
    <button class="btn" id="t-set">Settings</button>
    <button class="btn ghostbtn" id="t-help">📋 How to play · 2 min</button></div></div>`;
  if (auto) $("#t-cont").addEventListener("click", () => { G = loadState(auto.state); hideTitle(); fadeThen(renderRoom); });
  $("#t-new").addEventListener("click", newGameScreen);
  $("#t-load").addEventListener("click", () => openSaves("load"));
  $("#t-gal").addEventListener("click", openGallery);
  $("#t-set").addEventListener("click", openSettings);
  $("#t-help").addEventListener("click", openHelp);
}
function hideTitle() { $("#title").style.display = "none"; }
function ensureLook() { if (G && G.avatar === "you") { G.avatar = "av_f2"; delete G.look; } }
function newGameScreen() {
  openSheet(`<div class="ng"><div class="ng-pic"><div class="ng-glow"></div><img alt="You" src="${ART.av_f2.src}"></div>
    <div class="ng-form"><div class="g-kicker">🪪 NEW STARTER</div><h2 style="margin:.15em 0 .3em">Your first day at Meridian</h2>
      <p class="small">You've just joined Project Lighthouse on the ninth floor. The launch gala is in twelve weeks. Everything else is up to you.</p>
      <label for="nm">What should people call you?</label><span class="small" style="display:block;margin:-.1em 0 .3em">Stays on this device. Nothing is sent anywhere.</span><input type="text" id="nm" maxlength="18" placeholder="Your name">
      <div class="ng-badge"><div class="ng-strap"></div><div class="ng-card"><span>MERIDIAN · PROJECT LIGHTHOUSE</span><b id="ng-name">GUSET</b><em>New starter · Floor 9</em></div></div>
      <button class="btn primary" id="ng-go">Clock in for Week 1 →</button></div></div>`);
  $("#nm").addEventListener("input", () => { const v = $("#nm").value.trim(); $("#ng-name").textContent = v ? v.toUpperCase() : "GUSET"; });
  $("#ng-go").addEventListener("click", () => {
    G = newState(cleanName($("#nm").value) || "Newbie", "av_f2"); G.weekStart = snapshot(); G.weekScenes = 0;
    closeSheet(true); hideTitle();
    const firstTime = !LS.get("guided", false);
    fadeThen(renderRoom, () => { if (firstTime) openHelp(); else toast("Welcome to Meridian. Tap Zara (with the pink !) to begin.", "good"); });
  });
}

showTitle();
</script>
</body>
</html>
