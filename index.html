he bathroom for a while. We'll talk. Later. When it doesn't feel like this.", "next": "end"}, "cold": {"speaker": "Zara", "text": "...Maybe I would have. But I'd have told you to your face first. That's the whole difference, and it turns out it's the entire thing.", "next": "end"}, "end": {"speaker": "", "text": "The office is yours. There's a crack running through the other thing now, and you'll spend the last stretch finding out if it can be mended — or if this was the trade all along.", "terminal": true}}}, "a3_reaction_aside": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Word travels before you can. By afternoon Zara knows you were offered the lead — and told Marcus to give it to her instead. She corners you by the rooftop door, furious and glassy-eyed.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "I didn't ASK you to do that. I don't want to win it because you handed it to me out of some — some grand gesture. What am I supposed to do with that?", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'You didn't need me to hand it to you. You needed someone to stop pretending you hadn't already earned it.'", "effects": {"affection_zara": 10}, "next": "a"}, {"text": "'I'd rather see you have it than have it myself. That's not a gesture. That's just true.'", "effects": {"affection_zara": 9}, "next": "a"}]}, "a": {"speaker": "Zara", "text": "...God, you infuriating, generous idiot. You don't get to be this person and also expect me not to fall completely — okay. Okay. I'm keeping it. And I'm keeping you. Both. Don't argue.", "next": "end"}, "end": {"speaker": "", "text": "She's angry and she's undone and she's yours, all at once. One week to the gala.", "terminal": true}}}, "a3_marcus_final": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Marcus catches you at the coffee point. No door to close here, so he just lowers his voice.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "Whatever shakes out at the gala — the launch, the title, you and Zara, which is not as much of a secret as you two think — I want to say one thing. In fifteen years here, the people who lasted weren't the ones who won the most. They were the ones who stayed someone they could live with. You're on the right list. Don't fall off it.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'That means a lot coming from you, Marcus.'", "effects": {"affection_marcus": 5, "reputation": 4}, "next": "a"}, {"text": "'Was it that obvious? Me and Zara?'", "effects": {"affection_zara": 4}, "next": "b"}]}, "a": {"speaker": "Marcus", "text": "It's meant to. Now go get ready. Wear the good shoes. Big nights deserve the good shoes.", "next": "end"}, "b": {"speaker": "Marcus", "text": "You finish each other's slides and you fight like people who are scared of how much they like each other. Painfully obvious. It's fine. It's good, actually. Just don't let the launch decide it for you.", "next": "end"}, "end": {"speaker": "", "text": "He wanders off with his coffee. Somehow the weight on your shoulders sits a little easier.", "terminal": true}}}, "a3_before": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 11. The night before the launch and the gala. You find Zara on the rooftop, of course. Where else would either of you be.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "Big day tomorrow. Lighthouse goes live, everyone gets dressed up, and we find out what we actually are — the project and the... us.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Whatever the launch does tomorrow, I already know what I want us to be.'", "effects": {"affection_zara": 8}, "next": "sure"}, {"text": "'One thing at a time. Let's get through tomorrow and see.'", "effects": {"affection_zara": 3}, "next": "unsure"}]}, "sure": {"speaker": "Zara", "text": "Yeah. Me too. Save me a dance tomorrow. Don't make it weird. ...Actually, do make it a little weird. That's kind of our whole thing now.", "next": "end"}, "unsure": {"speaker": "Zara", "text": "Fair. One thing at a time. ...Save me a dance anyway. Just in case tomorrow decides to be brave for us.", "next": "end"}, "end": {"speaker": "", "text": "The city glows below you, indifferent and beautiful. Tomorrow, everything you've built — the project and the person — finally comes due.", "terminal": true}}}, "a3_prep": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Gala day. Kai ambushes you an hour before with a garment bag and the intensity of a general.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "Absolutely not, you were going to wear THAT? On the night the whole quarter comes to a head AND you make your move? Over my beautifully-dressed body. Sit. Trust the process.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Kai — what if tonight doesn't go the way I want?'", "effects": {"affection_kai": 4}, "next": "nerves"}, {"text": "'Make me look like someone she can't look away from.'", "effects": {"affection_zara": 5, "affection_kai": 4}, "next": "confident"}]}, "nerves": {"speaker": "Kai", "text": "Then it doesn't, and you'll survive it in a truly excellent jacket, which is more than most people can say about their heartbreak. But it's going to go the way you want. I've seen how she looks at you. Now — shoulders back.", "next": "end"}, "confident": {"speaker": "Kai", "text": "Oh, THAT'S the energy. Yes. Okay. When you walk into that room, walk in like the launch already went perfectly and so did the rest of your life. Confidence is the accessory. Also this jacket. Go.", "next": "end"}, "end": {"speaker": "", "text": "You look in the mirror and barely recognise the person looking back — steadier, ready. It's time. The gala. The launch. Her. Go find Zara.", "terminal": true}}}, "zara_end_both": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Lighthouse goes live to a room full of applause and one wildly over-catered dessert table.", "next": "n2"}, "n2": {"speaker": "", "text": "You built it honestly and you built it together — and when leadership calls the launch a triumph, they say both your names in the same breath. No knives. No quiet cost. Just the work, and the truth of it, standing up in front of everyone.", "next": "n3"}, "n3": {"speaker": "Priya", "text": "Co-leads. Ugh. It's revoltingly charming and it clearly works. Congratulations, both of you. I hate it. Save me a seat at whatever you build next.", "next": "n4"}, "n4": {"speaker": "Zara", "text": "We actually did it. The job AND the terrifying other thing. Turns out I could have both the whole time. Turns out you just have to be brave enough — and stubborn enough — to refuse to pick.", "next": "n5"}, "n5": {"speaker": "", "text": "The band starts up. She holds out her hand on the dance floor, in front of the whole company, and doesn't let go.", "next": "n6"}, "n6": {"speaker": "Zara", "text": "You promised me a dance. Make it a little weird. It's our thing.", "next": "end"}, "end": {"speaker": "", "text": "★ TRUE ENDING — 'Both of Us'. You didn't win the game by beating her. You won it by refusing to. Fade to black. — Thanks for playing Zara's route.", "terminal": true}}}, "zara_end_longway": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Lighthouse launches. The applause is real — and so is the tension you two never quite finished untangling this quarter.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "We took the long way here. Some cold weeks. A fortress I built and made you talk me out of, brick by brick. But you stayed the whole time. Do you know how rare that is? You just... stayed.", "next": "n3"}, "n3": {"speaker": "", "text": "One of you got the lead; the other got an honest, warm 'next time' and meant it. It isn't tidy. Careers rarely are. But she finds you by that ridiculous dessert table, and she stays, and that's the part that was ever going to matter.", "next": "n4"}, "n4": {"speaker": "Zara", "text": "For the record — I'd take the long way again. As long as it ends with you at the weird dessert table.", "next": "end"}, "end": {"speaker": "", "text": "♥ BITTERSWEET ENDING — 'The Long Way'. Not perfect. Real, though. Real was always the point. Fade to black. — Thanks for playing Zara's route.", "terminal": true}}}, "zara_end_corner": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. You are the new lead of Lighthouse. The corner office is yours. You earned it — mostly. You earned it the way winners usually do, with a few things left off the receipt.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "Congratulations. Genuinely — no bitterness, I'm too tired for bitterness. You were good. You were also willing to be a little ruthless when it counted, and I noticed. I always notice. It's my gift and my personality flaw, remember.", "next": "n3"}, "n3": {"speaker": "", "text": "She lifts her glass, a professional smile locked in place, and moves on to the next conversation. Across the room Vaughn raises his own glass to you, one operator to another. It doesn't feel like the compliment he thinks it is.", "next": "n4"}, "n4": {"speaker": "", "text": "The office is yours. The desk beside it is already being cleared for whoever comes next. It's very quiet up here in the corner.", "next": "end"}, "end": {"speaker": "", "text": "▲ CAREER ENDING — 'The Corner Office'. You got exactly what you came for. Every bit of it. Fade to black. — Thanks for playing Zara's route.", "terminal": true}}}, "zara_end_colleagues": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Lighthouse launches. You and Zara clink glasses as exactly what you always safely stayed: colleagues. Good ones. Nothing more, in the end.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "Good run, neighbour. We made a genuinely decent team. And that almost-thing, a few weeks back, up on the roof — I guess we'll just never quite know, will we.", "next": "n3"}, "n3": {"speaker": "", "text": "There's no bad blood. No dramatic goodbye. Just a door that neither of you ever fully walked through, swinging gently shut on its own while the band plays something you'll both half-remember later.", "next": "end"}, "end": {"speaker": "", "text": "— ENDING — 'Just Colleagues'. Some stories stay in the maybe. Fade to black. — Thanks for playing Zara's route. Restart from the title to try for a different one.", "terminal": true}}}, "zara_filler": {"start": "n1", "nodes": {"n1": {"speaker": "Zara", "text": "Heads-down right now — chasing a deadline that's chasing me back. Catch me later, yeah? Preferably with the good coffee.", "terminal": true}}}, "zara_after": {"start": "n1", "nodes": {"n1": {"speaker": "Zara", "text": "That's the whole story, for now. Thanks for playing it out with me, GUSET. (Zara's route complete — restart from the title for a different ending, or go build the next character's route.)", "terminal": true}}}, "end_burnout": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "You don't remember deciding to sit down on the office floor. You just are there, suddenly, and the room is very far away.", "next": "n2"}, "n2": {"speaker": "", "text": "The doctor says 'exhaustion' the way a mechanic says 'engine.' Three weeks of mandatory rest. Lighthouse launches without you.", "next": "n3"}, "n3": {"speaker": "", "text": "✖ ENDING: 'Burnout.' Energy is a meter for a reason. Next time, drink the coffee, take the lunch, sit on the rooftop.", "terminal": true}}}, "end_pariah": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Conversations stop when you walk up to them. Your invitation, you notice, came last.", "next": "n2"}, "n2": {"speaker": "", "text": "You did the work. Nobody wanted to do it with you. On Monday, HR suggests 'a fresh start in another department.'", "next": "n3"}, "n3": {"speaker": "", "text": "✖ ENDING: 'Pariah.' Reputation is how the building feels about you when you're not in the room.", "terminal": true}}}, "end_outplayed": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Vaughn gives the launch speech. He thanks 'the team' and names none of you. Then he names himself, twice.", "next": "n2"}, "n2": {"speaker": "", "text": "The restructure memo lands on Monday. Your role is 'realigned.' Vaughn smiles at you in the lift like a cat at a bird feeder.", "next": "n3"}, "n3": {"speaker": "", "text": "✖ ENDING: 'Outplayed.' Somebody had to stand up to Vaughn. Nobody did.", "terminal": true}}}, "end_have_it_all": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. You're on the stage for the launch toast. Someone you love is in the front row. Half the floor cheers your name.", "next": "n2"}, "n2": {"speaker": "", "text": "Nobody gets it all. But tonight, for one evening, it looks very much like you did.", "next": "n3"}, "n3": {"speaker": "", "text": "★ ULTIMATE ENDING: 'Have It All.' Career, reputation and love, all at once. Rare. Earned.", "terminal": true}}}, "end_promotion": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Your name is on the new org chart, one line higher than it was in Week 1.", "next": "n2"}, "n2": {"speaker": "", "text": "You go home alone, a little tired, very proud, with a better title and a heavier inbox.", "next": "n3"}, "n3": {"speaker": "", "text": "▲ CAREER ENDING: 'Promotion.' The work paid off.", "terminal": true}}}, "end_on_your_own": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Lighthouse launches. You clap with everyone else. It was a good quarter. Not a remarkable one.", "next": "n2"}, "n2": {"speaker": "", "text": "Walking home, you think about all the people you meant to get to know better. There's always next quarter.", "next": "n3"}, "n3": {"speaker": "", "text": "○ ENDING: 'On Your Own.' Life in the middle of the org chart. Try another route?", "terminal": true}}}, "k_a1_pod": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 1. The design pod looks like a bookshop exploded inside a greenhouse. Kai is pinning colour swatches to a board, humming.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "Fresh blood! Settle an argument for me. Lighthouse launch screen: calm ocean blue, or 'the future is now' electric violet?", "next": "n3"}, "n3": {"speaker": "You", "choices": [{"text": "'Violet. Make them feel something.'", "effects": {"affection_kai": 7}, "next": "violet"}, {"text": "'Blue. People trust blue.'", "effects": {"affection_kai": 4, "career": 2}, "next": "blue"}, {"text": "'Why not the green from your plant there? It's lovely.'", "effects": {"affection_kai": 8}, "next": "green"}]}, "violet": {"speaker": "Kai", "text": "YES. Finally, someone with a pulse. Marcus said violet was 'a lot.' Marcus thinks beige is 'a lot.'", "next": "end"}, "blue": {"speaker": "Kai", "text": "Ugh, sensible. Correct, probably. I'll make the blue sing, just for you.", "next": "end"}, "green": {"speaker": "Kai", "text": "...Oh. Oh, that's actually perfect. That's alive. You just did my job better than me in four seconds. Rude. I love it.", "next": "end"}, "end": {"speaker": "Kai", "text": "Come back any time. The pod has snacks and zero deadlines we respect.", "terminal": true}}}, "k_a1_lunch": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 2. You're eating a sad sandwich over your keyboard when a shadow falls across your desk.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "Absolutely not. Lunch is not a keyboard activity. Come on. Café. Real food. Laptops stay here, they'll survive without us.", "next": "n3"}, "n3": {"speaker": "You", "choices": [{"text": "Close the laptop and go.", "effects": {"affection_kai": 8, "energy": 8}, "next": "go"}, {"text": "'I have a deadline at two.'", "effects": {"affection_kai": 2, "career": 2}, "next": "deadline"}]}, "go": {"speaker": "", "text": "Down in the café, Kai orders for both of you without asking, and is right about everything.", "next": "n5"}, "n5": {"speaker": "Kai", "text": "See? You look human again. People forget that the work gets better when you leave it alone for an hour.", "next": "end"}, "deadline": {"speaker": "Kai", "text": "There's always a deadline at two. There'll be one at two tomorrow, and the day after. I'll bring you a muffin. That's my compromise.", "next": "n7"}, "n7": {"speaker": "", "text": "Twenty minutes later, a muffin appears beside your keyboard, with a tiny drawing of you on the napkin, scowling at a spreadsheet.", "next": "end"}, "end": {"speaker": "", "text": "You catch yourself smiling at nothing in particular for the rest of the afternoon.", "terminal": true}}}, "k_a1_sketch": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 3. Lunch on the rooftop. Kai is sketching the skyline and, you slowly realise, also you.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "Don't move. You've got a very good 'thinking about something you shouldn't be' face. It's very drawable.", "next": "n3"}, "n3": {"speaker": "You", "choices": [{"text": "Hold still and let them finish.", "effects": {"affection_kai": 7}, "next": "still"}, {"text": "Lean over to see the sketchbook.", "effects": {"affection_kai": 5}, "next": "peek"}, {"text": "'What are you thinking about, when you draw?'", "effects": {"affection_kai": 8}, "next": "think"}]}, "still": {"speaker": "", "text": "Ten minutes. You don't move. Kai tears the page out and hands it to you. It's really, really good.", "next": "end"}, "peek": {"speaker": "Kai", "text": "Hey! Unfinished work is private. ...Fine. It's you, looking out at the city like you're trying to decide whether to jump into it.", "next": "end"}, "think": {"speaker": "Kai", "text": "Honestly? That I'm happy. It's a weird thing to notice. I didn't used to be. Drawing is how I check.", "next": "end"}, "end": {"speaker": "", "text": "The sketch ends up pinned to your monitor. People ask who drew it. You find you like saying their name.", "terminal": true}}}, "k_a2_crunch": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 4. After the all-hands. Marcus announces mandatory weekend work until launch. The floor groans. Kai doesn't groan. Kai stands up.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "I'll do my hours, and I'll do them brilliantly. But I'm not working weekends. Not again. I'll put it in writing if you'd like.", "next": "n3"}, "n3": {"speaker": "", "text": "Later, in the pod, Kai is shaking slightly and pretending not to be.", "next": "n4"}, "n4": {"speaker": "You", "choices": [{"text": "'That took guts. Why does it matter so much to you?'", "effects": {"affection_kai": 9, "set_flags": ["kai_values_clash"]}, "next": "why"}, {"text": "'You might have just made yourself a target.'", "effects": {"affection_kai": 3, "career": 2}, "next": "target"}, {"text": "'I'm going to work the weekends. I need this launch.'", "effects": {"affection_kai": 1, "career": 4, "set_flags": ["kai_values_clash"]}, "next": "honest"}]}, "why": {"speaker": "Kai", "text": "Because the last place I worked, I said yes to every weekend for two years. Then one Tuesday I couldn't get out of bed. I'm not going back there. Not for any launch.", "next": "end"}, "target": {"speaker": "Kai", "text": "Maybe. Probably. Better a target than a ghost. I've been a ghost, it's worse.", "next": "end"}, "honest": {"speaker": "Kai", "text": "...Okay. That's honest, and I respect honest. Just promise me you'll notice if it starts costing more than it's paying.", "next": "end"}, "end": {"speaker": "", "text": "On your way home you realise Kai is the only person on the floor who looked relieved after the meeting. Everyone else just looked tired.", "terminal": true}}}, "k_a2_tired": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 5. You've had four hours of sleep. Your eyes feel like they've been sandpapered. Kai puts a hand flat on your keyboard.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "Okay. Intervention. Afternoon off. Rooftop, me, a terrible paperback and a flask of tea. Marcus will survive.", "next": "n3"}, "n3": {"speaker": "You", "choices": [{"text": "Take the afternoon off with Kai.", "effects": {"affection_kai": 9, "energy": 25, "career": -3, "set_flags": ["kai_balance"]}, "next": "off"}, {"text": "'An hour. I can give you an hour.'", "effects": {"affection_kai": 6, "energy": 12}, "next": "hour"}, {"text": "'Kai, I can't. Not this week.'", "effects": {"affection_kai": -2, "career": 3}, "next": "no"}]}, "off": {"speaker": "", "text": "You nap on a rooftop bench with your head on a rolled-up jacket while Kai reads aloud from the worst detective novel ever written. It is the best afternoon of the quarter.", "next": "end"}, "hour": {"speaker": "Kai", "text": "An hour I can work with. Phone in my bag. No, the whole phone. Thank you.", "next": "end"}, "no": {"speaker": "Kai", "text": "Not this week. It's never this week. ...Okay. I'll stop pushing. But the offer doesn't expire.", "next": "end"}, "end": {"speaker": "", "text": "Kai doesn't say 'I told you so' later. They just quietly leave a bottle of water on your desk every morning that week.", "terminal": true}}}, "k_a2_market": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 6. Friday, 6pm. Kai leans over the partition with a flyer for a Saturday flea market.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "Vintage lamps, terrible jewellery, dumplings the size of your fist. I go every month. Come with me. Bring nothing but appetite.", "next": "n3"}, "n3": {"speaker": "You", "choices": [{"text": "'I'm in. I'll even leave my laptop at home.'", "effects": {"affection_kai": 9, "energy": 10, "set_flags": ["kai_balance", "kai_date"]}, "next": "yes"}, {"text": "'I've got launch prep. Rain check?'", "effects": {"affection_kai": -1, "career": 4}, "next": "no"}]}, "yes": {"speaker": "", "text": "Saturday. Kai haggles for a hideous ceramic frog with total conviction and gives it to you. You eat dumplings on a kerb. Nobody mentions Lighthouse once.", "next": "n5"}, "n5": {"speaker": "Kai", "text": "This. This is what I mean. Life is supposed to have a weekend in it. ...Thanks for coming. Really.", "next": "end"}, "no": {"speaker": "Kai", "text": "Rain check. Sure. My rain checks expire, by the way. Very quietly. Just so you know.", "next": "end"}, "end": {"speaker": "", "text": "Monday morning, there's a tiny drawing of a ceramic frog on a sticky note on your screen.", "terminal": true}}}, "k_a2_why": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 7. Late. Kai is still at the office, which is so unusual that you stop.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "Don't look at me like that. I'm leaving in five minutes. I just... got an email from my old agency. They want me back. Double the money.", "next": "n3"}, "n3": {"speaker": "Kai", "text": "It would be the same thing again. The weekends. The 2am calls. The bit where I stop drawing for fun. But it's double the money.", "next": "n4"}, "n4": {"speaker": "You", "choices": [{"text": "'You already know the answer. You told it to me in week four.'", "effects": {"affection_kai": 9, "set_flags": ["kai_open"]}, "next": "know"}, {"text": "'Double is a lot. Maybe it'd be different this time.'", "effects": {"affection_kai": -3, "career": 1}, "next": "money"}, {"text": "'Whatever you choose, I'll still be here.'", "effects": {"affection_kai": 7, "set_flags": ["kai_open"]}, "next": "here"}]}, "know": {"speaker": "Kai", "text": "...Yeah. I did. I just wanted someone to say it back to me in my own words. Thanks. Delete. Done.", "next": "end"}, "money": {"speaker": "Kai", "text": "Maybe. People always think it'll be different. ...I'm going to sleep on it.", "next": "end"}, "here": {"speaker": "Kai", "text": "That's... a very good reason not to go somewhere else, actually. Huh.", "next": "end"}, "end": {"speaker": "", "text": "They switch the lamp off, and for once they leave before you do.", "terminal": true}}}, "k_a2_deadline": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 8. The launch visuals are late. Marcus wants them tonight. Kai has already left, on time, as promised.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "I need those files by morning. Can you reach Kai, or do I need to escalate?", "next": "n3"}, "n3": {"speaker": "You", "choices": [{"text": "'I'll finish what I can myself. Leave Kai out of it tonight.'", "effects": {"affection_kai": 8, "energy": -15, "career": 2}, "next": "cover"}, {"text": "Call Kai and ask them to come back in.", "effects": {"affection_kai": -5, "career": 3}, "next": "call"}, {"text": "'Give us until noon. They'll be better for it.'", "effects": {"affection_kai": 6, "career": -1, "reputation": 2}, "next": "noon"}]}, "cover": {"speaker": "", "text": "You stay until midnight wrestling with layer masks. Your version is functional. Kai's version, at 9am, is art. They see your file and go very quiet.", "next": "n5"}, "n5": {"speaker": "Kai", "text": "You did this for me? Badly — sorry, but badly. You did it badly for me. Nobody's ever done anything badly for me before.", "next": "end"}, "call": {"speaker": "Kai", "text": "...Right. Of course. I'm coming in. It's fine. It's fine. It's fine.", "next": "n7"}, "n7": {"speaker": "", "text": "It is not fine. You can hear it in the way they say it three times.", "next": "end"}, "noon": {"speaker": "Marcus", "text": "Noon. Not a minute later. ...You're getting good at this, you know. Protecting people.", "next": "end"}, "end": {"speaker": "", "text": "The files arrive at 11:52, and they are gorgeous.", "terminal": true}}}, "k_a3_offer": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 10. Kai finds you at the café with a printed email and a face that can't decide what it's doing.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "A studio across the sea wants me. Four-day week. Design lead. They saw the Lighthouse visuals. It's the dream. It's also very, very far from here.", "next": "n3"}, "n3": {"speaker": "You", "choices": [{"text": "'Go. And let me visit on all your Fridays off.'", "effects": {"affection_kai": 9, "set_flags": ["kai_balance"]}, "next": "go"}, {"text": "'Stay. Make this place better instead. With me.'", "effects": {"affection_kai": 8}, "next": "stay"}, {"text": "'That's amazing. You should take it.'", "effects": {"affection_kai": 3}, "next": "polite"}]}, "go": {"speaker": "Kai", "text": "...You'd visit. On Fridays. You'd take Fridays off to visit me. Who even are you now? I'm so proud of you, it's unbearable.", "next": "end"}, "stay": {"speaker": "Kai", "text": "With you. Okay. That's... a bigger reason than a four-day week, possibly. Let me sit with it.", "next": "end"}, "polite": {"speaker": "Kai", "text": "Yeah. Yeah, I should. Thanks. ...I kind of hoped you'd say something else. Ignore me.", "next": "end"}, "end": {"speaker": "", "text": "Kai folds the email into a tiny paper frog and puts it in your pocket.", "terminal": true}}}, "k_a3_before": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 11. Launch week. Kai's violet-and-plant-green launch screen goes up in the lobby. People stop to take photos of it.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "They're photographing my colours. My actual colours. ...Gala's next week. Are you going to look at me like that at the gala? Because I'll need to prepare.", "next": "n3"}, "n3": {"speaker": "You", "choices": [{"text": "'I'm going to look at you exactly like this.'", "effects": {"affection_kai": 8}, "next": "yes"}, {"text": "'Like what?' (You know exactly like what.)", "effects": {"affection_kai": 6}, "next": "coy"}]}, "yes": {"speaker": "Kai", "text": "Okay. Good. Preparing. Heavily.", "next": "end"}, "coy": {"speaker": "Kai", "text": "Like the plant-green. Alive. Don't pretend. I've drawn your face too many times to fall for it.", "next": "end"}, "end": {"speaker": "", "text": "The gala is next week.", "terminal": true}}}, "kai_end_together": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Kai's launch screen glows violet and green behind the stage. At exactly 10pm, they find you and hold out a hand.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "It's ten. We said we'd leave at ten, remember? Real life. Dumplings. The frog misses you.", "next": "n3"}, "n3": {"speaker": "", "text": "You leave a work party early, on purpose, laughing, hand in hand. Behind you the gala goes on perfectly well without you.", "next": "n4"}, "n4": {"speaker": "", "text": "Months later there's a four-day week, a flat with too many plants, and a sketchbook full of you.", "next": "n5"}, "n5": {"speaker": "", "text": "♥ ROMANCE ENDING: 'Log Off.' You chose a life with a weekend in it, and someone to share it with. Thanks for playing Kai's route.", "terminal": true}}}, "kai_end_almost": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Kai dances with everyone, and with you twice. But at ten they leave, and you stay for the after-party with the directors.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "You're brilliant, you know. I just can't be the person waiting for you to log off. Call me when you're ready. I mean it. I'll pick up.", "next": "n3"}, "n3": {"speaker": "", "text": "♡ BITTERSWEET ENDING: 'Call Me When You Log Off.' The feeling was real. The timing wasn't. Thanks for playing Kai's route.", "terminal": true}}}, "kai_end_friends": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Kai drags you onto the dance floor and declares you their 'official work best friend' to the entire design team.", "next": "n2"}, "n2": {"speaker": "", "text": "It's not a love story. It's something sturdy and warm and full of muffins with tiny drawings on the napkins.", "next": "n3"}, "n3": {"speaker": "", "text": "◆ FRIENDSHIP ENDING: 'Official Work Best Friend.' Thanks for playing Kai's route.", "terminal": true}}}, "kai_end_missed": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Kai's colours fill the room. You realise you've barely spoken to them in weeks.", "next": "n2"}, "n2": {"speaker": "", "text": "They wave from across the room, friendly and far away. The rain checks expired quietly, just like they said.", "next": "n3"}, "n3": {"speaker": "", "text": "○ ENDING: 'Rain Check.' Thanks for playing Kai's route.", "terminal": true}}}, "kai_filler": {"start": "n1", "nodes": {"n1": {"speaker": "Kai", "text": "Deep in the colour zone right now. Come back with snacks and a strong opinion about fonts.", "terminal": true}}}, "kai_after": {"start": "n1", "nodes": {"n1": {"speaker": "Kai", "text": "Saturday market? The frog wants a friend. A matching frog. Don't argue.", "terminal": true}}}, "m_a1_late": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 1. 8:40pm. The ninth floor is dark except for your monitor and the glow from the corner office.", "next": "n2"}, "n2": {"speaker": "", "text": "Marcus appears at the edge of your desk with two takeaway teas and the expression of a man who did not expect company.", "next": "n3"}, "n3": {"speaker": "Marcus", "text": "You're new. New people go home at six and pretend they don't check email. What's keeping you?", "next": "n4"}, "n4": {"speaker": "You", "choices": [{"text": "'The handover file has a broken formula. I couldn't leave it.'", "effects": {"affection_marcus": 6, "career": 2}, "next": "fix"}, {"text": "'Honestly? Trying to impress you.'", "effects": {"affection_marcus": 4}, "next": "honest"}, {"text": "'Could ask you the same thing.'", "effects": {"affection_marcus": 7}, "next": "same"}]}, "fix": {"speaker": "Marcus", "text": "...So did I, three years ago. I just never fixed it. That's on me. Show me.", "next": "tea"}, "honest": {"speaker": "Marcus", "text": "Bold thing to say to your manager in week one. Wrong method, though. Sleep impresses me more than overtime.", "next": "tea"}, "same": {"speaker": "Marcus", "text": "Fair. Fifteen years of habit. The building's quieter after eight. I think better when nobody needs anything from me.", "next": "tea"}, "tea": {"speaker": "", "text": "He sets one of the teas down by your keyboard. It isn't a gesture he makes a show of. He just does it.", "next": "n9"}, "n9": {"speaker": "Marcus", "text": "Go home. That's an instruction, not advice. ...And the formula thing. That's solid.", "next": "n10"}, "n10": {"speaker": "", "text": "He goes back to his office. The light stays on long after you leave.", "terminal": true}}}, "m_a1_coffee": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 2. The office coffee machine is making a noise like a dying jet engine. Marcus is crouched in front of it, sleeves rolled, losing.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "Don't say anything. I have a master's degree. I've run teams of forty. This machine is beating me in front of a junior.", "next": "n3"}, "n3": {"speaker": "You", "choices": [{"text": "Kneel down and help him take the back panel off.", "effects": {"affection_marcus": 7, "energy": -3}, "next": "help"}, {"text": "'Should I call facilities, or let you keep your dignity?'", "effects": {"affection_marcus": 6}, "next": "tease"}, {"text": "Quietly hand him the manual from the drawer.", "effects": {"affection_marcus": 5}, "next": "manual"}]}, "help": {"speaker": "", "text": "Ten minutes, one exploded filter and a lot of laughing later, it works. He has coffee grounds on his very expensive cuff.", "next": "talk"}, "tease": {"speaker": "Marcus", "text": "Facilities, please. My dignity left at 'dying jet engine.' ...You're funny. Nobody told me you were funny.", "next": "talk"}, "manual": {"speaker": "Marcus", "text": "There's a manual. Of course there's a manual. Don't tell Zara. She'll put it in the team newsletter.", "next": "talk"}, "talk": {"speaker": "Marcus", "text": "I used to be the one who fixed things myself. Somewhere along the way I became the one who sends emails about things being fixed.", "next": "n8"}, "n8": {"speaker": "You", "choices": [{"text": "'You could still be both.'", "effects": {"affection_marcus": 6}, "next": "both"}, {"text": "'Sounds lonely, up in the corner office.'", "effects": {"affection_marcus": 4, "set_flags": ["marcus_noticed_lonely"]}, "next": "lonely"}]}, "both": {"speaker": "Marcus", "text": "Maybe. Don't spread that around. I have a reputation for being unreadable to protect.", "next": "out"}, "lonely": {"speaker": "Marcus", "text": "...That's a very direct thing to say to your boss. It's also not wrong. Let's leave it there.", "next": "out"}, "out": {"speaker": "", "text": "He hands you the first cup from the resurrected machine. It's terrible. You both drink it anyway.", "terminal": true}}}, "m_a1_review": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 3. Your first one-to-one. Marcus has printed your work. Printed it. With notes in the margins, in very neat handwriting.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "Your analysis is sharp. Your slides are a crime scene. Both are fixable. Which do you want first?", "next": "n3"}, "n3": {"speaker": "You", "choices": [{"text": "'The crime scene. Hit me.'", "effects": {"affection_marcus": 5, "career": 4}, "next": "slides"}, {"text": "'What would you do differently, in my seat?'", "effects": {"affection_marcus": 7, "career": 2}, "next": "seat"}]}, "slides": {"speaker": "Marcus", "text": "Twenty-three bullet points on one slide. Twenty-three. I counted twice because I didn't believe it. One idea per slide. Make them hungry for the next one.", "next": "q"}, "seat": {"speaker": "Marcus", "text": "In your seat? I'd ask more questions out loud. You have good ones. You keep them in your notebook like they're contraband.", "next": "q"}, "q": {"speaker": "", "text": "There's a pause at the end. The kind where a meeting could end, or something else could start.", "next": "n7"}, "n7": {"speaker": "You", "choices": [{"text": "'Can I ask you something that isn't about work?'", "effects": {"affection_marcus": 6}, "next": "personal"}, {"text": "'Thank you. Same time next month?'", "effects": {"affection_marcus": 3, "career": 2}, "next": "proper"}]}, "personal": {"speaker": "Marcus", "text": "...You can ask. I may not answer. I'm your manager, and there's a line, and I'm usually very good at standing on the right side of it. Go on.", "next": "n9"}, "n9": {"speaker": "", "text": "You ask why he stayed fifteen years. He looks at the window for a long time.", "next": "n10"}, "n10": {"speaker": "Marcus", "text": "Because the work mattered, and then because I was good at it, and then because leaving felt like admitting the first two weren't enough. That's more than I meant to say.", "next": "close"}, "proper": {"speaker": "Marcus", "text": "Same time next month. Bring fewer bullet points.", "next": "close"}, "close": {"speaker": "", "text": "You leave with a page of margin notes. At the bottom, in the same neat hand: 'Good start. Keep going.'", "terminal": true}}}, "m_a2_pressure": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 4. After the all-hands. Marcus's door is open, which it never is when he's angry. He's angry.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "Vaughn wants the Lighthouse team cut by two after launch. He wants me to pick the names. He wants it 'by Friday, discreetly.'", "next": "n3"}, "n3": {"speaker": "Marcus", "text": "...I shouldn't be telling a junior this. Forget I said it.", "next": "n4"}, "n4": {"speaker": "You", "choices": [{"text": "'I won't repeat it. But you can't carry that alone.'", "effects": {"affection_marcus": 8}, "next": "carry"}, {"text": "'Is my name on that list?'", "effects": {"affection_marcus": 2, "career": 1}, "next": "list"}, {"text": "'Then don't pick. Make the case that the team is the product.'", "effects": {"affection_marcus": 6, "career": 3}, "next": "case"}]}, "carry": {"speaker": "Marcus", "text": "I've carried worse alone. But... thank you. It's strange, hearing someone worry about me in this building.", "next": "end"}, "list": {"speaker": "Marcus", "text": "There is no list yet. And you'd be the last name on it, not that I'm supposed to say that either. Stop making me say things.", "next": "end"}, "case": {"speaker": "Marcus", "text": "...That's not a bad argument. Write it up. Not for me — for Vaughn, with your name on it. Brave people get noticed.", "next": "end"}, "end": {"speaker": "", "text": "When you leave, he closes the door behind you. Through the glass you see him sit very still, then pick up the phone.", "terminal": true}}}, "m_a2_rooftop": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 5. After work. You head up to the rooftop for air and find Marcus on a bench, tie off, phone face down beside him.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "My sister's getting married. Tonight. In another city. I'm here because Vaughn moved the launch review to tomorrow morning.", "next": "n3"}, "n3": {"speaker": "Marcus", "text": "I told her I'd watch the video. She said, 'You always watch the video, Marcus.' She's right. I'm a world-class video watcher.", "next": "n4"}, "n4": {"speaker": "You", "choices": [{"text": "Sit down next to him and say nothing for a while.", "effects": {"affection_marcus": 9, "set_flags": ["marcus_wall_broken"]}, "next": "sit"}, {"text": "'There's a late train. Go. I'll cover the review prep.'", "effects": {"affection_marcus": 7, "energy": -8, "career": 2}, "next": "go"}, {"text": "'You chose the job. That's allowed. Just make sure it's still a choice.'", "effects": {"affection_marcus": 6, "set_flags": ["marcus_wall_broken"]}, "next": "choice"}]}, "sit": {"speaker": "", "text": "The city hums below. After a while he laughs, quietly, at nothing.", "next": "n6"}, "n6": {"speaker": "Marcus", "text": "Fifteen years and I can't remember the last time someone just sat with me. Everyone wants a decision. You just... stayed.", "next": "end"}, "go": {"speaker": "Marcus", "text": "You'd do that? ...No. I can't let a junior stay up all night so I can go dance at a wedding. But the fact you offered — I'll remember it.", "next": "end"}, "choice": {"speaker": "Marcus", "text": "Is it still a choice? I genuinely don't know. That frightens me more than Vaughn does.", "next": "end"}, "end": {"speaker": "", "text": "For the first time, he isn't unreadable at all. He looks tired, and a little lonely, and very human.", "terminal": true}}}, "m_a2_vaughn": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 6. Vaughn intercepts you in the meeting room, all charm and expensive watch.", "next": "n2"}, "n2": {"speaker": "Vaughn", "text": "I'll be quick. Marcus is a good man, sentimental about his team. I need someone close to him to tell me what he's planning before he plans it. Help me, and the lead role gets a lot less competitive.", "next": "n3"}, "n3": {"speaker": "You", "choices": [{"text": "'No. And I'm going to tell Marcus you asked.'", "effects": {"affection_marcus": 9, "reputation": 4, "set_flags": ["exposed_vaughn", "marcus_loyal"]}, "next": "expose"}, {"text": "'I'll think about it.' Then quietly warn Marcus anyway.", "effects": {"affection_marcus": 6, "set_flags": ["marcus_loyal"]}, "next": "quiet"}, {"text": "'What exactly would you need?'", "effects": {"career": 6, "affection_marcus": -8, "set_flags": ["marcus_spy"]}, "next": "spy"}]}, "expose": {"speaker": "Vaughn", "text": "...Brave. Unwise. We'll see how brave you feel in Week 10.", "next": "n5"}, "n5": {"speaker": "", "text": "You walk straight into Marcus's office and tell him everything. He listens without blinking, then forwards one email to HR and one to the CFO.", "next": "n6"}, "n6": {"speaker": "Marcus", "text": "You understand you just picked a side against a senior director. For me. ...Nobody's done that before. Thank you. Now go — and stay out of rooms alone with him.", "next": "end"}, "quiet": {"speaker": "", "text": "You give Vaughn a non-answer. That evening you leave a note on Marcus's keyboard: 'Vaughn is asking about you. Be careful.'", "next": "n8"}, "n8": {"speaker": "Marcus", "text": "Found your note. Unsigned, but your handwriting is as bad as your early slides. Thank you. I owe you one.", "next": "end"}, "spy": {"speaker": "Vaughn", "text": "Smart. Just small things. Who he meets. What he says about the cuts. Nothing that would hurt anyone.", "next": "n10"}, "n10": {"speaker": "", "text": "It feels like it hurts someone already.", "next": "end"}, "end": {"speaker": "", "text": "Marcus waves at you through the glass on your way out. You don't quite manage to wave back.", "terminal": true}}}, "m_a2_line": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 7. The launch review runs until 11pm. The rain is biblical. You and Marcus end up sharing the last taxi.", "next": "n2"}, "n2": {"speaker": "", "text": "The city smears past the window. Neither of you is talking about work. You haven't for twenty minutes.", "next": "n3"}, "n3": {"speaker": "Marcus", "text": "I need to say something, and then I need you to help me be sensible about it.", "next": "n4"}, "n4": {"speaker": "Marcus", "text": "I look forward to our one-to-ones more than I should. I find reasons to walk past your desk. I'm your manager. That's not a small thing. It's the whole thing.", "next": "n5"}, "n5": {"speaker": "You", "choices": [{"text": "'Then we wait until it isn't the whole thing.'", "effects": {"affection_marcus": 10, "set_flags": ["marcus_boundary"]}, "next": "wait"}, {"text": "'I feel it too. I don't care about the org chart.'", "effects": {"affection_marcus": 8}, "next": "push"}, {"text": "'You're right. Let's keep it professional.'", "effects": {"affection_marcus": -2, "reputation": 2, "set_flags": ["marcus_closed"]}, "next": "close"}]}, "wait": {"speaker": "Marcus", "text": "...Wait. Yes. That's the sensible answer, and it's also the kind one. You keep doing that. Being both.", "next": "n7"}, "n7": {"speaker": "", "text": "He doesn't touch your hand. He doesn't need to. The taxi stops outside your building, and he says goodnight like it costs him something.", "next": "end"}, "push": {"speaker": "Marcus", "text": "You should care. I have to. If anything happened while I sign off your reviews, everything you earn here gets a question mark next to it. I won't do that to you.", "next": "n9"}, "n9": {"speaker": "", "text": "He says it gently. It doesn't land gently.", "next": "end"}, "close": {"speaker": "Marcus", "text": "Thank you. You're right. I'm sorry I made it awkward.", "next": "end"}, "end": {"speaker": "", "text": "Monday he is exactly, perfectly professional. It's what you asked for. It still feels like a door closing quietly.", "terminal": true}}}, "m_a2_hr": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 8. A rumour reaches the ninth floor: someone saw you and Marcus get into a taxi together. Someone, it turns out, who reports to Vaughn.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "Heads up. The kitchen is talking about you and the corner office. I'm not asking. I'm telling you so you're not blindsided.", "next": "n3"}, "n3": {"speaker": "", "text": "An HR meeting appears in your calendar. Marcus is already in the room when you arrive.", "next": "n4"}, "n4": {"speaker": "Marcus", "text": "I've told HR the facts. We shared a taxi in a storm after a work event. I've also told them, voluntarily, that if anything ever changes, I'll declare it before it does.", "next": "n5"}, "n5": {"speaker": "You", "choices": [{"text": "Back him up calmly, with the same facts.", "effects": {"affection_marcus": 7, "reputation": 4}, "next": "calm"}, {"text": "'This is Vaughn. He's trying to get to Marcus through me.'", "effects": {"affection_marcus": 5, "reputation": -2, "career": -2}, "next": "accuse"}]}, "calm": {"speaker": "", "text": "HR closes the file in ten minutes. Outside, Marcus exhales for what seems like the first time all week.", "next": "n7"}, "n7": {"speaker": "Marcus", "text": "You handled that better than most directors would. ...I meant what I said in there. About declaring it. Before, not after.", "next": "end"}, "accuse": {"speaker": "", "text": "HR goes very still and writes something down. Marcus closes his eyes for just a second.", "next": "n9"}, "n9": {"speaker": "Marcus", "text": "You're not wrong. But you can't win that fight in that room. Next time, let me take the hit. That's my job.", "next": "end"}, "end": {"speaker": "", "text": "It blows over. Mostly. People look at the two of you slightly longer than they used to.", "terminal": true}}}, "m_a3_offer": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 10. Marcus asks you to the rooftop. It's the first time he's ever asked you anywhere that isn't a meeting room.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "The CFO has offered me a director role. Strategy, two floors up. After launch I wouldn't run Lighthouse anymore. Someone else would. I wouldn't manage you.", "next": "n3"}, "n3": {"speaker": "Marcus", "text": "I haven't said yes. I wanted to ask you first, which is a very unprofessional sentence, and I'm saying it anyway.", "next": "n4"}, "n4": {"speaker": "You", "choices": [{"text": "'Take it because it's right for you. Not because of me.'", "effects": {"affection_marcus": 9, "set_flags": ["marcus_boundary"]}, "next": "right"}, {"text": "'Take it. Then ask me to dinner.'", "effects": {"affection_marcus": 8}, "next": "dinner"}, {"text": "'Stay. Lighthouse needs you more than strategy does.'", "effects": {"affection_marcus": 3, "career": 3}, "next": "stay"}]}, "right": {"speaker": "Marcus", "text": "It is right for me. I've known that for a year. I just needed someone to say it was allowed. ...You keep giving me permission to be a person.", "next": "end"}, "dinner": {"speaker": "Marcus", "text": "...That is the most direct thing anyone has ever said to me on this roof. Ask me again after launch. I suspect the answer will be yes.", "next": "end"}, "stay": {"speaker": "Marcus", "text": "Maybe. Or maybe it needs someone new. Someone like you. Think about that before you tell me to stay.", "next": "end"}, "end": {"speaker": "", "text": "The sun goes down behind the city. He doesn't check his phone once.", "terminal": true}}}, "m_a3_before": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 11. Launch week. Everything is on fire in the normal, survivable way. Marcus finds you at your desk at 7am.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "Whatever happens at the gala, I want you to know: you were the best hire I've made in a decade. That's not your manager talking. Well. It is. But it's also me.", "next": "n3"}, "n3": {"speaker": "You", "choices": [{"text": "'Save me a dance. Strictly professional.'", "effects": {"affection_marcus": 7}, "next": "dance"}, {"text": "'Same to you. Best boss I've had. Also, the slides are down to eight bullets.'", "effects": {"affection_marcus": 6, "career": 2}, "next": "slides"}]}, "dance": {"speaker": "Marcus", "text": "Strictly. I'll be counting the bullet points the whole time.", "next": "end"}, "slides": {"speaker": "Marcus", "text": "Eight. I'm moved. Genuinely. That's solid.", "next": "end"}, "end": {"speaker": "", "text": "The gala is next week. Whatever this is, it's waiting for you there.", "terminal": true}}}, "marcus_end_after": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Lighthouse launches without a hitch. Two floors up, a new name plate reads 'Marcus, Director of Strategy.' Your reviews now go to someone else entirely.", "next": "n2"}, "n2": {"speaker": "", "text": "He declared it to HR on Monday, exactly as promised. Before, not after. The form took four minutes. He says it was the bravest four minutes of his career.", "next": "n3"}, "n3": {"speaker": "Marcus", "text": "So. I'm not your manager. I've checked twice. HR has checked three times. Would you like to have dinner with me? Not a meeting. No slides.", "next": "n4"}, "n4": {"speaker": "", "text": "You say yes. He laughs like a man who's been holding his breath since a taxi in the rain.", "next": "n5"}, "n5": {"speaker": "", "text": "♥ ROMANCE ENDING: 'Before, Not After.' You waited until it was right, and it was worth the wait. Thanks for playing Marcus's route.", "terminal": true}}}, "marcus_end_almost": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Marcus stayed on Lighthouse. You stayed on his team. Everything the two of you feel is still there, standing politely on the right side of a line.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "One dance. Strictly professional. ...I'm not good at this part. Waiting. But I'd rather wait than put a question mark next to anything you earn.", "next": "n3"}, "n3": {"speaker": "", "text": "You dance. You don't kiss. Something in the way he says goodnight sounds like 'not yet' rather than 'no.'", "next": "n4"}, "n4": {"speaker": "", "text": "♡ BITTERSWEET ENDING: 'Not Yet.' Close, so close. The door is open, if either of you is ever brave enough to change the org chart. Thanks for playing Marcus's route.", "terminal": true}}}, "marcus_end_mentor": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Marcus raises a glass to the new Lighthouse team, then stops beside you.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "I've put your name forward for the leadership programme. I'll sponsor you. Whatever you need — a reference, a hard conversation, a slide with fewer than twenty-three bullets — you have my number.", "next": "n3"}, "n3": {"speaker": "", "text": "It isn't romance. It's something rarer in this building: someone senior who is completely on your side.", "next": "n4"}, "n4": {"speaker": "", "text": "▲ CAREER ENDING: 'That's Solid.' You gained a mentor for life. Thanks for playing Marcus's route.", "terminal": true}}}, "marcus_end_distance": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Marcus gives a gracious speech, thanks the team by name, and shakes your hand like he shakes everyone's.", "next": "n2"}, "n2": {"speaker": "", "text": "Whatever almost started on that rooftop never quite did. He's a good manager. You're a good employee. That's all it ever needed to be, apparently.", "next": "n3"}, "n3": {"speaker": "", "text": "○ ENDING: 'Professional Distance.' Some lines stay uncrossed. Thanks for playing Marcus's route.", "terminal": true}}}, "marcus_filler": {"start": "n1", "nodes": {"n1": {"speaker": "Marcus", "text": "Back-to-back meetings until six, I'm afraid. Leave it in my inbox and I'll give it real attention tonight.", "terminal": true}}}, "marcus_after": {"start": "n1", "nodes": {"n1": {"speaker": "Marcus", "text": "Lunch on Thursday? I found a place with no whiteboards. It's very relaxing. Slightly unsettling.", "terminal": true}}}, "n_a1_notice": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 1. There's a desk in the corner half-hidden behind two monitors. You almost walk past it — most people do. Then you don't.", "next": "n2"}, "n2": {"speaker": "Noah", "text": "...Oh. Hi. You're — you actually stopped. People don't usually stop here. I'm Noah. Data. I make the numbers behave.", "effects": {"affection_noah": 6, "set_flags": ["noticed_noah"]}, "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Someone's got to keep the numbers honest. I'm glad it's you.'", "effects": {"affection_noah": 7}, "next": "warm"}, {"text": "'Why does no one stop? You're right here.'", "effects": {"affection_noah": 6}, "next": "why"}, {"text": "'What are the monitors telling you today?'", "effects": {"affection_noah": 5}, "next": "data"}]}, "warm": {"speaker": "Noah", "text": "...That's a strangely nice thing to say to the guy behind the monitors. I'll — I'll remember you said that.", "next": "end"}, "why": {"speaker": "Noah", "text": "Because I'm easy to walk past. I've kind of arranged it that way. It's quieter back here. But it's — not unwelcome. You. Stopping.", "next": "end"}, "data": {"speaker": "Noah", "text": "Right now? That the Lighthouse forecast is more optimistic than the actual data supports. But nobody asks the corner desk, so.", "next": "end"}, "end": {"speaker": "", "text": "You go back to your day. But you noticed him now — and that turns out to be the whole beginning of something quiet.", "terminal": true}}}, "n_a1_data": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 2. Noah waves you over — a small, uncertain gesture, like he's not sure he's allowed to.", "next": "n2"}, "n2": {"speaker": "Noah", "text": "Can I show you something? I found a pattern in the Q2 churn nobody's looking at. It's — it's kind of beautiful, actually. Sorry. That's a weird word for a spreadsheet.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'It's not weird. Show me the beautiful spreadsheet.'", "effects": {"affection_noah": 8}, "next": "show"}, {"text": "'You get excited about this stuff. I like that.'", "effects": {"affection_noah": 7}, "next": "show"}]}, "show": {"speaker": "Noah", "text": "Okay. See how it dips every third week, right before payday? People downgrade, then re-subscribe. It's the whole company breathing. I've never shown anyone that. They just want the summary slide.", "next": "n3"}, "n3": {"speaker": "", "text": "For a few minutes he forgets to be invisible. He's animated, quick, funny in a dry way you didn't expect. Then he catches himself and dims back down.", "next": "end"}, "end": {"speaker": "Noah", "text": "Anyway. Thanks for looking. Most people don't look.", "terminal": true}}}, "n_a1_lunch": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 3. You find Noah eating lunch alone at the corner desk, headphones half-off. You sit down across from him without asking.", "next": "n2"}, "n2": {"speaker": "Noah", "text": "You can — yeah. Sit. I don't really do the lunch-room thing. Too much noise, too many people performing being happy. This is better. Is this weird? This is probably weird.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'It's not weird. Quiet's nice. I like it here.'", "effects": {"affection_noah": 8}, "next": "quiet"}, {"text": "'We can just sit. We don't have to fill the silence.'", "effects": {"affection_noah": 9}, "next": "silence"}]}, "quiet": {"speaker": "Noah", "text": "...Yeah. It is nice. You're easy to be quiet around. That's rarer than people think.", "next": "end"}, "silence": {"speaker": "", "text": "So you don't. You eat in a comfortable, unhurried quiet, the office noise a wall away. Once, he glances up and catches you looking, and neither of you looks away for a second too long.", "next": "end"}, "end": {"speaker": "", "text": "It's the least dramatic lunch of your life, and somehow you can't stop thinking about it afterward.", "terminal": true}}}, "n_a2_overlooked": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 4. The promotion's announced — the Lighthouse lead. Noah isn't even in the conversation. Nobody thought to consider the corner desk.", "next": "n2"}, "n2": {"speaker": "Noah", "text": "Don't. I can see you doing the sympathetic face. It's fine. I'm the guy who makes the winners look good. I've made peace with it. Mostly. Ninety percent.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Ninety percent isn't peace. What's the other ten?'", "effects": {"affection_noah": 8}, "next": "ten"}, {"text": "'Being overlooked and being unimportant aren't the same thing.'", "effects": {"affection_noah": 9}, "next": "matter"}]}, "ten": {"speaker": "Noah", "text": "The other ten percent thinks maybe I made myself invisible so no one could tell me I wasn't good enough. Safer to be unseen than to be seen and passed over. ...I don't say that out loud. Ever. Huh.", "next": "end"}, "matter": {"speaker": "Noah", "text": "...You really believe that. I can tell you actually believe that. Do you know how long it's been since someone made me feel important without needing anything from me? I don't. That's the point.", "next": "end"}, "end": {"speaker": "", "text": "He goes back to his monitors. But something in him is a little less resigned than it was an hour ago.", "terminal": true}}}, "n_a2_open": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 5. You've been thinking about it. About Noah, and the corner, and the ten percent. You bring him a coffee and a question.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'What if I helped you get seen? Present your churn model to Marcus. You'd blow them away.'", "effects": {"affection_noah": 6, "set_flags": ["noah_seen"]}, "next": "seen"}, {"text": "'I don't want to change you. I just don't want to be the only one who sees you.'", "effects": {"affection_noah": 10, "set_flags": ["noah_accepted"]}, "next": "accept"}, {"text": "'Whatever you want. Spotlight or corner. I'm on your side either way.'", "effects": {"affection_noah": 8, "set_flags": ["noah_accepted"]}, "next": "accept"}]}, "seen": {"speaker": "Noah", "text": "...You want to put me in front of Marcus. That's — terrifying, and also nobody's ever offered. Okay. Maybe. If you're there. I'd need you there.", "next": "end"}, "accept": {"speaker": "Noah", "text": "...You don't want to fix me. Everyone wants to fix me — 'speak up, network, self-advocate.' You just want to — see me. I don't have a defence built for that. I'm a little wrecked, honestly. In a good way.", "next": "end"}, "end": {"speaker": "", "text": "It's the closest he's come to reaching back. Quiet, but unmistakable.", "terminal": true}}}, "n_a2_fallout": {"start": "n1", "nodes": {"n1": {"speaker": "", "variants": [{"if": "noah_seen", "text": "Week 6. You set it up: ten minutes with Marcus, Noah's churn model on the big screen. Noah's hands won't stop shaking, but he showed up.", "next": "seen"}, {"text": "Week 6. Nothing changes on the surface — Noah stays in his corner. But he saves you the seat beside him now, every day, without a word about it.", "next": "accept"}]}, "seen": {"speaker": "Noah", "text": "I did it. I actually — Marcus said 'that's solid.' Which apparently is a huge deal? People clapped. It was awful and amazing. I threw up a little after. Don't tell anyone.", "next": "seenc"}, "seenc": {"speaker": "You", "choices": [{"text": "'You were brilliant up there. I just opened the door — you walked through it.'", "effects": {"affection_noah": 10}, "next": "a"}, {"text": "'I've never been prouder of anyone. Corner desk changed the room today.'", "effects": {"affection_noah": 9}, "next": "a"}]}, "accept": {"speaker": "Noah", "text": "I keep waiting for you to get bored of the quiet. Of me. People do. But you keep sitting down. Why do you keep sitting down?", "next": "acceptc"}, "acceptc": {"speaker": "You", "choices": [{"text": "'Because it's my favourite part of the day. That's the whole reason.'", "effects": {"affection_noah": 10}, "next": "a"}, {"text": "'I'm not going to get bored of you, Noah. I've been trying to and I can't.'", "effects": {"affection_noah": 9}, "next": "a"}]}, "a": {"speaker": "Noah", "text": "...Okay. Okay. I'm going to choose to believe you. That's a big thing for me — believing someone. So. Don't make me regret it. I don't think you will.", "next": "end"}, "end": {"speaker": "", "text": "Something settles between you, warm and unhurried. No fireworks. Just a door quietly opening.", "terminal": true}}}, "n_a2_confide": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 7. Late. Everyone's gone. Noah is still at his monitors, and for once he doesn't dim when you approach.", "next": "n2"}, "n2": {"speaker": "Noah", "text": "Can I tell you the real reason I stay invisible? My last job — I had ideas, I spoke up, I was 'promising.' And when it fell apart, I was the most visible person to blame. So I got small. Small people don't get blamed. Small people are safe.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Safe and unseen isn't the same as safe and happy. You deserve to be happy.'", "effects": {"affection_noah": 12, "set_flags": ["noah_wall"]}, "next": "open"}, {"text": "'You don't have to be small with me. There's no blame here. Just me.'", "effects": {"affection_noah": 11, "set_flags": ["noah_wall"]}, "next": "open"}, {"text": "'That makes sense. Small is smart in a place like this.'", "effects": {"affection_noah": 3}, "next": "guard"}]}, "open": {"speaker": "Noah", "text": "...I haven't felt safe AND seen in a long time. I didn't think you could have both. You're kind of proving me wrong about that. It's disorienting. Don't stop.", "next": "openend"}, "openend": {"speaker": "", "text": "He takes his glasses off, rubs his eyes, and lets you see him tired and unguarded. It's the most naked thing he's ever done.", "terminal": true}, "guard": {"speaker": "Noah", "text": "Yeah. Smart. Exactly. ...I thought you might say something else. It's fine. Forget I said any of it. I should finish this run.", "next": "guardend"}, "guardend": {"speaker": "", "text": "He puts the monitors back up like a wall. The moment closes, gently, on its own.", "terminal": true}}}, "n_a2_rain": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 8. It's pouring when you both leave. You end up sharing the narrow shelter of the building's awning, waiting it out, shoulders almost touching.", "next": "n2"}, "n2": {"speaker": "Noah", "text": "I like the rain. It makes everyone go quiet. The whole loud world just... hushes. It's the only time the outside feels like the inside of my head.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Then let's just stand here. No rush. I like the inside of your head.'", "effects": {"affection_noah": 11}, "next": "close"}, {"text": "'We could make a run for it — or we could not.'", "effects": {"affection_noah": 8}, "next": "close"}]}, "close": {"speaker": "", "text": "He doesn't run. Neither do you. He leans his head against yours, just barely, and you stay like that while the rain comes down — two quiet people in a hushed world, no words needed.", "next": "n3"}, "n3": {"speaker": "Noah", "text": "...I don't want the rain to stop. Is that allowed? To not want the rain to stop?", "next": "end"}, "end": {"speaker": "", "text": "Two weeks to the gala. And somehow the quietest route has become the one you can't stop thinking about.", "terminal": true}}}, "n_a3_choice": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 10. The Lighthouse launch is close. Marcus, of all people, floats an idea: a real analytics role, out of the corner, with a voice in the room. For Noah. He comes to you first, panicked.", "next": "n2"}, "n2": {"speaker": "Noah", "text": "They want to give me a seat at the actual table. Visible. Named. The exact thing I built my whole self to avoid. I don't know if I can. I don't know if I want to. What do I do?", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Take the seat — and I'll be right beside it. You're not doing visible alone.'", "effects": {"affection_noah": 10, "set_flags": ["noah_bond"]}, "next": "take"}, {"text": "'You don't have to. The corner's not failure. I love you in the corner too.'", "effects": {"affection_noah": 11, "set_flags": ["noah_bond"]}, "next": "stay"}, {"text": "'Only you can answer that. But whatever you pick, you've got me.'", "effects": {"affection_noah": 8, "set_flags": ["noah_bond"]}, "next": "either"}]}, "take": {"speaker": "Noah", "text": "...Beside it. You'd sit beside me while I'm terrified in a room full of people. Okay. Okay. Then maybe I can. With you there, maybe visible isn't the scariest thing in the world.", "next": "end"}, "stay": {"speaker": "Noah", "text": "You said — you love me in the corner. You said it like it was nothing. Like it's just true. ...I heard it. I'm keeping it. Whatever I decide about the seat, I'm keeping THAT.", "next": "end"}, "either": {"speaker": "Noah", "text": "'Whatever you pick, you've got me.' That's the first time a choice hasn't felt like a trap. Because the outcome I actually care about — you — isn't on the table. It's already mine. Isn't it?", "next": "end"}, "end": {"speaker": "", "text": "One week to the gala. For the first time, Noah is deciding something instead of hiding from it.", "terminal": true}}}, "n_a3_react": {"start": "n1", "nodes": {"n1": {"speaker": "", "variants": [{"if": "noah_bond", "text": "Week 10. Noah finds you at your desk, steadier than you've ever seen him, glasses pushed up, decision made.", "next": "bond"}, {"text": "Week 10. Noah finds you, quiet as ever, working something over behind his eyes.", "next": "bond"}]}, "bond": {"speaker": "Noah", "text": "I made a choice. About the seat, about the corner, about all of it. But I realised the choice underneath all the choices was already made a while ago. It was you. Whatever room I'm in, I want you in it.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Then that's settled. Any room. Corner or table. Me and you.'", "effects": {"affection_noah": 9}, "next": "a"}, {"text": "'I noticed you when no one else did. I'm not about to stop now.'", "effects": {"affection_noah": 10}, "next": "a"}]}, "a": {"speaker": "Noah", "text": "...You noticed me. Out of a whole floor of louder, shinier people, you stopped at the corner desk. I'm never going to be over that. Save me a spot at the gala. Somewhere quiet. Near the edge. Our kind of place.", "next": "end"}, "end": {"speaker": "", "text": "The quietest route in the whole office, and it just became the surest thing in it.", "terminal": true}}}, "n_a3_before": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 11. The night before the gala. You find Noah on the fire-escape landing outside the analytics floor — his rooftop, quieter than the actual roof.", "next": "n2"}, "n2": {"speaker": "Noah", "text": "Big loud night tomorrow. Not really my scene. But you'll be there, so it's my scene now, I guess. Funny how that works.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Find me by the quiet edge. I'll be looking for you the whole night.'", "effects": {"affection_noah": 8}, "next": "sure"}, {"text": "'One loud night. Then back to our corner. Deal?'", "effects": {"affection_noah": 7}, "next": "sure"}]}, "sure": {"speaker": "Noah", "text": "Deal. The quiet edge. I'll be the one who looks like he'd rather be anywhere else — until you show up, and then I'll be the one who looks exactly where he wants to be.", "next": "end"}, "end": {"speaker": "", "text": "The rain's long gone. The city's quiet. Tomorrow the loud world gets its night — but the quiet thing you two built is the part that's going to last.", "terminal": true}}}, "noah_end_seen": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. The room is loud and bright and Noah hates it — but he's here, by the quiet edge, exactly where he said he'd be.", "next": "n2"}, "n2": {"speaker": "", "text": "The Lighthouse numbers on the big screen? His model. His work, finally with his name on it. Marcus makes a point of saying so, out loud, to the whole room. Noah goes very red and doesn't dim, not even a little.", "next": "n3"}, "n3": {"speaker": "Noah", "text": "A whole floor of people just saw me. And it's fine. It's actually fine. Because the one person whose seeing ever mattered saw me first, in a corner, when I was invisible. The rest is just noise now.", "next": "n4"}, "n4": {"speaker": "", "text": "He finds your hand in the crowd without looking, the way you find something you already know is there.", "next": "end"}, "end": {"speaker": "", "text": "★ TRUE ENDING — 'Seen'. You didn't fix him or fix the room. You just refused to walk past. Fade to black. — Thanks for playing Noah's hidden route.", "terminal": true}}}, "noah_end_quiet": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. You slip away from the noise and find Noah exactly where you knew he'd be — the quiet edge, two drinks, one saved for you.", "next": "n2"}, "n2": {"speaker": "Noah", "text": "I let you all the way in. Do you know I've never done that? Not once. It's terrifying and it's the best thing I've ever done. We're not loud. We're never going to be loud. But we're real. That's better.", "next": "n3"}, "n3": {"speaker": "", "text": "You stand together at the edge of the party, watching everyone else perform, perfectly content to be the two quietest people in the building.", "next": "end"}, "end": {"speaker": "", "text": "♥ ENDING — 'The Quiet Edge'. No fireworks. Just two people who finally feel safe being seen. Fade to black. — Thanks for playing Noah's hidden route.", "terminal": true}}}, "noah_end_friends": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. Noah gives you a small wave from the corner of the room — glad you came, glad you're you, but the thing between you stayed gentle and unspoken.", "next": "n2"}, "n2": {"speaker": "Noah", "text": "You're the person who stopped at the corner desk. I won't forget that — not ever. Whatever this was, it made the floor a warmer place to be invisible on. Thank you for seeing me, even a little.", "next": "n3"}, "n3": {"speaker": "", "text": "It's not a heartbreak. It's a good, quiet friendship that maybe could have been more, on a braver quarter.", "next": "end"}, "end": {"speaker": "", "text": "— ENDING — 'Noticed'. Sometimes seeing someone is its own kind of gift. Fade to black. — Thanks for playing Noah's hidden route.", "terminal": true}}}, "noah_end_faded": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 12. The Gala. You look for Noah at the quiet edge, but he isn't there. The corner desk was empty when you passed it earlier, too.", "next": "n2"}, "n2": {"speaker": "", "text": "Later you'll hear he left early, the way he does. You noticed him once — but noticing someone and staying with them are different things, and somewhere in the noise, he faded back to invisible.", "next": "end"}, "end": {"speaker": "", "text": "— ENDING — 'Faded'. Some people you have to keep choosing, or they slip back to the corner. Fade to black. — Restart and pay closer attention. Thanks for playing.", "terminal": true}}}, "noah_filler": {"start": "n1", "nodes": {"n1": {"speaker": "Noah", "text": "I'm mid-thought on a data run — one more pass and it'll behave. Come back and sit with me in a bit? The quiet's better with you in it.", "terminal": true}}}, "noah_after": {"start": "n1", "nodes": {"n1": {"speaker": "Noah", "text": "That's the whole quiet story. Thank you for stopping at the corner desk. (Noah's route complete — restart for a different ending, or go find someone louder.)", "terminal": true}}}, "p_a1_clash": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 1. Marcus drops a Lighthouse sub-task on the floor and lets two juniors race it: you and a woman with a whiteboard marker held like a scalpel.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "So you're the new variable. I'm Priya. I've had this task modelled three ways since the meeting ended eight minutes ago. Try to make this interesting.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Three ways in eight minutes. Cute. I only need one — the right one.'", "effects": {"affection_priya": 7, "career": 3}, "next": "spar"}, {"text": "'Nice to meet you too. What have you got so far?'", "effects": {"affection_priya": 3}, "next": "earnest"}, {"text": "'I don't really do races. I do results.'", "effects": {"reputation": 4}, "next": "cool"}]}, "spar": {"speaker": "Priya", "text": "...Ha. A mouth on the new hire. Good. Empty confidence bores me, but you actually delivered. Let's see if the model backs it up. Go.", "next": "end"}, "earnest": {"speaker": "Priya", "text": "I've got everything, obviously. What I don't have is time to babysit. Keep up or don't. This is how I know if you're worth talking to.", "next": "end"}, "cool": {"speaker": "Priya", "text": "Results. Finally, a person who speaks my language. Then prove it. Words are cheap and I've heard all of them.", "next": "end"}, "end": {"speaker": "", "text": "You finish neck and neck. She doesn't say 'good job.' She just looks at your work a half-second longer than she needs to. From Priya, you'll learn, that's practically a standing ovation.", "terminal": true}}}, "p_a1_test": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 2. Priya slides a folder onto your desk without a word. It's a flaw in the Lighthouse client model — a real one, buried deep. A test, obviously.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "Found this at 2am. I could take it straight to Marcus and look brilliant alone. Instead I'm showing you. Consider that a compliment you haven't earned yet. What do you do with it?", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'We flag it together. Split credit. Stronger fix, better story.'", "effects": {"affection_priya": 9}, "next": "together"}, {"text": "'Why show me at all, if it makes you look brilliant alone?'", "effects": {"affection_priya": 6}, "next": "why"}, {"text": "'Take it to Marcus. It's your find. I'm not a charity case.'", "effects": {"reputation": 4, "career": 3}, "next": "solo"}]}, "together": {"speaker": "Priya", "text": "...Split credit. On MY find. You know how rare it is that anyone says that to me and means it? ...Don't answer. It's rare. Fine. Together. Just this once.", "next": "end"}, "why": {"speaker": "Priya", "text": "...Honestly? Because I wanted to see if you'd try to steal it. You didn't even flinch toward it. That tells me more than any spreadsheet. Noted, new hire.", "next": "end"}, "solo": {"speaker": "Priya", "text": "No charity. Good — I don't give it and I don't take it. You've got a spine and no interest in mine. That's the most refreshing thing that's happened to me all quarter.", "next": "end"}, "end": {"speaker": "", "text": "She takes the folder back. Whatever the test was, you get the sense you passed a version of it — and that passing Priya's tests is a dangerous, addictive little thrill.", "terminal": true}}}, "p_a1_crack": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 3. You catch Priya alone in the meeting room after hours, staring at a rejected proposal with a face that isn't armored for once.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "Leadership passed on my strategy. 'Too aggressive.' Six weeks of work. You didn't see that. That version of me does not exist. Understood?", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'For what it's worth — I read that proposal. It wasn't too aggressive. It was too early. There's a difference.'", "effects": {"affection_priya": 9}, "next": "seen"}, {"text": "'I didn't see anything. But if I had, I'd have said it was good.'", "effects": {"affection_priya": 7}, "next": "kind"}, {"text": "'Understood. Your secret's safe.'", "effects": {"affection_priya": 4}, "next": "safe"}]}, "seen": {"speaker": "Priya", "text": "...Too early. Not too much. You have no idea what it does to me to hear it put that way. Three years of 'tone it down' and you just — okay. Okay. Thank you. We're never discussing this again.", "next": "end"}, "kind": {"speaker": "Priya", "text": "...You're being kind. I don't know what to do with kind. It's not a currency I trade in. But — noted. Filed. Under things I'll pretend didn't happen.", "next": "end"}, "safe": {"speaker": "Priya", "text": "Good. It stays a secret. ...You didn't have to leave it there, though, and you did. I'll remember that you knew when to stop pushing.", "next": "end"}, "end": {"speaker": "", "text": "She rebuilds the armor plate by plate as you watch. But you saw the person underneath it for exactly four seconds, and you can't unsee her now.", "terminal": true}}}, "p_a2_announce": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 4. The all-hands. One Lighthouse junior gets promoted to lead. The whole room does the math and lands on three names. Two of you have been finishing each other's models for a month.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "So now it's official. You. Me. One chair. I'd tell you not to take it personally, but I would be lying, and I respect you too much to lie badly.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Then let's make it a real fight. No sabotage. Just be better than me.'", "effects": {"affection_priya": 8, "set_flags": ["clean_fight_pact"]}, "next": "pact"}, {"text": "'May the best of us win. I intend for that to be me.'", "effects": {"affection_priya": 6, "career": 4}, "next": "confident"}, {"text": "'I don't want a chair if the cost is you.'", "effects": {"affection_priya": 5}, "next": "soft"}]}, "pact": {"speaker": "Priya", "text": "A clean fight. God, do you know how rare that offer is in this building? Deal. Push me. I'll push back. Let's find out who we actually are when it's real.", "next": "end"}, "confident": {"speaker": "Priya", "text": "There it is. The teeth. Good — I don't respect people who pretend they don't want it. Come at me with everything. I'll do the same. It's the most honest thing between us.", "next": "end"}, "soft": {"speaker": "Priya", "text": "...Don't. Don't get soft on me now, it ruins the whole dynamic. If you throw the fight for me I'll never forgive you, and neither will I forgive myself. Fight me properly. That's the respect.", "next": "end"}, "end": {"speaker": "", "text": "The rivalry has a deadline now. The strange, electric thing growing underneath it doesn't. That's the problem, and neither of you says it out loud.", "terminal": true}}}, "p_a2_fork": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 6. It lands in your lap: a copy of Priya's draft Lighthouse strategy, mis-sent to you by an assistant. Her whole play, a week early. You could bury her with this. Nobody would ever know.", "next": "c1"}, "c1": {"speaker": "You", "choices":
