<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src 'none'; connect-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Office Hours</title>
<style>
:root{
  --ink:#1d2433; --paper:#fffaf3; --muted:#6b7280; --accent:#ff6b8b; --accent2:#5b8def;
  --good:#2fb171; --warn:#f2a33a; --bad:#e2554f; --panel:rgba(255,250,243,.96);
  --shadow:0 10px 30px rgba(20,24,40,.25); --radius:16px;
  --font: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root{ --panel:rgba(255,250,243,.96); } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1f2e;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
#stage{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;overflow:hidden;background:#222;container-type:inline-size;user-select:none;-webkit-user-select:none;font-size:clamp(11px,1.45cqw,19px)}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:filter .4s}
#world{position:absolute;inset:0;z-index:1}
.ent .fl{height:100%}
.ent .fl.flip{transform:scaleX(-1)}
.fade{position:absolute;inset:0;background:#111;opacity:0;pointer-events:none;transition:opacity .35s;z-index:99}
.fade.on{opacity:1}

/* sprites */
.ent{position:absolute;transform-origin:50% 100%;cursor:pointer}
.ent img{display:block;height:100%;width:auto;pointer-events:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.ent .tag{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-4px);white-space:nowrap;background:rgba(29,36,51,.82);color:#fff;font-size:.8em;padding:.15em .6em;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}
.ent:hover .tag,.ent.showtag .tag{opacity:1}
.ent.obj:hover img{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px rgba(255,214,102,.9))}
.ent.npc:hover img{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px rgba(255,107,139,.8))}
.ent.ghost{opacity:.42}
.ent.ghost:hover{opacity:.75}
.bubble{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-.3em);font-weight:800;font-size:1.1em;width:1.7em;height:1.7em;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow);animation:bob 1.2s ease-in-out infinite;pointer-events:none}
.bubble.new{background:var(--accent)}
.bubble.chat{background:#8c93a8;font-size:.85em}
.zone{position:absolute;border-radius:14px;cursor:pointer;transition:background .2s, box-shadow .2s}
.zone:hover{background:rgba(255,230,150,.18);box-shadow:inset 0 0 0 2px rgba(255,230,150,.75)}
.zone .tag{position:absolute;left:50%;top:-1.8em;transform:translateX(-50%);white-space:nowrap;background:rgba(29,36,51,.82);color:#fff;font-size:.8em;padding:.15em .6em;border-radius:99px;opacity:0;transition:opacity .2s}
.zone:hover .tag{opacity:1}
#avatar{cursor:default;z-index:5}
#avatar.walk img{animation:walk .42s ease-in-out infinite}
#avatar.act img{animation:act .5s ease-in-out 2}
.emote{position:absolute;left:50%;bottom:102%;transform:translateX(-50%);font-size:2.2em;animation:pop 1.3s ease-out forwards;pointer-events:none;z-index:9}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3%) rotate(2deg)}}
@keyframes act{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95)}}
@keyframes bob{0%,100%{transform:translate(-50%,-.3em)}50%{transform:translate(-50%,-.7em)}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:.7em;gap:.6em;z-index:20;pointer-events:none}
#hud>*{pointer-events:auto}
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow)}
#clock{padding:.55em .8em;min-width:15em}
#clock .when{font-weight:800;font-size:1.05em;display:flex;justify-content:space-between;gap:.5em;align-items:center}
.slots{display:flex;gap:.25em}
.slots i{width:.65em;height:.65em;border-radius:50%;background:#d8d2c8;display:block}
.slots i.on{background:var(--accent)}
.slots i.done{background:#9aa1b2}
.meter{display:grid;grid-template-columns:1.4em 5.4em 1fr 2em;align-items:center;gap:.35em;margin-top:.35em;font-size:.88em}
.bar{height:.6em;background:#e7e1d7;border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter.low .bar{animation:pulse 1s infinite}
.meter.low span:last-child{color:var(--bad);font-weight:800}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,85,79,.0)}50%{box-shadow:0 0 0 3px rgba(226,85,79,.45)}}
#topbtns{display:flex;gap:.4em;flex-wrap:wrap;justify-content:flex-end}
.btn{border:0;background:var(--panel);color:var(--ink);border-radius:99px;padding:.5em .85em;font-size:.9em;font-weight:700;box-shadow:var(--shadow)}
.btn:hover{background:#fff}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghostbtn{background:rgba(255,255,255,.18);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.35)}
.btn:disabled{opacity:.45;cursor:default}
#roomname{position:absolute;left:50%;top:.8em;transform:translateX(-50%);background:rgba(29,36,51,.75);color:#fff;padding:.3em .9em;border-radius:99px;font-weight:700;font-size:.9em;z-index:19;pointer-events:none}
#objective{position:absolute;left:.7em;bottom:.7em;max-width:46%;padding:.5em .8em;font-size:.88em;z-index:18;display:flex;gap:.5em;align-items:flex-start}
#objective b{color:var(--accent)}
#passbtn{position:absolute;right:.7em;bottom:.7em;z-index:18}
#exitbtn{position:absolute;right:.7em;bottom:3.4em;z-index:18}
#tutorial{position:absolute;left:.7em;top:7.6em;padding:.6em .8em;font-size:.82em;z-index:18;max-width:17em}
#tutorial h4{margin:0 0 .3em;font-size:1em;display:flex;justify-content:space-between;align-items:center}
#tutorial ul{list-style:none;margin:0;padding:0}
#tutorial li{padding:.12em 0}
#tutorial li.done{color:var(--muted);text-decoration:line-through}
#tutorial .x{border:0;background:none;font-size:1.1em;color:var(--muted);padding:0 .2em}

/* toasts */
#toasts{position:absolute;right:.7em;top:5.2em;display:flex;flex-direction:column;align-items:flex-end;gap:.35em;z-index:97;pointer-events:none}
.toast{background:rgba(29,36,51,.9);color:#fff;padding:.4em .75em;border-radius:12px;font-size:.88em;animation:toast 3.2s ease forwards;max-width:22em}
.toast.warn{background:var(--warn);color:#2b1a00}
.toast.bad{background:var(--bad)}
.toast.good{background:var(--good)}
.toast.love{background:var(--accent)}
@keyframes toast{0%{opacity:0;transform:translateX(20px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

/* action popover */
#pop{position:absolute;z-index:40;padding:.75em .9em;width:17em;display:none}
#pop h3{margin:0 0 .2em;font-size:1.05em}
#pop p{margin:.2em 0 .5em;color:var(--muted);font-size:.88em}
.fx{display:flex;flex-wrap:wrap;gap:.3em;margin:.3em 0 .6em}
.chip{font-size:.8em;font-weight:700;padding:.15em .55em;border-radius:99px;background:#efe9df}
.chip.up{background:#dcf5e8;color:#16774a}
.chip.down{background:#fde3e1;color:#a23631}
.chip.dim{background:#fff1d6;color:#8a5a00}
#pop .row{display:flex;gap:.4em;flex-wrap:wrap}

/* dialogue */
#vn{position:absolute;inset:0;z-index:30;display:none}
#vn.on{display:block}
#vnshade{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,22,35,.55),rgba(20,22,35,.15) 60%,rgba(20,22,35,0))}
#vnchar{position:absolute;bottom:22%;right:10%;height:72%;transition:opacity .25s,transform .25s;transform-origin:50% 100%}
#vnchar img{height:100%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
#vnchar.hide{opacity:0;transform:translateY(4%)}
#vnchar.happy{animation:hop .5s ease}
#vnchar.love{animation:hop .5s ease 2}
#vnchar.angry{animation:shake .45s ease}
#vnchar.sad img{filter:drop-shadow(0 10px 12px rgba(0,0,0,.35)) saturate(.6) brightness(.92)}
#vnchar.sad{transform:translateY(2%) scale(.985)}
#vnchar.flustered{animation:wobble .8s ease}
#vnemote{position:absolute;right:13%;top:6%;font-size:3em;opacity:0;pointer-events:none}
#vnemote.on{animation:pop 1.6s ease-out forwards}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-4%)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-2%)}40%{transform:translateX(2%)}60%{transform:translateX(-1.5%)}80%{transform:translateX(1%)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
#box{position:absolute;left:3%;right:3%;bottom:3%;min-height:27%;padding:1em 1.2em 1em 7.2em;cursor:pointer}
#box.noportrait{padding-left:1.2em}
#portrait{position:absolute;left:1em;top:1em;width:5.4em;height:5.4em;border-radius:50%;background-color:#f1e7da;background-repeat:no-repeat;box-shadow:inset 0 0 0 3px #fff,0 4px 12px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1em;color:#fff}
#portrait .mood{position:absolute;right:-.3em;bottom:-.2em;font-size:1.5em;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
#speaker{font-weight:800;font-size:1.05em;margin-bottom:.25em;display:flex;gap:.6em;align-items:baseline}
#speaker small{font-weight:600;color:var(--muted);font-size:.75em}
#text{font-size:1.08em;line-height:1.45;min-height:3.2em}
#text.narr{font-style:italic;color:#3b4252}
#choices{display:flex;flex-direction:column;gap:.45em;margin-top:.6em}
.choice{text-align:start;border:2px solid #eadfce;background:#fff;border-radius:12px;padding:.55em .8em;font-size:.98em;color:var(--ink);transition:transform .12s,border-color .12s}
.choice:hover{border-color:var(--accent);transform:translateX(4px)}
#vnctl{position:absolute;right:1em;top:.7em;display:flex;gap:.3em}
#vnctl button{border:0;background:#efe7db;border-radius:99px;font-size:.75em;font-weight:700;padding:.3em .65em;color:#4a5160}
#vnctl button.on{background:var(--accent);color:#fff}
#next{position:absolute;right:1.1em;bottom:.6em;font-size:.9em;color:var(--accent);animation:bob2 1s infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.float{position:absolute;font-weight:800;font-size:1.2em;z-index:70;pointer-events:none;animation:floatup 1.6s ease-out forwards;text-shadow:0 2px 0 #fff,0 0 8px #fff}
@keyframes floatup{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}

/* overlays */
.overlay{position:absolute;inset:0;background:rgba(18,20,32,.62);z-index:95;display:none;align-items:center;justify-content:center;padding:3%}
.overlay.on{display:flex}
.sheet{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);width:min(100%,58em);max-height:100%;overflow:auto;padding:1.2em 1.4em;position:relative}
.sheet h2{margin:.1em 0 .6em;font-size:1.5em}
.sheet .close{position:absolute;right:.8em;top:.7em;border:0;background:#efe7db;border-radius:99px;width:2em;height:2em;font-size:1em;font-weight:800}
.grid{display:grid;gap:.8em}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.tile{background:#fff;border-radius:14px;padding:.8em;box-shadow:0 2px 8px rgba(0,0,0,.07);position:relative}
.room{cursor:pointer;padding:0;overflow:hidden;border:3px solid transparent}
.room:hover{border-color:var(--accent)}
.room .thumb{height:7em;background-size:cover;background-position:center}
.room .meta{padding:.5em .7em}
.room .meta b{display:block}
.room .who{display:flex;gap:.25em;margin-top:.3em;min-height:2em;flex-wrap:wrap}
.face{width:2em;height:2em;border-radius:50%;background-repeat:no-repeat;background-color:#f1e7da;box-shadow:inset 0 0 0 2px #fff;position:relative}
.face.new::after{content:"!";position:absolute;right:-.3em;top:-.3em;background:var(--accent);color:#fff;font-size:.7em;font-weight:800;width:1.3em;height:1.3em;border-radius:50%;display:flex;align-items:center;justify-content:center}
.room.here{border-color:var(--accent2)}
.person{display:grid;grid-template-columns:5em 1fr;gap:.8em;align-items:start}
.person .pic{width:5em;height:5em;border-radius:50%;background-repeat:no-repeat;background-color:#f1e7da}
.hearts{color:var(--accent);letter-spacing:.05em}
.small{font-size:.82em;color:var(--muted)}
.tagline{display:inline-block;font-size:.72em;font-weight:800;padding:.1em .5em;border-radius:99px;background:#efe7db;margin-inline-end:.3em}
.tagline.ok{background:#dcf5e8;color:#16774a}
.tagline.no{background:#fde3e1;color:#a23631}
.tagline.hot{background:#ffe0e8;color:#c22b55}
.end{min-height:6.5em}
.end.locked{background:repeating-linear-gradient(45deg,#f3eee6,#f3eee6 8px,#ece5da 8px,#ece5da 16px);color:#8f8679}
.end .k{font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.end h4{margin:.2em 0}
#title{position:absolute;inset:0;z-index:90;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
#title::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,107,139,.55),rgba(36,45,90,.75));backdrop-filter:blur(3px)}
#title .inner{position:relative;text-align:center;color:#fff;width:min(92%,34em)}
#title h1{font-size:4em;margin:0;letter-spacing:-.02em;text-shadow:0 6px 24px rgba(0,0,0,.3)}
#title .sub{opacity:.9;margin:.2em 0 1.4em;font-size:1.1em}
#title .menu{display:flex;flex-direction:column;gap:.55em;align-items:center}
#title .menu .btn{width:15em;padding:.7em}
.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:.4em;margin:.6em 0}
.avpick{background:#fff;border:3px solid transparent;border-radius:12px;padding:.3em;height:9em;display:flex;align-items:flex-end;justify-content:center}
.avpick img{height:100%}
.avpick.sel{border-color:var(--accent)}
input[type=text]{font:inherit;padding:.55em .8em;border-radius:10px;border:2px solid #e3d8c7;width:100%}
label{font-weight:700;font-size:.9em}
.set{display:grid;grid-template-columns:10em 1fr;gap:.6em 1em;align-items:center}
.seg{display:flex;gap:.3em;flex-wrap:wrap}
.seg button{border:2px solid #e3d8c7;background:#fff;border-radius:99px;padding:.3em .8em;font-weight:700;font-size:.85em}
.seg button.on{border-color:var(--accent);background:#ffe9ee}
.ev h3{margin:.1em 0 .3em}
.ev .choice{width:100%}
.log p{margin:.35em 0}
.recap td{padding:.25em .6em}
.delta.up{color:#16774a;font-weight:800}.delta.down{color:#a23631;font-weight:800}
/* dance */
#dance{position:absolute;inset:0;z-index:55;background:radial-gradient(circle at 50% 30%,#3b2b6b,#120f24);display:none;color:#fff}
#dance.on{display:block}
#lanes{position:absolute;left:50%;transform:translateX(-50%);top:12%;bottom:22%;width:min(60%,26em);display:grid;grid-template-columns:repeat(4,1fr);gap:.5em}
.lane{position:relative;background:rgba(255,255,255,.06);border-radius:12px;overflow:hidden}
.note{position:absolute;left:10%;width:80%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6em;font-weight:900;color:#fff}
.hitline{position:absolute;left:0;right:0;bottom:8%;height:4px;background:rgba(255,255,255,.6)}
#pads{position:absolute;left:50%;transform:translateX(-50%);bottom:5%;width:min(60%,26em);display:grid;grid-template-columns:repeat(4,1fr);gap:.5em}
#pads button{border:0;border-radius:14px;padding:.6em 0;font-size:1.6em;font-weight:900;color:#fff}
#pads button.hit{transform:scale(.94);filter:brightness(1.3)}
#dscore{position:absolute;left:0;right:0;top:3%;text-align:center;font-weight:800;font-size:1.3em}
#djudge{position:absolute;left:0;right:0;top:45%;text-align:center;font-size:2em;font-weight:900;opacity:0}
#djudge.on{animation:pop .7s ease-out}
@media (max-aspect-ratio: 1/1){
  #app{justify-content:flex-start}
  #stage{width:100vw;font-size:clamp(10px,2.6cqw,16px)}
  #objective{max-width:60%}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .avatars{grid-template-columns:repeat(4,1fr)}
}
.sheet.guide-sheet{width:min(100%,62em);background:linear-gradient(160deg,#fffaf3 0%,#fff1f4 100%)}
.guide .g-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1em;margin-bottom:.8em;padding-inline-end:2.4em;flex-wrap:wrap}
.g-kicker{font-size:.75em;font-weight:900;letter-spacing:.14em;color:var(--accent)}
.g-dots{display:flex;gap:.35em}
.g-dot{width:2.2em;height:2.2em;border-radius:50%;border:3px solid #fff;background-color:#f1e7da;background-repeat:no-repeat;box-shadow:0 2px 6px rgba(0,0,0,.15);opacity:.55;transition:all .2s;padding:0;font-weight:900;color:#fff}
.g-dot.v{background:#3a3f4b}
.g-dot.on{opacity:1;transform:scale(1.18);border-color:var(--accent)}
.g-page{display:grid;grid-template-columns:12em 1fr;gap:1.2em;min-height:21em;animation:gin .35s ease}
@keyframes gin{from{opacity:0;transform:translateX(calc(var(--dir) * 30px))}to{opacity:1;transform:none}}
.g-host{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--hc) 28%,#fff),#fff 70%);border-radius:18px;padding:.6em .4em .5em}
.g-host img{height:17em;max-width:100%;object-fit:contain;animation:gbob 3s ease-in-out infinite;filter:drop-shadow(0 8px 8px rgba(0,0,0,.2))}
.g-vaughn{width:7em;height:7em;border-radius:50%;background:#3a3f4b;color:#fff;font-size:2.4em;font-weight:900;display:flex;align-items:center;justify-content:center;margin:2em 0 1em;box-shadow:0 0 0 6px #c9a227 inset}
.g-name{background:var(--hc);color:#fff;border-radius:12px;padding:.3em .7em;text-align:center;margin-top:-.6em;position:relative}
.g-name b{display:block}.g-name span{font-size:.72em;opacity:.9}
.g-tag{display:inline-block;background:var(--hc);color:#fff;font-size:.72em;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:.2em .7em;border-radius:99px}
.g-main h3{margin:.35em 0 .4em;font-size:1.45em;line-height:1.15}
.g-say{background:#fff;border-radius:16px;padding:.8em 1em;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.06);line-height:1.5;border-inline-start:4px solid var(--hc)}
.pinkbang{display:inline-flex;width:1.4em;height:1.4em;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;align-items:center;justify-content:center}
.g-demo{margin-top:.9em;background:#fff;border-radius:16px;padding:.9em 1em;box-shadow:0 2px 10px rgba(0,0,0,.06);border:2px dashed color-mix(in srgb,var(--hc) 40%,#fff)}
.g-demo::before{content:"TRY IT";display:block;font-size:.66em;font-weight:900;letter-spacing:.14em;color:var(--hc);margin-bottom:.5em}
.g-row{display:flex;gap:.45em;flex-wrap:wrap;margin:.6em 0 .2em}
.g-out{margin-top:.5em;font-size:.92em;min-height:2.6em;color:#3b4252}
.g-weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:.25em;margin-bottom:.6em}
.g-weeks i{font-style:normal;font-size:.75em;font-weight:800;background:#efe7db;border-radius:8px;text-align:center;padding:.35em 0;color:#7a7266}
.g-weeks i.gala{background:linear-gradient(135deg,#ffd166,#ff6b8b);color:#fff}
.g-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
.g-slot{background:#f6f1ea;border-radius:12px;padding:.5em;text-align:center;font-weight:700;font-size:.9em;transition:all .25s;border:2px solid transparent}
.g-slot span{display:block;font-size:1.5em}
.g-slot.now{border-color:var(--accent);background:#fff0f3;transform:translateY(-3px)}
.g-slot.done{opacity:.4;text-decoration:line-through}
.g-meter{display:grid;grid-template-columns:7.5em 1fr 2.2em;gap:.5em;align-items:center;margin:.3em 0}
.g-meter .bar{height:.8em}
.g-meter.low .bar{animation:pulse 1s infinite}
.g-faces{display:flex;gap:.5em;flex-wrap:wrap}
.g-face{border:0;background:#f6f1ea;border-radius:14px;padding:.45em .55em;display:flex;flex-direction:column;align-items:center;gap:.25em;font-weight:700;font-size:.82em;transition:transform .15s}
.g-face:hover{transform:translateY(-3px);background:#fff0f3}
.g-face .face{width:3em;height:3em}
.g-chat{display:flex;gap:.7em;align-items:flex-start}
.g-chat .face{width:3.6em;height:3.6em;flex:none}
.g-bub{background:#eef6f9;border-radius:14px;padding:.6em .8em;font-style:italic}
.g-choices{display:flex;flex-direction:column;gap:.35em;margin-top:.6em}
.g-hop{animation:hop .5s ease 2}.g-shake{animation:shake .45s ease}
.g-threats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}
.g-threat{background:#2a2f3a;color:#fff;border-radius:14px;padding:.7em;display:flex;flex-direction:column;gap:.25em;transition:transform .2s}
.g-threat:hover{transform:rotate(-1.5deg) scale(1.03)}
.g-threat .g-ti{font-size:1.8em}.g-threat span{font-size:.85em;opacity:.9}.g-threat em{font-size:.75em;color:#ffd166;font-style:normal;font-weight:700}
.g-kinds{display:flex;flex-wrap:wrap;gap:.4em}
.g-kind{border:2px solid var(--kc);color:var(--kc);border-radius:99px;padding:.25em .7em;font-weight:800;font-size:.85em;background:#fff}
.g-keys{display:flex;flex-wrap:wrap;gap:.4em .9em;margin-top:.7em;font-size:.82em;color:#4a5160}
kbd{background:#1d2433;color:#fff;border-radius:6px;padding:.05em .45em;font-family:inherit;font-weight:800;font-size:.9em;box-shadow:0 2px 0 #000}
.g-nav{display:flex;justify-content:space-between;align-items:center;margin-top:1em}
@media (max-aspect-ratio: 1/1){.g-page{grid-template-columns:1fr}.g-host{flex-direction:row;justify-content:flex-start;gap:.8em;padding:.4em}.g-host img{height:6em}.g-name{margin:0}.g-vaughn{width:2.4em;height:2.4em;font-size:1.4em;margin:0}.g-threats{grid-template-columns:1fr}}

/* ---------- decluttered HUD ---------- */
input[type=text]{background:#fff;color:var(--ink)}
#roomname,#exitbtn{display:none!important}
#clock{padding:.45em .7em;min-width:0;width:auto}
#clock .when{display:flex;gap:.5em;align-items:center;font-size:.95em}
#clock .when span:first-of-type{color:var(--muted);font-weight:700}
#clock .where{font-size:.78em;color:var(--muted);font-weight:700;margin-top:.1em}
#clock .crash{color:var(--bad)}
.rings{display:flex;gap:.45em;margin-top:.35em}
.ring{--v:50;--c:#999;width:2.7em;height:2.7em;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v) * 1%),#e7e1d7 0);position:relative;display:flex;align-items:center;justify-content:center;transition:background .6s}
.ring::before{content:"";position:absolute;inset:.28em;border-radius:50%;background:var(--panel)}
.ring span{position:absolute;top:-.25em;right:-.3em;font-size:.8em;z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.ring b{position:relative;font-size:.8em}
.ring.low{animation:pulse 1s infinite}
.ring.low b{color:var(--bad)}
#topbtns{gap:.35em}
#topbtns .btn{width:2.6em;height:2.6em;padding:0;border-radius:50%;font-size:1em;display:flex;align-items:center;justify-content:center;position:relative}
#topbtns .btn .badge{position:absolute;top:-.2em;right:-.2em;background:var(--accent);color:#fff;font-style:normal;font-size:.62em;font-weight:900;min-width:1.5em;height:1.5em;border-radius:99px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
#objective{max-width:62%;padding:.35em .45em .35em .7em;font-size:.82em;align-items:center;border-radius:99px;gap:.45em}
#objective .obj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tutchip{border:0;background:#ffe9ee;color:#c22b55;font-weight:900;border-radius:99px;padding:.2em .6em;font-size:.95em;flex:none}
#tutorial{top:auto;bottom:3.2em;left:.7em;display:none}
#passbtn{padding:.45em .8em;font-size:.82em}

/* ---------- office map ---------- */
.sheet.map-sheet{width:min(100%,46em);background:linear-gradient(180deg,#cfe6f5 0%,#f6efe6 70%)}
.m-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1em;margin-bottom:.7em;padding-inline-end:2.4em}
.pinkdot{display:inline-flex;width:1.2em;height:1.2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;align-items:center;justify-content:center;font-size:.85em}
.bld{position:relative;display:grid;grid-template-columns:3em 2.4em 1fr;grid-template-rows:8em 8em 2.4em 8em;row-gap:.5em;background:#e9e2d6;border:4px solid #5b6170;border-radius:6px 6px 0 0;padding:.5em .5em .5em 0;box-shadow:0 12px 0 -4px #8b7f6e}
.roof-sign{position:absolute;left:50%;top:-1.7em;transform:translateX(-50%);background:#1d2433;color:#ffd166;font-weight:900;letter-spacing:.3em;font-size:.8em;padding:.2em .9em;border-radius:6px 6px 0 0}
.shaft{grid-column:1;grid-row:1/5;position:relative;margin-left:.5em;background:repeating-linear-gradient(0deg,#3a3f4b 0 2px,#4a505d 2px 14px);border-radius:6px}
.car{position:absolute;left:.25em;right:.25em;height:8em;background:linear-gradient(180deg,#ffd166,#f2a33a);border-radius:6px;box-shadow:inset 0 0 0 2px #b9781a;display:flex;align-items:center;justify-content:center;transition:top .85s cubic-bezier(.6,0,.3,1)}
.car span{writing-mode:vertical-rl;font-size:.65em;font-weight:900;color:#6b4300}
.lvl{grid-column:2/4;display:flex;gap:.5em;align-items:stretch}
.l-roof{grid-row:1}.l-9{grid-row:2}.l-mid{grid-row:3}.l-g{grid-row:4}
.lvl-tag{width:2.2em;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#5b6170;font-size:.9em}
.m-room{flex:1;border:3px solid transparent;border-radius:12px;background-size:cover;background-position:center;position:relative;text-align:start;color:#fff;padding:.5em .6em;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .15s,border-color .15s,box-shadow .15s;overflow:hidden}
.m-room:hover{transform:translateY(-3px);border-color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.m-room.here{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(91,141,239,.35)}
.m-room.going{border-color:var(--accent);animation:pulse 1s infinite}
.m-name{font-weight:900;font-size:1em;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.m-acts{position:absolute;top:.4em;right:.5em;background:rgba(255,255,255,.88);border-radius:99px;padding:.1em .5em;font-size:.8em}
.m-who{display:flex;gap:.25em;align-items:center;margin-top:.3em;min-height:2em;flex-wrap:wrap}
.m-who .face{width:2em;height:2em;box-shadow:inset 0 0 0 2px #fff,0 2px 4px rgba(0,0,0,.3)}
.m-who .ghostface{filter:brightness(.15);opacity:.7}
.m-you{display:flex;align-items:center;gap:.25em;background:var(--accent2);border-radius:99px;padding:.1em .5em .1em .1em;font-size:.68em;font-weight:900;margin-inline-start:auto;animation:gbob 1.6s ease-in-out infinite}
.m-you .face{width:1.9em;height:1.9em}
.m-other{flex:1;border-radius:10px;background:repeating-linear-gradient(90deg,#d8d0c2 0 22px,#cfc6b6 22px 24px);display:flex;align-items:center;justify-content:center;font-size:.75em;font-weight:800;color:#7a7266}
.m-lobby{width:28%;border-radius:12px;background:#d8d0c2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#5b6170;font-size:.85em;text-align:center}
.m-lobby span{font-weight:600;font-size:.85em}
@keyframes gbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (max-aspect-ratio: 1/1){
  .ward{grid-template-columns:1fr}
  .runway{min-height:18em}
  #w-doll{height:13em}
  .bld{grid-template-rows:6.5em 6.5em 2em 6.5em}
}

.ng{display:grid;grid-template-columns:34% 1fr;gap:1.2em;align-items:center}
.ng-pic{position:relative;height:21em;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,#2b2350,#5a3a6e 65%,#e9b8c6);border-radius:18px;overflow:hidden}
.ng-glow{position:absolute;left:50%;top:-10%;width:90%;height:95%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.45),rgba(255,255,255,0) 65%)}
.ng-pic img{position:relative;height:92%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));animation:gbob 3s ease-in-out infinite}
.ng-form label{display:block;margin:.6em 0 .3em}
.ng-badge{display:flex;flex-direction:column;align-items:center;margin:.9em 0}
.ng-strap{width:.6em;height:1.6em;background:#e2554f;border-radius:2px}
.ng-card{background:#fff;border:2px solid #1d2433;border-radius:10px;padding:.5em 1.1em;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.12);transform:rotate(-2deg);min-width:14em}
.ng-card span{display:block;font-size:.6em;font-weight:900;letter-spacing:.12em;color:#8c93a1}
.ng-card b{display:block;font-size:1.5em;color:#e2554f;letter-spacing:.06em;margin:.1em 0}
.ng-card em{font-size:.7em;color:#6b7280;font-style:normal}
@media (max-aspect-ratio: 1/1){.ng{grid-template-columns:1fr}.ng-pic{height:12em}}

</style>
</head>

 <div id="stage">

  <div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>

 </div>
</div>

const STORY = {"a1_arrival": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 1. 8:54am. You're standing in the Meridian lobby holding a laptop bag, a welcome folder, and a lanyard that says 'GUSET' because someone in HR can't spell.", "next": "n2"}, "n2": {"speaker": "", "text": "The receptionist has stepped away. A woman with a coffee and a knowing look clocks you from the lift.", "next": "n3"}, "n3": {"speaker": "Zara", "text": "Let me guess. Ninth floor, Project Lighthouse, no idea which desk is yours, and — ", "next": "n4"}, "n4": {"speaker": "Zara", "text": "— oh, that badge says GUSET. Incredible. Day one and you're already a typo. I'm keeping that.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Please don't tell anyone about GUSET.'", "effects": {"affection_zara": 7}, "next": "guset"}, {"text": "'Ninth floor, that's me. Lead the way?'", "effects": {"affection_zara": 4}, "next": "lead"}, {"text": "'You clocked all that from a lift. Should I be worried?'", "effects": {"affection_zara": 6}, "next": "clock"}]}, "guset": {"speaker": "Zara", "text": "Absolutely I'm telling everyone. It's the best thing that's happened to this floor all quarter. Come on, GUSET, you're next to me.", "next": "n5"}, "lead": {"speaker": "Zara", "text": "Efficient. I respect it. Follow me — and try not to make eye contact with the coffee machine on this floor, it can smell fear.", "next": "n5"}, "clock": {"speaker": "Zara", "text": "Deeply worried. I notice everything. It's a gift and a personality flaw. I'm Zara — you're right next to me, unfortunately for you.", "next": "n5"}, "n5": {"speaker": "", "text": "She walks you to the lift like she's done this a hundred times and never once enjoyed it as much as today.", "next": "c2"}, "c2": {"speaker": "You", "choices": [{"text": "'So what's the survival advice for the ninth floor?'", "effects": {"affection_zara": 6}, "next": "advice"}, {"text": "'Is Lighthouse as intense as everyone says?'", "effects": {"career": 3}, "next": "intense"}]}, "advice": {"speaker": "Zara", "text": "Rule one: upstairs coffee, never this floor. Rule two: if Vaughn compliments your work, check your back for a knife. Rule three: sit with me at lunch or the wolves get you.", "next": "end"}, "intense": {"speaker": "Zara", "text": "It's the whole quarter riding on one launch, so — yes. But intense is survivable with the right desk neighbour. Lucky you.", "next": "end"}, "end": {"speaker": "", "text": "The lift doors close on the two of you. First morning, and it already doesn't feel like a place you'll dread.", "terminal": true}}}, "a1_tour": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Zara gives you the thirty-second floor tour, which is really just her opinions on everyone, delivered under her breath.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "Corner office: Marcus, our lead. Calm, fair, a little unreadable. If he likes your work he says 'that's solid,' and that's basically a parade.", "next": "n3"}, "n3": {"speaker": "Marcus", "text": "New hire. Welcome to Lighthouse. Keep your head down, ask good questions, and we'll get along. That's solid advice, take it.", "next": "n4"}, "n4": {"speaker": "Zara", "text": "By the whiteboard: Priya. Brilliant, sharp, and gunning for exactly what I'm gunning for. Watch her. Actually — don't, she'll notice.", "next": "n5"}, "n5": {"speaker": "Priya", "text": "The famous new hire. GUSET, was it? Word travels. Do try to keep up on Lighthouse — I don't slow down for anyone.", "next": "n6"}, "n6": {"speaker": "", "text": "Further along, a man with a too-smooth smile intercepts you. Zara's whole body language changes.", "next": "n7"}, "n7": {"speaker": "Vaughn", "text": "Vaughn. Senior director. I like to know the new talent early. My door's always open — remember that when the quarter gets... competitive.", "effects": {"set_flags": ["met_vaughn"]}, "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Thanks — but I'm pretty happy at my desk.' (stay close to Zara)", "effects": {"affection_zara": 6}, "next": "loyal"}, {"text": "'Good to know. I'll remember that.' (keep options open)", "effects": {"career": 3}, "next": "open"}]}, "loyal": {"speaker": "Zara", "text": "Nicely dodged. He collects people. You're not a collectible.", "next": "n8"}, "open": {"speaker": "Zara", "text": "...Careful with that one. His open door leads somewhere you don't want to go. Anyway — moving on.", "next": "n8"}, "n8": {"speaker": "Zara", "text": "Design pod: Kai. They do the pretty half of Lighthouse and flirt with the whole building. Harmless. Mostly.", "next": "n9"}, "n9": {"speaker": "Kai", "text": "Ooh, fresh blood. Hi, I'm Kai, I make things beautiful and deadlines miserable. We're going to be friends, I can tell.", "next": "n10"}, "n10": {"speaker": "", "text": "In the corner, half-hidden behind two monitors, someone barely looks up. Zara doesn't even mention him.", "next": "c2"}, "c2": {"speaker": "You", "choices": [{"text": "Stop and say hi to the guy in the corner.", "effects": {"affection_noah": 6, "set_flags": ["noticed_noah"]}, "next": "noah"}, {"text": "Keep walking with Zara.", "effects": {"affection_zara": 3}, "next": "skip"}]}, "noah": {"speaker": "Noah", "text": "...Oh. Hi. Noah. Data. Most people don't stop. That was — nice, actually. See you around, maybe.", "next": "end"}, "skip": {"speaker": "Zara", "text": "That's Noah, I think? Analytics. Keeps to himself. Anyway — that's the whole zoo. Welcome to it.", "next": "end"}, "end": {"speaker": "", "text": "You've met the floor. Somewhere in this room is your future — the project, the rivals, and the one person you already can't stop noticing.", "terminal": true}}}, "a1_task": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Your first real Lighthouse task lands in your inbox: clean up the Q2 model before the noon sync. It's more tangled than it looks.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "First task. Trial by spreadsheet. I can walk you through it, or you can white-knuckle it solo and impress Marcus. Your call, GUSET.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Walk me through it. I'd rather learn it right.'", "effects": {"affection_zara": 7}, "next": "together"}, {"text": "'I'll take a run at it solo first.'", "effects": {"career": 6}, "next": "solo"}, {"text": "'Race you. Loser buys the good coffee.'", "effects": {"affection_zara": 5, "career": 3}, "next": "race"}]}, "together": {"speaker": "Zara", "text": "Smart. Pull your chair over. See this tab? This is where dreams go to die. Watch.", "next": "together2"}, "together2": {"speaker": "", "text": "She's a good teacher — patient, funny, a little too close as she points at your screen. You get it done by eleven, and you learned something. Both of you did.", "next": "end"}, "solo": {"speaker": "", "text": "You grind it out yourself. It's rough, but you hand Marcus something workable. 'That's... solid,' he says, and Zara mouths 'a PARADE' from across the aisle.", "next": "endsolo"}, "race": {"speaker": "Zara", "text": "Oh, it's ON. No mercy for the new kid.", "next": "race2"}, "race2": {"speaker": "", "text": "She wins by four minutes and gloats insufferably. You don't mind losing nearly as much as you should. You owe her a good coffee — which is, you suspect, exactly what she wanted.", "next": "end"}, "endsolo": {"speaker": "", "text": "You proved something today. Whether it was to Marcus or to yourself, you're not sure yet.", "terminal": true}, "end": {"speaker": "", "text": "First task, survived. The floor feels a little less like a maze already.", "terminal": true}}}, "a1_coffee": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Mid-afternoon slump. Zara stands, stretches, and jerks her head toward the stairwell. 'Come on. Upstairs coffee. You've earned the good machine.'", "next": "n2"}, "n2": {"speaker": "Zara", "text": "So. GUSET. Three days in. Regretting it yet?", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Honestly? Best part's the company at desk 13.'", "effects": {"affection_zara": 8}, "next": "smooth"}, {"text": "'Ask me after the launch when I've slept.'", "effects": {"affection_zara": 5}, "next": "tired"}, {"text": "'Not yet. This place grows on you.'", "effects": {"affection_zara": 4}, "next": "warm"}]}, "smooth": {"speaker": "Zara", "text": "...Wow. Just going to say that, out loud, by the coffee machine, like it's nothing. Bold. I'll allow it.", "next": "n3"}, "tired": {"speaker": "Zara", "text": "Ha. Honest. Sleep is a myth here — we run on caffeine and spite. You'll fit right in.", "next": "n3"}, "warm": {"speaker": "Zara", "text": "It does, doesn't it. Against your better judgment. That's Meridian.", "next": "n3"}, "n3": {"speaker": "Zara", "text": "Can I tell you something a little too real for a coffee break? I've been the 'promising one' here for three years. I need Lighthouse to turn promising into something. It's kind of everything for me.", "next": "c2"}, "c2": {"speaker": "You", "choices": [{"text": "'Then it will. You're the sharpest person here.'", "effects": {"affection_zara": 8}, "next": "believe"}, {"text": "'No pressure or anything, huh.'", "effects": {"affection_zara": 4}, "next": "joke"}]}, "believe": {"speaker": "Zara", "text": "...Careful. Keep saying things like that and I'll actually start believing them. That's dangerous for a person like me.", "next": "end"}, "joke": {"speaker": "Zara", "text": "None whatsoever. I'm perfectly calm. This is my calm face. ...Thanks for listening, though. Genuinely.", "next": "end"}, "end": {"speaker": "", "text": "You go back down two floors and somehow closer than you went up.", "terminal": true}}}, "a1_priya": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 2. You're refilling at the printer when Priya materialises beside you, all crisp edges and calculation.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "A word of advice, new hire. Zara's lovely. She's also my competition for the Lighthouse lead, and she'll be yours too before long. Don't get so cosy you forget that.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Zara's a colleague and a friend. That's not going to change.'", "effects": {"affection_zara": 7}, "next": "loyal"}, {"text": "'Noted. I don't rattle easily.'", "effects": {"reputation": 4}, "next": "cool"}, {"text": "'Sounds like you're the one who's rattled.'", "effects": {"affection_priya": 4, "reputation": 2}, "next": "spar"}]}, "loyal": {"speaker": "Priya", "text": "How sweet. We'll see how that holds when the promotion's real and it's her name or yours. It always changes. Enjoy the honeymoon.", "next": "end"}, "cool": {"speaker": "Priya", "text": "Good. Rattled people make mistakes, and I don't intend to. Welcome to the real game, new hire.", "next": "end"}, "spar": {"speaker": "Priya", "text": "...Ha. Okay. You've got a spine. I'll give you that much. Most of them don't. This'll be more interesting than I thought.", "next": "end"}, "end": {"speaker": "", "text": "Back at your desk, Zara reads your face in half a second. 'Priya got to you. What did she say?' You realise the promotion's already a shadow on the floor — and it's only week two.", "terminal": true}}}, "a1_latenight": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "9pm. The floor is empty except for the two of you and a Lighthouse deadline that refuses to be finished. Zara slides a takeout carton across the aisle.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "I over-ordered. It's a defence mechanism. Sit. Eat. Suffer with me. Misery loves noodles.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'What made you want this job, really?'", "effects": {"affection_zara": 8}, "next": "why"}, {"text": "'Let's crush this deck and get out of here.'", "effects": {"career": 5, "affection_zara": 2}, "next": "work"}]}, "why": {"speaker": "Zara", "text": "Honestly? My family thinks 'analyst at Meridian' is a phase before a real career. Lighthouse is me proving it's not. To them. To me. To Priya, a little, if I'm honest.", "next": "n3"}, "n3": {"speaker": "Zara", "text": "...I don't say that to people. Blame the noodles and the terrible hour.", "next": "c2"}, "c2": {"speaker": "You", "choices": [{"text": "'For what it's worth, you don't have anything to prove to me.'", "effects": {"affection_zara": 9}, "next": "soft"}, {"text": "'Then let's make sure they all see it. Together.'", "effects": {"affection_zara": 6, "career": 3}, "next": "ally"}]}, "soft": {"speaker": "Zara", "text": "...You keep doing that. Saying the thing that gets right under my ribs. Stop it. Don't stop it. I don't know.", "next": "end"}, "ally": {"speaker": "Zara", "text": "Together. God, that's a nice word after three years of 'on your own, kid.' Okay. Partners on this.", "next": "end"}, "work": {"speaker": "Zara", "text": "A professional. Devastating. Fine — but you're taking half these noodles, I refuse to carry the guilt home alone.", "next": "end"}, "end": {"speaker": "", "text": "You finish at eleven. It's late, and you're exhausted, and you can't remember the last time work felt this much like something else.", "terminal": true}}}, "a1_lobby": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "The lift down is slow. It's just the two of you, tired and a little punch-drunk, watching the floor numbers count down.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "This is the part of the night where I usually say something too honest and then blame it on being tired. So. Fair warning.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Say it. I won't hold it against you.'", "effects": {"affection_zara": 8, "set_flags": ["zara_spark"]}, "next": "honest"}, {"text": "'Get home, get some sleep. It'll keep.'", "effects": {"affection_zara": 4}, "next": "gentle"}]}, "honest": {"speaker": "Zara", "text": "...I'm glad it was you at that desk. That's all. That's the too-honest thing. Okay, doors are opening, we never speak of this, goodnight.", "next": "end"}, "gentle": {"speaker": "Zara", "text": "...Yeah. You're right. Rain check on the honesty. Get home safe, GUSET.", "next": "end"}, "end": {"speaker": "", "text": "You walk out into the cool night. Somewhere behind you the lift closes, and you're smiling at nothing.", "terminal": true}}}, "a1_marcus": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 3. Marcus waves you into his office. Zara watches you go with a raised eyebrow.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "You've settled in fast. Good instincts, plays well with the team. I'll be honest with you, because you'll hear it soon anyway.", "next": "n3"}, "n3": {"speaker": "Marcus", "text": "There's a lead role opening on Lighthouse at the end of the quarter. One of the juniors gets it. You're in the conversation. So is Zara. So is Priya. I'd rather you knew than found out in a rumour.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'I appreciate the honesty. I'll earn it fairly.'", "effects": {"reputation": 6}, "next": "fair"}, {"text": "'What matters most to you in whoever leads?'", "effects": {"career": 5, "affection_marcus": 3}, "next": "ask"}, {"text": "'Zara's wanted this for years. She's ready.'", "effects": {"affection_zara": 8}, "next": "champion"}]}, "fair": {"speaker": "Marcus", "text": "Fairly. Good. That's rarer than it should be around here. Keep it that way when it gets tight — and it will get tight.", "next": "end"}, "ask": {"speaker": "Marcus", "text": "Someone who lifts the team instead of climbing over it. Talent I can find anywhere. That, I can't. Remember I said so.", "next": "end"}, "champion": {"speaker": "Marcus", "text": "...Interesting. Championing your competition. That tells me more about you than any spreadsheet could. Noted.", "next": "end"}, "end": {"speaker": "", "text": "You leave the office knowing the thing that's going to test everything — you and Zara included — now has a name and a deadline.", "terminal": true}}}, "a1_rooftop": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Lunch. Zara tips her head toward the stairwell. 'Come on. I'm showing you the one genuinely good thing about this building.'", "next": "n2"}, "n2": {"speaker": "", "text": "The rooftop. The whole city laid out, warm and loud and far below. She leans on the railing like it's an old friend.", "next": "n3"}, "n3": {"speaker": "Zara", "text": "I come up here when the floor gets to be too much. You're the first person I've ever brought. So, you know. Don't make it a thing.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Why me?'", "effects": {"affection_zara": 9}, "next": "whyme"}, {"text": "'Secret's safe. I'll guard the rooftop with my life.'", "effects": {"affection_zara": 6}, "next": "guard"}, {"text": "'Even with the promotion thing hanging over us?'", "effects": {"affection_zara": 5}, "next": "real"}]}, "whyme": {"speaker": "Zara", "text": "...Because you're easy to be around. Do you know how rare that is? I spend all day with my guard up. Up here, with you, I forget to.", "next": "spark"}, "guard": {"speaker": "Zara", "text": "Good. Because this is the only place I don't have to perform. Don't take that away.", "next": "spark"}, "real": {"speaker": "Zara", "text": "...Yeah. Even with that. Maybe especially with that. Up here it doesn't feel like it has to come between us. Down there's a different story.", "next": "spark"}, "spark": {"speaker": "", "text": "For a moment neither of you says anything. The city hums. The moment stretches, comfortable and just slightly electric.", "next": "c2"}, "c2": {"speaker": "You", "choices": [{"text": "'For what it's worth, you're pretty easy to be around too.'", "effects": {"affection_zara": 9, "set_flags": ["zara_spark"]}, "next": "close"}, {"text": "'We should head back before someone notices.'", "effects": {"affection_zara": 3}, "next": "retreat"}]}, "close": {"speaker": "Zara", "text": "...Okay. We should go back down before I say the next thing, because I will absolutely overthink it for a week.", "next": "end"}, "retreat": {"speaker": "Zara", "text": "...Yeah. Back to reality. Come up whenever, though. Just — maybe when I'm hiding, not when I'm being sensible.", "next": "end"}, "end": {"speaker": "", "text": "You head back down. Whatever this is, it stopped being nothing a while ago.", "terminal": true}}}, "a1_afterwork": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Friday. The team scatters for the weekend. Zara lingers by your desk, jacket half on, pretending to look for something.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "So there's a not-terrible bar around the corner. I'm going. You could also go. To the same place. At the same time. As friends. Or whatever. God, I'm bad at this.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Are you asking me for a drink, Zara?'", "effects": {"affection_zara": 8}, "next": "yes"}, {"text": "'Lead the way. I could use it.'", "effects": {"affection_zara": 6}, "next": "sure"}]}, "yes": {"speaker": "Zara", "text": "...I'm asking you for a drink. Yes. Badly. Please put me out of my misery and say yes.", "next": "bar"}, "sure": {"speaker": "Zara", "text": "Oh thank god, a normal response. Come on.", "next": "bar"}, "bar": {"speaker": "", "text": "The bar is warm and half-empty and perfect. Two drinks in, the work armour is off and it's just two people talking.", "next": "n3"}, "n3": {"speaker": "Zara", "text": "Okay, real question. When Priya cornered you about the promotion — did it work? Are you already sizing me up as competition?", "next": "c2"}, "c2": {"speaker": "You", "choices": [{"text": "'I'm sitting here with you on a Friday. What do you think?'", "effects": {"affection_zara": 10}, "next": "warm"}, {"text": "'I won't lie — I want the lead. I also want this. Both can be true.'", "effects": {"affection_zara": 7, "career": 4}, "next": "honest"}, {"text": "'Let's not let a promotion write our story for us.'", "effects": {"affection_zara": 8}, "next": "story"}]}, "warm": {"speaker": "Zara", "text": "...Fair point. Damn it. You keep disarming me and I keep letting you. That should worry me more than it does.", "next": "close"}, "honest": {"speaker": "Zara", "text": "...You know what, thank you for not pretending. I'd rather the honest version of you than a comfortable lie. Both can be true. We'll figure out the both later.", "next": "close"}, "story": {"speaker": "Zara", "text": "...Yeah. Let's not. I like our story. I'd like to see where it goes before the office gets a vote.", "next": "close"}, "close": {"speaker": "", "text": "You talk until the bar starts stacking chairs. On the pavement outside, there's a pause — the kind that could tip either way.", "next": "c3"}, "c3": {"speaker": "You", "choices": [{"text": "'This was the best part of my week.'", "effects": {"affection_zara": 8, "set_flags": ["zara_spark"]}, "next": "end"}, {"text": "'Same time next week?'", "effects": {"affection_zara": 6, "set_flags": ["zara_spark"]}, "next": "endnext"}]}, "endnext": {"speaker": "Zara", "text": "Same time next week. It's a date. ...I said date. I'm leaving now. Goodnight, GUSET.", "terminal": true}, "end": {"speaker": "Zara", "text": "...Mine too. Don't let that go to your head. Okay, maybe a little to your head. Goodnight, GUSET.", "terminal": true}}}, "a1_monday": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Monday. Week 4. The weekend glow lasts exactly until you step off the lift and feel the change in the air.", "next": "n2"}, "n2": {"speaker": "", "text": "There's a printed memo on every desk. An all-hands is scheduled for this morning. Zara catches your eye across the aisle, and you both already know what it's about.", "next": "n3"}, "n3": {"speaker": "Zara", "text": "Whatever they say in there — this weekend was real. Hold onto that. Because I have a feeling things are about to get complicated.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Complicated doesn't scare me. Not with you.'", "effects": {"affection_zara": 7}, "next": "brave"}, {"text": "'Then let's promise to stay honest, whatever happens.'", "effects": {"affection_zara": 6}, "next": "promise"}]}, "brave": {"speaker": "Zara", "text": "...Okay. Okay. Hold that thought. We're going to need it.", "next": "end"}, "promise": {"speaker": "Zara", "text": "Honest. Whatever happens. Deal. Shake on it before I lose my nerve — and before Marcus starts talking.", "next": "end"}, "end": {"speaker": "", "text": "The all-hands is starting. Act 1 is over — you know these people now, and you know what you're walking into. Everything that happens next, happens because this part was real.", "terminal": true}}}, "a2_allhands": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 4. The all-hands. Leadership stands at the front of a too-warm conference room and makes it official.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "At the end of the quarter, when Lighthouse launches, one of our juniors steps up to lead it. One. The rest keep doing the excellent work you're already doing. I know that's not easy to hear. I won't pretend otherwise.", "next": "n3"}, "n3": {"speaker": "", "text": "Two seats away, Zara is very still. Two rows back, Priya is already smiling. The room does the math, and everyone lands on the same three names. Two of them are sitting next to each other.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "Catch Zara's eye and mouth: 'We're okay.'", "effects": {"affection_zara": 6}, "next": "reassure"}, {"text": "Sit up straighter. This is the shot you came for.", "effects": {"career": 5}, "next": "focus"}]}, "reassure": {"speaker": "", "text": "She holds your gaze for a second, then looks away first. She doesn't mouth anything back.", "next": "end"}, "focus": {"speaker": "", "text": "You feel the ambition switch on like a light. It feels good. It also feels like a door quietly closing somewhere to your left, where Zara is sitting.", "next": "end"}, "end": {"speaker": "", "text": "The meeting ends. Nobody quite makes eye contact in the lift back up. The quarter just changed shape.", "terminal": true}}}, "a2_aftermath": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Back at your desks. The easy rhythm you two had spent three weeks building has a hairline crack in it now, and you can both feel it.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "So. That's a thing now. Us, and a promotion only one of us can have. Cool. Great. Love that for me.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'It doesn't have to change anything between us.'", "effects": {"affection_zara": 5}, "next": "hope"}, {"text": "'...You okay? Actually okay?'", "effects": {"affection_zara": 7}, "next": "okay"}, {"text": "'Then let's agree right now: whatever happens, no games.'", "effects": {"affection_zara": 8, "set_flags": ["no_games_pact"]}, "next": "pact"}]}, "hope": {"speaker": "Zara", "text": "Doesn't it, though. That's a lovely thing to believe. Part of me wants to. The rest of me has been in this building three years and knows better.", "next": "wall"}, "okay": {"speaker": "Zara", "text": "I'm always okay. It's just — I've wanted this forever, and the one person standing in my way is the one I actually like. It's a very specific kind of unfair.", "next": "wall"}, "pact": {"speaker": "Zara", "text": "No games. Okay. I'll hold you to that, and I'll try to hold myself to it, which — historically — is the harder half.", "next": "wall"}, "wall": {"speaker": "", "text": "She turns back to her screen. Not cold, exactly. But there's a wall going up, brick by careful brick, and you're on the outside of it now.", "terminal": true}}}, "a2_priya": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Priya finds you at the water cooler, because of course she does. She's been waiting for the field to be official.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "So now it's real. Here's the thing nobody tells the new hire: Zara will be warm and lovely right up until the week it matters, and then she'll do exactly what she has to. Same as me. Same as you, if you're any good.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'You don't know her. Not the way I do.'", "effects": {"affection_zara": 7}, "next": "defend"}, {"text": "'And what is it you think YOU have to do, Priya?'", "effects": {"affection_priya": 5, "reputation": 3}, "next": "turn"}, {"text": "'Maybe. But I'd rather lose as myself than win as you.'", "effects": {"reputation": 6}, "next": "principle"}]}, "defend": {"speaker": "Priya", "text": "Three weeks and you're an expert on her. Adorable. I hope you're right. I've been wrong about people before — it's just never gone well for me when I was.", "next": "end"}, "turn": {"speaker": "Priya", "text": "...Ha. Turning it around on me. Good. Whatever it takes, within reason. I'm ruthless, not a monster. There's a difference, and the people who forget it are the ones who flame out.", "next": "end"}, "principle": {"speaker": "Priya", "text": "That's a beautiful sentiment. Frame it. Then watch how fast principles get expensive when the offer's actually on the table. ...I'll admit, I hope you keep it. Someone around here should.", "next": "end"}, "end": {"speaker": "", "text": "She walks off, heels clicking. She's not wrong about everything, and that's the part that sticks with you.", "terminal": true}}}, "a2_distance": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 5. Zara has gone all-business. Short replies. No rooftop invitations. No takeout. She's built her fortress and you are, apparently, outside the walls.", "next": "n2"}, "n2": {"speaker": "", "text": "You catch her working through lunch again, jaw tight, headphones in as a keep-away sign.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "Pull one headphone gently. 'Hey. Are we seriously doing the cold thing?'", "effects": {"affection_zara": 3}, "next": "push"}, {"text": "Say nothing. Leave the good upstairs coffee on her desk and walk away.", "effects": {"affection_zara": 8}, "next": "space"}, {"text": "'You don't have to freeze me out to protect yourself, you know.'", "effects": {"affection_zara": 6}, "next": "insight"}]}, "push": {"speaker": "Zara", "text": "I'm not doing anything. I'm working. That's allowed, isn't it? ...Sorry. That was sharp. You didn't earn that.", "next": "end"}, "space": {"speaker": "", "text": "The coffee sits untouched for an hour. Then, without looking up, she types you one line: 'the upstairs one. you remembered. i don't deserve that this week. thank you.'", "next": "end"}, "insight": {"speaker": "Zara", "text": "...God, don't do that. Don't see me that clearly, it's not fair. I don't know how to want the job and want you at the same time, so I'm defaulting to the job. It's what I know.", "next": "end"}, "end": {"speaker": "", "text": "The wall is real. But you're starting to see it isn't aimed at you — it's aimed at how much she's scared of wanting you back.", "terminal": true}}}, "a2_reach": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "You decide the cold war isn't yours to keep fighting. You corner her on the rooftop — her territory, chosen on purpose — with two coffees and a plan.", "next": "n2"}, "n2": {"speaker": "You", "text": "Here's my pitch. We stop circling each other and build Lighthouse together. Really together. And we let them decide the promotion without us tearing each other apart for it.", "next": "c1"}, "c1": {"speaker": "Zara", "choices": [{"text": "[You] 'One of us might get nothing. I'd still rather do it with you.'", "effects": {"affection_zara": 9, "set_flags": ["zara_ally"]}, "next": "yes"}, {"text": "[You] 'Whatever happens, I don't want to look back and see us wasted it.'", "effects": {"affection_zara": 8, "set_flags": ["zara_ally"]}, "next": "yes"}]}, "yes": {"speaker": "Zara", "text": "...You'd actually do that. Build the thing with me, eyes open, knowing it might hand ME the win and you nothing.", "next": "n3"}, "n3": {"speaker": "Zara", "text": "Okay. Partners on Lighthouse. And — thank you. For not letting me disappear behind the wall. I'm out of practice at being reached.", "next": "end"}, "end": {"speaker": "", "text": "The fortress still stands. But there's a door in it now, and for the first time she left it unlocked.", "terminal": true}}}, "a2_vaughn": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 6. It goes wrong publicly: a Lighthouse figure is off in the client deck and Zara's name is on that tab. It's a small error. Vaughn makes sure it doesn't feel small.", "next": "n2"}, "n2": {"speaker": "", "text": "Later, by the printers, he finds you alone. The smile is switched on.", "next": "n3"}, "n3": {"speaker": "Vaughn", "text": "Between us? Leadership's split on you and Zara. That error today — nothing huge. But if it landed on my desk, in writing, from you... the decision gets a lot simpler. For you. I'd remember the favour.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'The number was fixed in an hour. There's nothing to write up. We're done.'", "effects": {"affection_zara": 12, "reputation": 5, "set_flags": ["zara_integrity"]}, "next": "protect"}, {"text": "'...Send me the details.' Take the opening.", "effects": {"career": 14, "affection_zara": -8, "set_flags": ["took_vaughn_deal"]}, "next": "take"}, {"text": "'I'll think about it.' Keep your options open.", "effects": {"reputation": -2, "set_flags": ["vaughn_pending"]}, "next": "neutral"}]}, "protect": {"speaker": "Vaughn", "text": "...How principled. We'll see how long that lasts. Enjoy your desk, while it's yours.", "next": "protectend"}, "protectend": {"speaker": "", "text": "You shut it down flat. It was the right thing and it might have just cost you the job. You're strangely okay with that.", "terminal": true}, "take": {"speaker": "Vaughn", "text": "Smart. I knew you were the realist of the two. It'll be in your inbox within the hour. Welcome to the grown-ups' table.", "next": "takeend"}, "takeend": {"speaker": "", "text": "You take the details. It's just information. It's just business. You tell yourself that on the walk back, past Zara, who says 'hey' like nothing is quietly rotting between you.", "terminal": true}, "neutral": {"speaker": "Vaughn", "text": "Take your time. My door stays open. It usually does — right up until the moment it doesn't.", "next": "neutralend"}, "neutralend": {"speaker": "", "text": "You didn't say yes. You didn't say no. Vaughn nods like that was an answer too. Maybe it was.", "terminal": true}}}, "a2_fallout_cover": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "It gets back to her, the way everything does on the ninth floor. By Thursday, Zara knows Vaughn came to you — and knows you shut him down.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "He offered you a clean shot at the lead. My mistake, gift-wrapped, all you had to do was sign. And you said no.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'It wasn't even a real mistake. And it wasn't mine to sell.'", "effects": {"affection_zara": 9}, "next": "a"}, {"text": "'I wasn't going to buy the job with your name. Not a chance.'", "effects": {"affection_zara": 10}, "next": "a"}]}, "a": {"speaker": "Zara", "text": "...I don't know what to do with you. I've spent three years assuming everyone here would take the shot. And you just — didn't. For me. I'm going to need a minute. In a good way.", "next": "end"}, "end": {"speaker": "", "text": "Something shifted today, and it was bigger than a promotion. The wall between you is one brick shorter.", "terminal": true}}}, "a2_fallout_deal": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "You did the work quietly. A note to Vaughn, framed as 'just flagging for accuracy.' It's not sabotage. It just happens to have a body count, and the body is at the desk beside yours.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "Marcus asked me about the Q2 tab today. Said it 'came up.' Funny. It came up the same afternoon Vaughn was seen talking to you.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Zara — I can explain. It wasn't meant to land on you like that.'", "effects": {"affection_zara": -4}, "next": "explain"}, {"text": "Say nothing. You can't unsay it, and she can see it on your face.", "effects": {"affection_zara": -6}, "next": "silent"}]}, "explain": {"speaker": "Zara", "text": "Don't. Please. The explaining is worse than the thing. I just — I really thought you were different. That one's on me.", "next": "end"}, "silent": {"speaker": "Zara", "text": "Yeah. That's what I thought. Okay. Message received. We're colleagues. We were always only ever going to be colleagues, weren't we.", "next": "end"}, "end": {"speaker": "", "text": "The wall isn't a wall anymore. It's a closed door with your name on the wrong side of it. You got closer to the corner office today. You're not sure what you traded for it.", "terminal": true}}}, "a2_fallout_neutral": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "You never gave Vaughn an answer, and somehow that's its own kind of answer. The error blows over. But the not-choosing sits in your chest all week.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "Heard Vaughn's been circling. He does that when he smells a decision coming. Did he get to you?", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'He tried. I didn't bite. I also didn't tell him to get lost. I'm being honest.'", "effects": {"affection_zara": 6}, "next": "honest"}, {"text": "'Nothing worth worrying about.'", "effects": {"affection_zara": 2}, "next": "deflect"}]}, "honest": {"speaker": "Zara", "text": "...Okay. That's honest, at least. Watch your back with him. And — thanks for not pretending. Fence-sitting I can forgive. Lying I can't.", "next": "end"}, "deflect": {"speaker": "Zara", "text": "Mm. Sure. Nothing worth worrying about. I'll take your word for it. I'll also keep an eye out. Old habits.", "next": "end"}, "end": {"speaker": "", "text": "You kept your hands clean by keeping them in your pockets. It's not betrayal. It's not quite courage either.", "terminal": true}}}, "a2_honest": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 7. She asks you to the rooftop. She's not leaning on the railing this time. She's facing you, and her hands won't stay still.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "I have to say a thing, and if I don't say it now I'll bury it in a spreadsheet and never find it again. So. Here's the thing.", "next": "n3"}, "n3": {"speaker": "Zara", "text": "It was never really about the promotion. It's that I let myself want two things at once — the job, and you — and I decided I wasn't allowed both. So I picked the safe one and I froze you out. That wasn't fair, and I'm sorry.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'I want both too. And I'm done being scared of it.'", "effects": {"affection_zara": 12, "set_flags": ["zara_wall_revealed"]}, "next": "open"}, {"text": "'What if we stop competing at this, and just find out what we are?'", "effects": {"affection_zara": 11, "set_flags": ["zara_wall_revealed"]}, "next": "open"}, {"text": "'Let's keep it simple. Focus on the launch, sort us out after.'", "effects": {"affection_zara": 1}, "next": "retreat"}]}, "open": {"speaker": "Zara", "text": "...Okay. Okay. No fortress. I'm absolutely terrified, for the record. But okay. Both. Us. We'll figure out the rest as it comes.", "next": "openend"}, "openend": {"speaker": "", "text": "The wall is gone. What's left standing in its place is scarier and infinitely better than the wall ever was.", "terminal": true}, "retreat": {"speaker": "Zara", "text": "...Right. Simple. Yeah. That's — that's probably the smart play. Sure.", "next": "retreatend"}, "retreatend": {"speaker": "", "text": "She nods, and something folds quietly back up inside her. The moment passes. Maybe there'll be another. Maybe you just used the last one.", "terminal": true}}}, "a2_breather": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "You need to think. You end up in the design pod, where Kai is surrounded by mood boards and zero deadlines they're respecting.", "next": "n2"}, "n2": {"speaker": "Kai", "text": "You've got the face. The 'I'm tangled up in something at the ninth-floor level' face. Sit. Tell Dr. Kai everything. I'm terrible at my own life but weirdly good at other people's.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'How do you stay out of all the promotion politics?'", "effects": {"affection_kai": 5, "reputation": 3}, "next": "politics"}, {"text": "'How do you know if something with someone is... real?'", "effects": {"affection_kai": 5, "affection_zara": 3}, "next": "real"}]}, "politics": {"speaker": "Kai", "text": "Easy — I decided a title wasn't worth becoming someone I don't like. Not everyone can. Zara's spent years believing the title IS the proof she's enough. That's a hard thing to put down. Be gentle with her about it.", "next": "end"}, "real": {"speaker": "Kai", "text": "Real is when the scary thing feels more true than the safe thing. If you're asking me the question, you already know the answer — you're just hoping I'll give you permission. Consider it given. Go be brave.", "next": "end"}, "end": {"speaker": "", "text": "Kai goes back to their mood boards, humming. You leave with less of a knot in your chest than you came in with.", "terminal": true}}}, "a2_trip": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 8. The Lighthouse offsite. Two days at a hotel two hours out, a conference room that smells of burnt coffee and ambition, and the three front-runners in one place for the first time.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "Cosy little offsite. Last stretch before they decide. May the best of us win — and let's be honest, we all think it's going to be us.", "next": "n3"}, "n3": {"speaker": "", "text": "In the working session, Marcus splits you and Zara onto the same problem. You solve it fast, in sync, finishing each other's slides. Priya watches it happen and files it away.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "Shine — make sure Marcus sees your part clearly.", "effects": {"career": 6}, "next": "shine"}, {"text": "Make Zara look brilliant. She earned it.", "effects": {"affection_zara": 8}, "next": "lift"}]}, "shine": {"speaker": "Marcus", "text": "Strong work. Both of you. You especially came to play today. Noted.", "next": "end"}, "lift": {"speaker": "", "text": "You feed Zara the setups and let her land every punchline in the room. Afterward she catches your sleeve. 'You did that on purpose. You handed me the room.' She doesn't let go of your sleeve for a second.", "next": "end"}, "end": {"speaker": "", "text": "The work day ends. The team scatters to the hotel bar. The night, and whatever it's going to be, is still ahead.", "terminal": true}}}, "a2_balcony": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Late. The team's gone soft and loud downstairs. You find Zara on the hotel balcony, two drinks in hand, city lights spilling out below.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "This is the part of the trip where I'm brave or I chicken out. Historically I chicken out and blame the altitude. We're on the fourth floor, so I'm running out of excuses.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "Take the drink. 'Be brave. I've got you.'", "effects": {"affection_zara": 11}, "next": "brave"}, {"text": "'We've both had a big day and a lot of ambition. Let's not do something we can't take back.'", "effects": {"affection_zara": 4}, "next": "careful"}]}, "brave": {"speaker": "Zara", "text": "...You know what? Brave. Just this once.", "next": "brave2"}, "brave2": {"speaker": "", "text": "She doesn't kiss you — not quite. She rests her head on your shoulder and stays there, and it says more than a kiss would have. The city hums. Neither of you moves for a long, easy time.", "next": "end"}, "careful": {"speaker": "Zara", "text": "...You're right. You're annoyingly, generously right. Rain check on brave. I'm glad it's you I'm chickening out with, at least.", "next": "end"}, "end": {"speaker": "", "text": "Four weeks left. The launch. The decision. And now this — whatever it's quietly becoming — riding on all of it. Act 2 closes with everything still to play for.", "terminal": true}}}, "a3_looms": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 9. The offsite glow is gone. The decision lands next week and the whole floor can feel it, like weather coming in. Zara catches your eye over the top of her monitor.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "I need to ask you something and I need the real answer. Not the kind one. If they offer it to you — the lead — do you take it?", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'I don't know yet. But I won't take it in a way that costs me you.'", "effects": {"affection_zara": 9}, "next": "honest"}, {"text": "'Yes. I'd take it. And I'd still want you. Both true.'", "effects": {"affection_zara": 5, "career": 5}, "next": "ambitious"}, {"text": "'If it's you or the job, it was never really a contest.'", "effects": {"affection_zara": 7}, "next": "devoted"}]}, "honest": {"speaker": "Zara", "text": "That's the real answer. I can build on the real answer. Thank you for not handing me the comfortable one — I'd have known, and it would've been worse.", "next": "end"}, "ambitious": {"speaker": "Zara", "text": "At least you're honest about it. I respect the honesty. And I'm going to fight you for it — fairly, out loud, no Vaughn nonsense. But I'm going to fight. Fair warning.", "next": "end"}, "devoted": {"speaker": "Zara", "text": "...Don't. Don't make yourself small for me. That's not what I want and it's not what you want either, and I'd resent us both for it eventually. But — god, it's a nice thing to hear once.", "next": "end"}, "end": {"speaker": "", "text": "Whatever comes next week, at least you're walking into it with your eyes open and your cards on the table.", "terminal": true}}}, "a3_priya_final": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Priya requests a 'quick sync.' It is not quick and it is not a sync. It's a last play.", "next": "n2"}, "n2": {"speaker": "Priya", "text": "I'll be direct, because we're past pretending. Leadership's down to you and Zara — I read the room, I'm out. So here's my offer: back my read on the launch strategy publicly, and I'll tell Marcus you're the one who should lead. My word still carries.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'I don't need your endorsement bought. But thanks.'", "effects": {"reputation": 6, "affection_priya": 4}, "next": "decline"}, {"text": "'Why not back Zara? She's earned it more than I have.'", "effects": {"affection_zara": 8}, "next": "zara"}, {"text": "'...I'm listening.' Take the endorsement.", "effects": {"career": 10, "affection_zara": -3, "set_flags": ["priya_deal"]}, "next": "deal"}]}, "decline": {"speaker": "Priya", "text": "Clean. Unbought. You know, I came in here sure you'd take it. I'm oddly pleased you didn't. Don't tell anyone I said that. Ever.", "next": "end"}, "zara": {"speaker": "Priya", "text": "Because Zara never once tried to charm me and you're at least fun to lose to. But — noted. You'd throw your own weight behind her. That's either love or a strategy, and I genuinely can't tell which. Impressive either way.", "next": "end"}, "deal": {"speaker": "Priya", "text": "There he is. The realist. I'll talk to Marcus. Just remember — the second Zara finds out how you got the nudge, and she will, this stops being free.", "next": "end"}, "end": {"speaker": "", "text": "Priya folds her cards and leaves the table. The field is down to two now — you and the person you're falling for.", "terminal": true}}}, "a3_offer": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "Week 10. It comes early. Marcus pulls you into his office and closes the door — the first time he's ever closed the door.", "next": "n2"}, "n2": {"speaker": "Marcus", "text": "The lead is yours, if you want it. You've done the work, you lift the team, and — off the record — you didn't play dirty when you had chances to. That mattered to me. Zara doesn't know yet. What do you want to do?", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Make us co-leads. Lighthouse is better with both of us running it.'", "effects": {"affection_zara": 10, "career": 6, "set_flags": ["co_leads", "zara_integrity"]}, "next": "coleads"}, {"text": "'I'll take it. I earned it. I'll make things right with her after.'", "effects": {"career": 14, "set_flags": ["took_lead"]}, "next": "took"}, {"text": "'Give it to Zara. She's the right lead, and you know it.'", "effects": {"affection_zara": 12, "career": -6, "set_flags": ["stepped_aside", "zara_integrity"]}, "next": "aside"}]}, "coleads": {"speaker": "Marcus", "text": "A co-lead structure. Unusual. Reckless, maybe. But you'd be surprised how rarely anyone offers to share a win. Pitch it to me properly and I'll take it upstairs. Go tell her yourself — she should hear it from you.", "next": "end"}, "took": {"speaker": "Marcus", "text": "Then it's yours. Congratulations — you earned every bit of it. For what it's worth: how you handle the next hour, walking out past her desk, is the part people will actually remember. Choose it carefully.", "next": "end"}, "aside": {"speaker": "Marcus", "text": "...That's a big thing to give away. I'll be honest, I didn't expect it, and I'll need you to be sure. ...You're sure. Okay. That tells me something about you I won't forget. Leave it with me.", "next": "end"}, "end": {"speaker": "", "text": "You walk out of that office a different person than you walked in. Somewhere down the aisle, Zara is about to find out what you chose.", "terminal": true}}}, "a3_reaction_coleads": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "You find her at desk 13 and tell her before anyone else can. That you had it outright. That you asked them to split it.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "You did WHAT? You had it. Clean. Yours. And you walked in there and asked them to give me half?", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'Lighthouse is ours. It was never going to feel right any other way.'", "effects": {"affection_zara": 10}, "next": "a"}, {"text": "'I don't want a version of this where winning means beating you.'", "effects": {"affection_zara": 11}, "next": "a"}]}, "a": {"speaker": "Zara", "text": "...That is either the smartest or the most reckless thing anyone has ever done for me. Knowing you, both. Okay. OKAY. Co-leads. Partners. Let's go win this thing and terrify everyone with how good we are together.", "next": "end"}, "end": {"speaker": "", "text": "For the first time since the announcement, the wall isn't just down — it's like it was never there.", "terminal": true}}}, "a3_reaction_took": {"start": "n1", "nodes": {"n1": {"speaker": "", "text": "You take it. It feels the way you imagined — for about an hour. Then you have to walk past desk 13, where Zara is finding out from the org chart, not from you.", "next": "n2"}, "n2": {"speaker": "Zara", "text": "Congratulations. Genuinely. You were good. You were better than me where it counted with Marcus. I mean that.", "next": "c1"}, "c1": {"speaker": "You", "choices": [{"text": "'I should have told you first. I'm sorry. Let me make this right.'", "effects": {"affection_zara": 4}, "next": "sorry"}, {"text": "'You'd have taken it too. We both know that.'", "effects": {"affection_zara": -2, "career": 3}, "next": "cold"}]}, "sorry": {"speaker": "Zara", "text": "Maybe you can. Maybe not. Right now I need to go be professional in t
