<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Office Hours</title>
<style>
:root{
  --ink:#1d2433; --paper:#fffaf3; --muted:#6b7280; --accent:#ff6b8b; --accent2:#5b8def;
  --good:#2fb171; --warn:#f2a33a; --bad:#e2554f; --panel:rgba(255,250,243,.96);
  --shadow:0 10px 30px rgba(20,24,40,.25); --radius:16px;
  --font: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root{ --panel:rgba(255,250,243,.96); } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation;background:#1b1f2e;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
#blurbg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(18px) brightness(.55);transform:scale(1.05)}
img{-webkit-touch-callout:none;-webkit-user-drag:none}
#stage{position:relative;width:min(100%,150vh);width:min(100%,calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 1.5));aspect-ratio:3/2;overflow:hidden;background:#222;container-type:inline-size;user-select:none;-webkit-user-select:none;font-size:clamp(11px,1.45cqw,19px)}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:filter .4s}
#world{position:absolute;inset:0;z-index:1}
.ent .fl{height:100%}
.ent .fl.flip{transform:scaleX(-1)}
.fade{position:absolute;inset:0;background:#111;opacity:0;pointer-events:none;transition:opacity .35s;z-index:99}
.fade.on{opacity:1}

/* sprites */
.ent{position:absolute;transform-origin:50% 100%;cursor:pointer}
.ent img{display:block;height:100%;width:auto;pointer-events:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.ent .tag{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-4px);white-space:nowrap;background:rgba(29,36,51,.82);color:#fff;font-size:.8em;padding:.15em .6em;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none}
.ent:hover .tag,.ent.showtag .tag{opacity:1}
.ent.obj:hover img{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px rgba(255,214,102,.9))}
.ent.npc:hover img{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px rgba(255,107,139,.8))}
.ent.ghost{opacity:.42}
.ent.ghost:hover{opacity:.75}
.bubble{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-.3em);font-weight:800;font-size:1.1em;width:1.7em;height:1.7em;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow);animation:bob 1.2s ease-in-out infinite;pointer-events:none}
.bubble.new{background:var(--accent)}
.bubble.chat{background:#8c93a8;font-size:.85em}
.zone{position:absolute;border-radius:14px;cursor:pointer;transition:background .2s, box-shadow .2s}
.zone:hover{background:rgba(255,230,150,.18);box-shadow:inset 0 0 0 2px rgba(255,230,150,.75)}
.zone .tag{position:absolute;left:50%;top:-1.8em;transform:translateX(-50%);white-space:nowrap;background:rgba(29,36,51,.82);color:#fff;font-size:.8em;padding:.15em .6em;border-radius:99px;opacity:0;transition:opacity .2s}
.zone:hover .tag{opacity:1}
#avatar{cursor:default;z-index:5}
#avatar.walk img{animation:walk .42s ease-in-out infinite}
#avatar.act img{animation:act .5s ease-in-out 2}
.emote{position:absolute;left:50%;bottom:102%;transform:translateX(-50%);font-size:2.2em;animation:pop 1.3s ease-out forwards;pointer-events:none;z-index:9}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3%) rotate(2deg)}}
@keyframes act{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95)}}
@keyframes bob{0%,100%{transform:translate(-50%,-.3em)}50%{transform:translate(-50%,-.7em)}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:.7em;gap:.6em;z-index:20;pointer-events:none}
#hud>*{pointer-events:auto}
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow)}
#clock{padding:.55em .8em;min-width:15em}
#clock .when{font-weight:800;font-size:1.05em;display:flex;justify-content:space-between;gap:.5em;align-items:center}
.slots{display:flex;gap:.25em}
.slots i{width:.65em;height:.65em;border-radius:50%;background:#d8d2c8;display:block}
.slots i.on{background:var(--accent)}
.slots i.done{background:#9aa1b2}
.meter{display:grid;grid-template-columns:1.4em 5.4em 1fr 2em;align-items:center;gap:.35em;margin-top:.35em;font-size:.88em}
.bar{height:.6em;background:#e7e1d7;border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter.low .bar{animation:pulse 1s infinite}
.meter.low span:last-child{color:var(--bad);font-weight:800}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,85,79,.0)}50%{box-shadow:0 0 0 3px rgba(226,85,79,.45)}}
#topbtns{display:flex;gap:.4em;flex-wrap:wrap;justify-content:flex-end}
.btn{border:0;background:var(--panel);color:var(--ink);border-radius:99px;padding:.5em .85em;font-size:.9em;font-weight:700;box-shadow:var(--shadow)}
.btn:hover{background:#fff}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghostbtn{background:rgba(255,255,255,.18);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.35)}
.btn:disabled{opacity:.45;cursor:default}
#roomname{position:absolute;left:50%;top:.8em;transform:translateX(-50%);background:rgba(29,36,51,.75);color:#fff;padding:.3em .9em;border-radius:99px;font-weight:700;font-size:.9em;z-index:19;pointer-events:none}
#objective{position:absolute;left:.7em;bottom:.7em;max-width:46%;padding:.5em .8em;font-size:.88em;z-index:18;display:flex;gap:.5em;align-items:flex-start}
#objective b{color:var(--accent)}
#passbtn{position:absolute;right:.7em;bottom:.7em;z-index:18}
#exitbtn{position:absolute;right:.7em;bottom:3.4em;z-index:18}
#tutorial{position:absolute;left:.7em;top:7.6em;padding:.6em .8em;font-size:.82em;z-index:18;max-width:17em}
#tutorial h4{margin:0 0 .3em;font-size:1em;display:flex;justify-content:space-between;align-items:center}
#tutorial ul{list-style:none;margin:0;padding:0}
#tutorial li{padding:.12em 0}
#tutorial li.done{color:var(--muted);text-decoration:line-through}
#tutorial .x{border:0;background:none;font-size:1.1em;color:var(--muted);padding:0 .2em}

/* toasts */
#toasts{position:absolute;right:.7em;top:5.2em;display:flex;flex-direction:column;align-items:flex-end;gap:.35em;z-index:97;pointer-events:none}
.toast{background:rgba(29,36,51,.9);color:#fff;padding:.4em .75em;border-radius:12px;font-size:.88em;animation:toast 3.2s ease forwards;max-width:22em}
.toast.warn{background:var(--warn);color:#2b1a00}
.toast.bad{background:var(--bad)}
.toast.good{background:var(--good)}
.toast.love{background:var(--accent)}
@keyframes toast{0%{opacity:0;transform:translateX(20px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

/* action popover */
#pop{position:absolute;z-index:40;padding:.75em .9em;width:17em;display:none}
#pop h3{margin:0 0 .2em;font-size:1.05em}
#pop p{margin:.2em 0 .5em;color:var(--muted);font-size:.88em}
.fx{display:flex;flex-wrap:wrap;gap:.3em;margin:.3em 0 .6em}
.chip{font-size:.8em;font-weight:700;padding:.15em .55em;border-radius:99px;background:#efe9df}
.chip.up{background:#dcf5e8;color:#16774a}
.chip.down{background:#fde3e1;color:#a23631}
.chip.dim{background:#fff1d6;color:#8a5a00}
#pop .row{display:flex;gap:.4em;flex-wrap:wrap}

/* dialogue */
#vn{position:absolute;inset:0;z-index:30;display:none}
#vn.on{display:block}
#vnshade{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,22,35,.55),rgba(20,22,35,.15) 60%,rgba(20,22,35,0))}
#vnchar{position:absolute;bottom:22%;right:10%;height:72%;transition:opacity .25s,transform .25s;transform-origin:50% 100%}
#vnchar img{height:100%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
#vnchar.hide{opacity:0;transform:translateY(4%)}
#vnchar.happy{animation:hop .5s ease}
#vnchar.love{animation:hop .5s ease 2}
#vnchar.angry{animation:shake .45s ease}
#vnchar.sad img{filter:drop-shadow(0 10px 12px rgba(0,0,0,.35)) saturate(.6) brightness(.92)}
#vnchar.sad{transform:translateY(2%) scale(.985)}
#vnchar.flustered{animation:wobble .8s ease}
#vnemote{position:absolute;right:13%;top:6%;font-size:3em;opacity:0;pointer-events:none}
#vnemote.on{animation:pop 1.6s ease-out forwards}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-4%)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-2%)}40%{transform:translateX(2%)}60%{transform:translateX(-1.5%)}80%{transform:translateX(1%)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
#box{position:absolute;left:3%;right:3%;bottom:3%;min-height:27%;padding:1em 1.2em 1em 7.2em;cursor:pointer}
#box.noportrait{padding-left:1.2em}
#portrait{position:absolute;left:1em;top:1em;width:5.4em;height:5.4em;border-radius:50%;background-color:#f1e7da;background-repeat:no-repeat;box-shadow:inset 0 0 0 3px #fff,0 4px 12px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1em;color:#fff}
#portrait .mood{position:absolute;right:-.3em;bottom:-.2em;font-size:1.5em;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
#speaker{font-weight:800;font-size:1.05em;margin-bottom:.25em;display:flex;gap:.6em;align-items:baseline}
#speaker small{font-weight:600;color:var(--muted);font-size:.75em}
#text{font-size:1.08em;line-height:1.45;min-height:3.2em}
#text.narr{font-style:italic;color:#3b4252}
#choices{display:flex;flex-direction:column;gap:.45em;margin-top:.6em}
.choice{text-align:start;border:2px solid #eadfce;background:#fff;border-radius:12px;padding:.55em .8em;font-size:.98em;color:var(--ink);transition:transform .12s,border-color .12s}
.choice:hover{border-color:var(--accent);transform:translateX(4px)}
#vnctl{position:absolute;right:1em;top:.7em;display:flex;gap:.3em}
#vnctl button{border:0;background:#efe7db;border-radius:99px;font-size:.75em;font-weight:700;padding:.3em .65em;color:#4a5160}
#vnctl button.on{background:var(--accent);color:#fff}
#next{position:absolute;right:1.1em;bottom:.6em;font-size:.9em;color:var(--accent);animation:bob2 1s infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.float{position:absolute;font-weight:800;font-size:1.2em;z-index:70;pointer-events:none;animation:floatup 1.6s ease-out forwards;text-shadow:0 2px 0 #fff,0 0 8px #fff}
@keyframes floatup{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}

/* overlays */
.overlay{position:absolute;inset:0;background:rgba(18,20,32,.62);z-index:95;display:none;align-items:center;justify-content:center;padding:3%}
.overlay.on{display:flex}
.sheet{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);width:min(100%,58em);max-height:100%;overflow:auto;padding:1.2em 1.4em;position:relative}
.sheet h2{margin:.1em 0 .6em;font-size:1.5em}
.sheet .close{position:absolute;right:.8em;top:.7em;border:0;background:#efe7db;border-radius:99px;width:2em;height:2em;font-size:1em;font-weight:800}
.grid{display:grid;gap:.8em}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.tile{background:#fff;border-radius:14px;padding:.8em;box-shadow:0 2px 8px rgba(0,0,0,.07);position:relative}
.room{cursor:pointer;padding:0;overflow:hidden;border:3px solid transparent}
.room:hover{border-color:var(--accent)}
.room .thumb{height:7em;background-size:cover;background-position:center}
.room .meta{padding:.5em .7em}
.room .meta b{display:block}
.room .who{display:flex;gap:.25em;margin-top:.3em;min-height:2em;flex-wrap:wrap}
.face{width:2em;height:2em;border-radius:50%;background-repeat:no-repeat;background-color:#f1e7da;box-shadow:inset 0 0 0 2px #fff;position:relative}
.face.new::after{content:"!";position:absolute;right:-.3em;top:-.3em;background:var(--accent);color:#fff;font-size:.7em;font-weight:800;width:1.3em;height:1.3em;border-radius:50%;display:flex;align-items:center;justify-content:center}
.room.here{border-color:var(--accent2)}
.person{display:grid;grid-template-columns:5em 1fr;gap:.8em;align-items:start}
.person .pic{width:5em;height:5em;border-radius:50%;background-repeat:no-repeat;background-color:#f1e7da}
.hearts{color:var(--accent);letter-spacing:.05em}
.small{font-size:.82em;color:var(--muted)}
.tagline{display:inline-block;font-size:.72em;font-weight:800;padding:.1em .5em;border-radius:99px;background:#efe7db;margin-inline-end:.3em}
.tagline.ok{background:#dcf5e8;color:#16774a}
.tagline.no{background:#fde3e1;color:#a23631}
.tagline.hot{background:#ffe0e8;color:#c22b55}
.end{min-height:6.5em}
.end.locked{background:repeating-linear-gradient(45deg,#f3eee6,#f3eee6 8px,#ece5da 8px,#ece5da 16px);color:#8f8679}
.end .k{font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.end h4{margin:.2em 0}
#title{position:absolute;inset:0;z-index:90;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
#title::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,107,139,.55),rgba(36,45,90,.75));backdrop-filter:blur(3px)}
#title .inner{position:relative;text-align:center;color:#fff;width:min(92%,34em)}
#title h1{font-size:4em;margin:0;letter-spacing:-.02em;text-shadow:0 6px 24px rgba(0,0,0,.3)}
#title .sub{opacity:.9;margin:.2em 0 1.4em;font-size:1.1em}
#title .menu{display:flex;flex-direction:column;gap:.55em;align-items:center}
#title .menu .btn{width:15em;padding:.7em}
#title .a2hs{margin-top:1em;font-size:.85em;background:rgba(0,0,0,.28);border-radius:99px;padding:.4em 1em;display:inline-block}
@media (max-height: 520px){#title h1{font-size:2.6em}#title .sub{margin-bottom:.7em}#title .menu{gap:.35em}#title .menu .btn{padding:.45em}}
.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:.4em;margin:.6em 0}
.avpick{background:#fff;border:3px solid transparent;border-radius:12px;padding:.3em;height:9em;display:flex;align-items:flex-end;justify-content:center}
.avpick img{height:100%}
.avpick.sel{border-color:var(--accent)}
input[type=text]{font:inherit;padding:.55em .8em;border-radius:10px;border:2px solid #e3d8c7;width:100%}
label{font-weight:700;font-size:.9em}
.set{display:grid;grid-template-columns:10em 1fr;gap:.6em 1em;align-items:center}
.seg{display:flex;gap:.3em;flex-wrap:wrap}
.seg button{border:2px solid #e3d8c7;background:#fff;border-radius:99px;padding:.3em .8em;font-weight:700;font-size:.85em}
.seg button.on{border-color:var(--accent);background:#ffe9ee}
.ev h3{margin:.1em 0 .3em}
.ev .choice{width:100%}
.log p{margin:.35em 0}
.recap td{padding:.25em .6em}
.delta.up{color:#16774a;font-weight:800}.delta.down{color:#a23631;font-weight:800}
/* dance */
#dance{position:absolute;inset:0;z-index:55;background:radial-gradient(circle at 50% 30%,#3b2b6b,#120f24);display:none;color:#fff}
#dance.on{display:block}
#lanes{position:absolute;left:50%;transform:translateX(-50%);top:12%;bottom:22%;width:min(60%,26em);display:grid;grid-template-columns:repeat(4,1fr);gap:.5em}
.lane{position:relative;background:rgba(255,255,255,.06);border-radius:12px;overflow:hidden}
.note{position:absolute;left:10%;width:80%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6em;font-weight:900;color:#fff}
.hitline{position:absolute;left:0;right:0;bottom:8%;height:4px;background:rgba(255,255,255,.6)}
#pads{position:absolute;left:50%;transform:translateX(-50%);bottom:5%;width:min(60%,26em);display:grid;grid-template-columns:repeat(4,1fr);gap:.5em}
#pads button{border:0;border-radius:14px;padding:.6em 0;font-size:1.6em;font-weight:900;color:#fff}
#pads button.hit{transform:scale(.94);filter:brightness(1.3)}
#dscore{position:absolute;left:0;right:0;top:3%;text-align:center;font-weight:800;font-size:1.3em}
#djudge{position:absolute;left:0;right:0;top:45%;text-align:center;font-size:2em;font-weight:900;opacity:0}
#djudge.on{animation:pop .7s ease-out}
@media (max-aspect-ratio: 1/1){
  #app{justify-content:flex-start}
  #stage{width:100vw;font-size:clamp(10px,2.6cqw,16px)}
  #objective{max-width:60%}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .avatars{grid-template-columns:repeat(4,1fr)}
}
.sheet.guide-sheet{width:min(100%,62em);background:linear-gradient(160deg,#fffaf3 0%,#fff1f4 100%)}
.guide .g-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1em;margin-bottom:.8em;padding-inline-end:2.4em;flex-wrap:wrap}
.g-kicker{font-size:.75em;font-weight:900;letter-spacing:.14em;color:var(--accent)}
.g-dots{display:flex;gap:.35em}
.g-dot{width:2.2em;height:2.2em;border-radius:50%;border:3px solid #fff;background-color:#f1e7da;background-repeat:no-repeat;box-shadow:0 2px 6px rgba(0,0,0,.15);opacity:.55;transition:all .2s;padding:0;font-weight:900;color:#fff}
.g-dot.v{background:#3a3f4b}
.g-dot.on{opacity:1;transform:scale(1.18);border-color:var(--accent)}
.g-page{display:grid;grid-template-columns:12em 1fr;gap:1.2em;min-height:0;animation:gin .35s ease}
@keyframes gin{from{opacity:0;transform:translateX(calc(var(--dir) * 30px))}to{opacity:1;transform:none}}
.g-host{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--hc) 28%,#fff),#fff 70%);border-radius:18px;padding:.6em .4em .5em}
.g-host img{height:16em;max-height:100%;max-width:100%;object-fit:contain;animation:gbob 3s ease-in-out infinite;filter:drop-shadow(0 8px 8px rgba(0,0,0,.2))}
.g-vaughn{width:7em;height:7em;border-radius:50%;background:#3a3f4b;color:#fff;font-size:2.4em;font-weight:900;display:flex;align-items:center;justify-content:center;margin:2em 0 1em;box-shadow:0 0 0 6px #c9a227 inset}
.g-name{background:var(--hc);color:#fff;border-radius:12px;padding:.3em .7em;text-align:center;margin-top:-.6em;position:relative}
.g-name b{display:block}.g-name span{font-size:.72em;opacity:.9}
.g-tag{display:inline-block;background:var(--hc);color:#fff;font-size:.72em;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:.2em .7em;border-radius:99px}
.g-main h3{margin:.35em 0 .4em;font-size:1.45em;line-height:1.15}
.g-say{background:#fff;border-radius:16px;padding:.8em 1em;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.06);line-height:1.5;border-inline-start:4px solid var(--hc)}
.pinkbang{display:inline-flex;width:1.4em;height:1.4em;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;align-items:center;justify-content:center}
.g-demo{margin-top:.9em;background:#fff;border-radius:16px;padding:.9em 1em;box-shadow:0 2px 10px rgba(0,0,0,.06);border:2px dashed color-mix(in srgb,var(--hc) 40%,#fff)}
.g-demo::before{content:"TRY IT";display:block;font-size:.66em;font-weight:900;letter-spacing:.14em;color:var(--hc);margin-bottom:.5em}
.g-row{display:flex;gap:.45em;flex-wrap:wrap;margin:.6em 0 .2em}
.g-out{margin-top:.5em;font-size:.92em;min-height:2.6em;color:#3b4252}
.g-weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:.25em;margin-bottom:.6em}
.g-weeks i{font-style:normal;font-size:.75em;font-weight:800;background:#efe7db;border-radius:8px;text-align:center;padding:.35em 0;color:#7a7266}
.g-weeks i.gala{background:linear-gradient(135deg,#ffd166,#ff6b8b);color:#fff}
.g-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
.g-slot{background:#f6f1ea;border-radius:12px;padding:.5em;text-align:center;font-weight:700;font-size:.9em;transition:all .25s;border:2px solid transparent}
.g-slot span{display:block;font-size:1.5em}
.g-slot.now{border-color:var(--accent);background:#fff0f3;transform:translateY(-3px)}
.g-slot.done{opacity:.4;text-decoration:line-through}
.g-meter{display:grid;grid-template-columns:7.5em 1fr 2.2em;gap:.5em;align-items:center;margin:.3em 0}
.g-meter .bar{height:.8em}
.g-meter.low .bar{animation:pulse 1s infinite}
.g-faces{display:flex;gap:.5em;flex-wrap:wrap}
.g-face{border:0;background:#f6f1ea;border-radius:14px;padding:.45em .55em;display:flex;flex-direction:column;align-items:center;gap:.25em;font-weight:700;font-size:.82em;transition:transform .15s}
.g-face:hover{transform:translateY(-3px);background:#fff0f3}
.g-face .face{width:3em;height:3em}
.g-chat{display:flex;gap:.7em;align-items:flex-start}
.g-chat .face{width:3.6em;height:3.6em;flex:none}
.g-bub{background:#eef6f9;border-radius:14px;padding:.6em .8em;font-style:italic}
.g-choices{display:flex;flex-direction:column;gap:.35em;margin-top:.6em}
.g-hop{animation:hop .5s ease 2}.g-shake{animation:shake .45s ease}
.g-threats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}
.g-threat{background:#2a2f3a;color:#fff;border-radius:14px;padding:.7em;display:flex;flex-direction:column;gap:.25em;transition:transform .2s}
.g-threat:hover{transform:rotate(-1.5deg) scale(1.03)}
.g-threat .g-ti{font-size:1.8em}.g-threat span{font-size:.85em;opacity:.9}.g-threat em{font-size:.75em;color:#ffd166;font-style:normal;font-weight:700}
.g-kinds{display:flex;flex-wrap:wrap;gap:.4em}
.g-kind{border:2px solid var(--kc);color:var(--kc);border-radius:99px;padding:.25em .7em;font-weight:800;font-size:.85em;background:#fff}
.g-keys{display:flex;flex-wrap:wrap;gap:.4em .9em;margin-top:.7em;font-size:.82em;color:#4a5160}
kbd{background:#1d2433;color:#fff;border-radius:6px;padding:.05em .45em;font-family:inherit;font-weight:800;font-size:.9em;box-shadow:0 2px 0 #000}
.g-nav{display:flex;justify-content:space-between;align-items:center;margin-top:1em}
@media (max-aspect-ratio: 1/1){.g-page{grid-template-columns:1fr}.g-host{flex-direction:row;justify-content:flex-start;gap:.8em;padding:.4em}.g-host img{height:6em}.g-name{margin:0}.g-vaughn{width:2.4em;height:2.4em;font-size:1.4em;margin:0}.g-threats{grid-template-columns:1fr}}

/* ---------- decluttered HUD ---------- */
input[type=text]{background:#fff;color:var(--ink)}
#roomname,#exitbtn{display:none!important}
#clock{padding:.45em .7em;min-width:0;width:auto}
#clock .when{display:flex;gap:.5em;align-items:center;font-size:.95em}
#clock .when span:first-of-type{color:var(--muted);font-weight:700}
#clock .where{font-size:.78em;color:var(--muted);font-weight:700;margin-top:.1em}
#clock .crash{color:var(--bad)}
.rings{display:flex;gap:.45em;margin-top:.35em}
.ring{--v:50;--c:#999;width:2.7em;height:2.7em;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v) * 1%),#e7e1d7 0);position:relative;display:flex;align-items:center;justify-content:center;transition:background .6s}
.ring::before{content:"";position:absolute;inset:.28em;border-radius:50%;background:var(--panel)}
.ring span{position:absolute;top:-.25em;right:-.3em;font-size:.8em;z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.ring b{position:relative;font-size:.8em}
.ring.low{animation:pulse 1s infinite}
.ring.low b{color:var(--bad)}
#topbtns{gap:.35em}
#topbtns .btn{width:2.6em;height:2.6em;padding:0;border-radius:50%;font-size:1em;display:flex;align-items:center;justify-content:center;position:relative}
#topbtns .btn .badge{position:absolute;top:-.2em;right:-.2em;background:var(--accent);color:#fff;font-style:normal;font-size:.62em;font-weight:900;min-width:1.5em;height:1.5em;border-radius:99px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
#objective{max-width:62%;padding:.35em .45em .35em .7em;font-size:.82em;align-items:center;border-radius:99px;gap:.45em}
#objective .obj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tutchip{border:0;background:#ffe9ee;color:#c22b55;font-weight:900;border-radius:99px;padding:.2em .6em;font-size:.95em;flex:none}
#tutorial{top:auto;bottom:3.2em;left:.7em;display:none}
#passbtn{padding:.45em .8em;font-size:.82em}

/* ---------- office map ---------- */

.m-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1em;margin-bottom:.7em;padding-inline-end:2.4em}
.pinkdot{display:inline-flex;width:1.2em;height:1.2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;align-items:center;justify-content:center;font-size:.85em}
.bld{position:relative;display:grid;grid-template-columns:3em 2.4em 1fr;grid-template-rows:8em 8em 2.4em 8em;row-gap:.5em;background:#e9e2d6;border:4px solid #5b6170;border-radius:6px 6px 0 0;padding:.5em .5em .5em 0;box-shadow:0 12px 0 -4px #8b7f6e}
.roof-sign{position:absolute;left:50%;top:-1.7em;transform:translateX(-50%);background:#1d2433;color:#ffd166;font-weight:900;letter-spacing:.3em;font-size:.8em;padding:.2em .9em;border-radius:6px 6px 0 0}
.shaft{grid-column:1;grid-row:1/5;position:relative;margin-left:.5em;background:repeating-linear-gradient(0deg,#3a3f4b 0 2px,#4a505d 2px 14px);border-radius:6px}

.m-room{flex:1;border:3px solid transparent;border-radius:12px;background-size:cover;background-position:center;position:relative;text-align:start;color:#fff;padding:.5em .6em;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .15s,border-color .15s,box-shadow .15s;overflow:hidden}

/* ================= mobile ================= */
#rotate{display:none;position:fixed;inset:0;z-index:1000;background:linear-gradient(160deg,#2b2350,#5a3a6e 60%,#ff6b8b);color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:.6em;text-align:center;padding:2em;font-size:17px}
#rotate b{font-size:1.4em}
#rotate .rot-tip{font-size:.85em;opacity:.85;max-width:20em;margin-top:1em}
.rot-phone{width:70px;height:120px;border:5px solid #fff;border-radius:14px;display:flex;align-items:center;justify-content:center;animation:rotphone 2.4s ease-in-out infinite;margin-bottom:.8em}
.rot-screen{font-size:30px}
@keyframes rotphone{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation: portrait) and (pointer: coarse){ #rotate{display:flex} }

/* Bigger touch targets on phones and tablets */
.touch #topbtns .btn{width:42px;height:42px;font-size:18px}
.touch #topbtns .btn .badge{font-size:11px}
.touch #passbtn{min-height:40px;font-size:14px;padding:.3em 1em}
.touch #objective{font-size:13px;min-height:40px}
.touch .tutchip{min-height:30px;font-size:13px}
.touch #vnctl button{font-size:12px;padding:.45em .9em;min-height:30px}
.touch .choice{min-height:42px}
.touch .btn{min-height:38px}
.touch .sheet .close{width:38px;height:38px;font-size:16px}
.touch .g-dot{width:30px;height:30px}
.touch #pop .btn{min-height:40px}

/* Pop-up panels: header and buttons always on screen, only the middle scrolls */
.sheet.guide-sheet{display:flex;flex-direction:column;overflow:hidden}
.guide{display:flex;flex-direction:column;min-height:0;flex:1}
.guide .g-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.guide .g-nav{flex:none}
.sheet :is(#go-week,#go-gala,#ng-go,#go-home,#pass-yes,#ev-ok,#wipe-yes,#r-new,#mail-done,#p-go){position:sticky;bottom:0;z-index:3;box-shadow:0 -6px 16px rgba(0,0,0,.14),var(--shadow)}

/* Short screens: a phone held sideways */
@media (max-height: 520px){
  .overlay{padding:6px}
  .sheet{padding:.65em .85em;border-radius:14px}
  .sheet h2{font-size:1.15em;margin-bottom:.35em}
  .sheet .close{right:.45em;top:.45em}
  .guide .g-head{margin-bottom:.4em}
  .g-dots{gap:.25em}
  .g-page{grid-template-columns:8em 1fr;gap:.8em;min-height:0;height:100%}
  .g-host{padding:.3em .3em .4em;min-height:0}
  .g-host img{height:auto;max-height:calc(100% - 3.2em);max-width:100%}
  .g-vaughn{width:4em;height:4em;font-size:1.6em;margin:.6em 0}
  .g-main h3{font-size:1.1em;margin:.25em 0 .3em}
  .g-say{padding:.5em .75em;line-height:1.35}
  .g-demo{margin-top:.5em;padding:.5em .7em}
  .g-out{min-height:0;margin-top:.35em}
  .g-nav{margin-top:.45em}
  .ng-pic{height:min(21em,70dvh)}
  .bld{grid-template-rows:5.4em 5.4em 1.8em 5.4em}
  .m-head{margin-bottom:.4em}
  #box{min-height:30%;padding:.7em .9em .7em 6.2em}
  #portrait{width:4.6em;height:4.6em;left:.8em;top:.7em}
}

.gala-row{display:flex;flex-wrap:wrap;gap:.6em;margin:.6em 0 .9em}
.gala-pick{flex:1;min-width:6.5em;border:2px solid #efe5d6;background:#fff;border-radius:16px;padding:.6em .4em;display:flex;flex-direction:column;align-items:center;gap:.25em;transition:transform .15s,border-color .15s}
.gala-pick:hover{transform:translateY(-3px);border-color:var(--accent)}
.gala-pick .face{width:4em;height:4em}

.act-opts{display:flex;flex-direction:column;gap:.45em}
.act-opts .choice b{display:block}
.mail{background:#fff;border:2px solid #efe5d6;border-radius:14px;padding:.8em 1em;margin:.5em 0;position:relative;min-height:4.4em}
.mail-n{position:absolute;right:.8em;top:.6em;font-size:.75em;color:var(--muted);font-weight:800}
.mail-from{font-size:.8em;font-weight:900;color:var(--accent2)}
.mail-subj{font-weight:800;font-size:1.05em;margin-top:.2em}
.mail-btns{display:flex;gap:.45em;flex-wrap:wrap}
.mail-btns .btn{flex:1}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.45em;margin-top:.5em}
.pcard{border:2px solid #efe5d6;background:#fff;border-radius:12px;padding:.7em .5em;font-weight:800;font-size:.85em;min-height:3.6em;transition:all .15s}
.pcard.on{border-color:var(--accent);background:#fff0f3;transform:translateY(-2px)}

.ng-avs{display:flex;gap:.35em;flex-wrap:wrap;margin:.3em 0 .5em}
.ng-av{border:3px solid transparent;background:#fff;border-radius:50%;padding:0;width:2.9em;height:2.9em;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.ng-av .face{display:block;width:100%;height:100%}
.ng-av.on{border-color:var(--accent);transform:scale(1.08)}

.g-mini{display:none}
@media (max-height: 640px){
  .g-page{grid-template-columns:1fr;gap:.4em}
  .g-host{display:none}
  .g-mini{display:flex;align-items:center;gap:.5em;margin-bottom:.35em}
  .g-mini .face{width:2.4em;height:2.4em;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background-color:var(--hc)}
  .g-mini b{color:var(--hc)}
  .g-mini span:last-child{font-size:.78em;color:var(--muted)}
  .g-tag{display:none}
  .g-main h3{font-size:1.05em;margin:.1em 0 .3em}
  .g-say{padding:.45em .7em;line-height:1.35;font-size:.95em}
  .g-demo{margin-top:.45em;padding:.45em .7em}

  .g-out{min-height:1.4em}
  .g-threat{padding:.45em}
  .cards{grid-template-columns:repeat(3,1fr)}
  .pcard{min-height:2.6em;padding:.45em}
  .ng-pic{display:none}
  .ng{grid-template-columns:1fr}
  .ng-badge{display:none}
}

function doAction(id) {
  const A = ACTIONS[id];
  if (A.mini) { startDance(); return; }
  if (ACTIVITIES[id]) { ACTIVITIES[id](); return; }
  const mult = diminish(id); G.hist.push(id); if (G.hist.length > 30) G.hist.shift();
  emote(A.emoji); if (A.sfx) Audio.play(A.sfx);
  setTimeout(() => {
    const fx = {...actionFx(id)};
    if (A.risky) { const chance = 0.35 + G.reputation / 200 + G.energy / 300; if (Math.random() < chance) { fx.reputation = 4; toast("💡 The room loves it.", "good"); } else { fx.reputation = -3; fx.career = Math.round(fx.career / 2); toast("💡 It falls flat. Someone checks their phone.", "warn"); } }

    const d = applyEffects(fx, {mult}); announce(d);
    if (mult < 1) toast(`Diminishing returns: ${Math.round(mult * 100)}% effect.`, "warn");
    endSlot();
  }, 900);
}

/* ------------------------------------------------------------------ dialogue engine */
const SPEED = {slow:45, normal:24, fast:9, instant:0};
const Dialogue = {
  scene:null, sid:null, node:null, nid:null, track:null, onEnd:null, typing:false, full:"", timer:null, auto:false, skip:false, log:[], lastFx:null, lines:null,
  start(sid, track, onEnd) {
    this.sid = sid; this.scene = STORY[sid]; this.track = track; this.onEnd = onEnd; this.lines = null;
    if (!this.scene) { console.warn("missing scene", sid); onEnd && onEnd(); return; }
    this.open(); this.show(this.scene.start);
  },
  runLines(lines, onEnd) { this.lines = lines.slice(); this.onEnd = onEnd; this.sid = null; this.track = speakerKey(lines[0].speaker); this.open(); this.nextLine(); },
  nextLine() { const l = this.lines.shift(); if (!l) return this.close(); this.render(l.speaker, l.text, null); },
  open() { $("#vn").classList.add("on"); hidePop(); this.lastFx = null; const k = this.track; this.setChar(k); },
  close() {
    clearTimeout(this.timer); $("#vn").classList.remove("on"); this.skip = false; this.auto = false; this.syncCtl();
    const cb = this.onEnd; this.onEnd = null; persistSeen(); if (cb) cb();
  },
  setChar(k, mood) {
    const v = $("#vnchar");
    if (!k || !CAST[k]) { v.className = "hide"; return; }
    $("#vnimg").src = ART[CAST[k].sprite].src; v.className = "";
    if (mood && mood !== "neutral") { void v.offsetWidth; v.classList.add(mood); }
  },
  show(nid) {
    let n = this.scene.nodes[nid], hops = 0;
    while (n && n.branch && hops++ < 20) { const b = n.branch.find(cond) || n.branch[n.branch.length - 1]; nid = b.next; n = this.scene.nodes[nid]; }
    if (!n) return this.close();
    this.nid = nid; this.node = n;
    let text = n.text, next = n.next;
    if (n.variants) { const v = n.variants.find(cond) || n.variants[n.variants.length - 1]; text = v.text; next = v.next; this.node = Object.assign({}, n, {next}); }
    if (n.effects) { const d = applyEffects(n.effects); announce(d, true); }
    if (n.choices) { this.renderChoices(n.choices); return; }
    const key = this.sid + "/" + nid; this.wasSeen = seen.has(key); if (!this.wasSeen) { seen.add(key); seenDirty = true; }
    if (this.skip && !this.wasSeen && settings.skip === "seen") { this.skip = false; this.syncCtl(); }
    this.render(n.speaker, text, n);
  },
  mood(speaker, text) {
    const k = speakerKey(speaker); let m = "neutral";
    if (this.lastFx && k) { const v = this.lastFx["affection_" + k]; if (v != null) { m = v >= 7 ? "love" : v > 0 ? "happy" : v < 0 ? "angry" : "neutral"; this.lastFx = null; return m; } }
    const t = text || "";
    if (/furious|frost|cold|angry|crime|absolutely not|rude|unwise/i.test(t)) return "angry";
    if (/tears|glassy|lonely|tired|sorry|afraid|frighten|hurt|quiet|sad|sigh/i.test(t)) return "sad";
    if (/\.\.\.|terrif|blush|nervous|\bred\b|awkward|unprofessional/i.test(t)) return "flustered";
    if (/laugh|grin|YES|love|delight|perfect|amazing|proud|incredible|!/i.test(t)) return "happy";
    return "neutral";
  },
  render(speaker, text, n) {
    clearTimeout(this.timer);
    const narr = !speaker; const k = speakerKey(speaker); const isYou = speaker === "You";
    const box = $("#box"), por = $("#portrait");
    $("#choices").innerHTML = ""; $("#next").style.visibility = "hidden";
    const mood = narr ? "neutral" : this.mood(speaker, text);
    if (k) this.setChar(k, mood);
    const MO = {love:"❤️", happy:"😊", angry:"💢", sad:"💧", flustered:"💦", neutral:""};
    if (narr) { box.classList.add("noportrait"); por.style.display = "none"; $("#speaker").innerHTML = ""; }
    else {
      box.classList.remove("noportrait"); por.style.display = "flex"; por.style.backgroundImage = ""; por.style.backgroundColor = ""; por.innerHTML = '<span class="mood"></span>';
      if (k) { faceStyle(CAST[k].sprite, por); por.style.boxShadow = `inset 0 0 0 3px ${CAST[k].color}`; }
      else if (isYou) { faceStyle(G.avatar, por); por.style.boxShadow = "inset 0 0 0 3px #888"; }
      else { por.style.backgroundColor = "#5b6170"; por.innerHTML = `${esc(speaker[0])}<span class="mood"></span>`; por.style.boxShadow = "inset 0 0 0 3px #fff"; }
      por.querySelector(".mood").textContent = MO[mood] || "";
      const role = k ? CAST[k].role : isYou ? G.name : speaker === "Vaughn" ? "Senior director" : "";
      $("#speaker").innerHTML = `<span style="color:${k ? CAST[k].color : "#1d2433"}">${esc(isYou ? "You" : speaker)}</span><small>${esc(role)}</small>`;
      if (MO[mood] && (mood === "love" || mood === "angry")) { const e = $("#vnemote"); e.textContent = MO[mood]; e.classList.remove("on"); void e.offsetWidth; e.classList.add("on"); }
    }
    const T = $("#text"); T.className = narr ? "narr" : "";
    this.full = text; this.log.push({speaker: narr ? "" : (isYou ? "You" : speaker), text}); if (this.log.length > 80) this.log.shift();
    const sp = this.skip ? 0 : SPEED[settings.speed];
    if (!sp) { T.textContent = text; this.doneTyping(); return; }
    this.typing = true; let i = 0; T.textContent = "";
    const step = () => { i += 1; T.textContent = text.slice(0, i); if (i % 3 === 0) Audio.play("tick"); if (i >= text.length) { this.doneTyping(); return; } this.timer = setTimeout(step, text[i - 1] === "." || text[i - 1] === "?" ? sp * 6 : sp); };
    step();
  },
  doneTyping() {
    this.typing = false; $("#text").textContent = this.full; $("#next").style.visibility = "visible";
    if (this.skip) this.timer = setTimeout(() => this.advance(), 70);
    else if (this.auto) this.timer = setTimeout(() => this.advance(), settings.autoDelay * 1000 + this.full.length * 18);
  },
  advance() {
    if ($("#choices").children.length) return;
    if (this.typing) { clearTimeout(this.timer); this.doneTyping(); return; }
    Audio.play("page");
    if (this.lines) return this.nextLine();
    const n = this.node; if (!n || n.terminal || !n.next || !this.scene.nodes[n.next]) return this.close();
    this.show(n.next);
  },
  renderChoices(choices) {
    clearTimeout(this.timer); this.typing = false; $("#next").style.visibility = "hidden";
    if (this.skip) { this.skip = false; this.syncCtl(); }
    const C = $("#choices"); C.innerHTML = "";
    choices.filter(cond).forEach(c => {
      const b = el("button", "choice", esc(c.text));
      b.addEventListener("click", ev => {
        ev.stopPropagation(); Audio.play("click");
        this.log.push({speaker:"You", text:c.text});

        C.innerHTML = "";

    });
  },
  syncCtl() { $("#c-skip").classList.toggle("on", this.skip); $("#c-auto").classList.toggle("on", this.auto); }
};
$("#box").addEventListener("click", () => Dialogue.advance());
$("#c-skip").addEventListener("click", ev => { ev.stopPropagation(); Dialogue.skip = !Dialogue.skip; Dialogue.syncCtl(); if (Dialogue.skip) { if (!Dialogue.wasSeen && settings.skip === "seen" && !Dialogue.lines) { toast("Skip only fast-forwards lines you've already read. Change this in Settings.", ""); Dialogue.skip = false; Dialogue.syncCtl(); return; } Dialogue.advance(); } });
$("#c-auto").addEventListener("click", ev => { ev.stopPropagation(); Dialogue.auto = !Dialogue.auto; Dialogue.syncCtl(); if (Dialogue.auto && !Dialogue.typing) Dialogue.advance(); });

let busy = false;
function endSlot() {

  if (G.slot >= SLOTS.length) return endDay();

}

}
function endDay(collapsed) {
  G.slot = 0; G.talked = {}; G.chatted = {}; G.day++;
  G.energy = clamp(G.energy + (collapsed ? 20 : 18), 0, 100);
  if (G.day >= DAYS.length) { G.day = 0; return endWeek(); }
  fadeThen(() => { renderRoom(); toast(`🌙 A new day: ${DAYS[G.day]}. Energy +${collapsed ? 20 : 18} overnight.`); }, () => { autosave(true); maybeEvent(); });
}
function endWeek() {
  const before = G.weekStart || snapshot();
  const close = Object.keys(CAST).filter(k => !isHidden(k) && G.aff[k] >= 60).sort((a, b) => G.aff[b] - G.aff[a])[0];
  if (close) applyEffects({career:2, energy:5});
  const now = snapshot();
  const scenes = G.sceneLog.length - (G.weekScenes || 0);
  G.week++; G.energy = clamp(G.energy + 20, 0, 100);

/* ------------------------------------------------------------------ dance-off */
const Dance = {
  on:false, notes:[], score:0, hits:0, total:0, start:0, raf:0, combo:0,
  COLORS:["#ff6b8b","#5b8def","#2fb171","#f2a33a"], ARROWS:["←","↓","↑","→"],
  run() {
    Audio.musicPaused = true;
    this.on = true; this.notes = []; this.score = 0; this.hits = 0; this.combo = 0; const D = $("#dance"); D.classList.add("on");
    $("#lanes").innerHTML = ""; $("#pads").innerHTML = "";
    for (let i = 0; i < 4; i++) {
      const l = el("div", "lane", '<div class="hitline"></div>'); $("#lanes").appendChild(l);
      const p = el("button", "", this.ARROWS[i]); p.style.background = this.COLORS[i];
      p.addEventListener("pointerdown", ev => { ev.preventDefault(); this.hit(i); }); $("#pads").appendChild(p);
    }
    const bpm = 112, beat = 60 / bpm; let t = 2.2; const pattern = [];
    for (let b = 0; b < 30; b++) { if (Math.random() < .78) pattern.push({lane:Math.floor(Math.random() * 4), t}); if (b % 4 === 3 && Math.random() < .4) pattern.push({lane:Math.floor(Math.random() * 4), t:t + beat / 2}); t += beat; }
    this.total = pattern.length; this.end = t + 1.5;
    this.notes = pattern.map(n => { const e = el("div", "note", this.ARROWS[n.lane]); e.style.background = this.COLORS[n.lane]; $("#lanes").children[n.lane].appendChild(e); return {...n, e, done:false}; });
    this.start = performance.now() / 1000;
    if (Audio.ctx) { for (let b = 0; b < 34; b++) { const w = 2.2 + b * beat - 1.55; if (w > 0) { Audio.tone(b % 4 === 0 ? 110 : 165, .12, "sine", b % 4 === 0 ? .35 : .15, w, Audio.music); Audio.tone(330 * Math.pow(2, [0,4,7,9][b % 4] / 12), .18, "triangle", .06, w, Audio.music); } } }
    const loop = () => {
      const now = performance.now() / 1000 - this.start; const fall = 1.55;
      this.notes.forEach(n => { if (n.done) return; const p = 1 - (n.t - now) / fall; n.e.style.top = `calc(${p * 92}% - 8%)`; n.e.style.display = p < -0.05 ? "none" : "flex"; if (now - n.t > .22) { n.done = true; n.e.style.opacity = .2; this.combo = 0; this.judge("Miss", "#9aa1b2"); } });
      $("#dscore").innerHTML = `💃 DANCE-OFF · ${this.hits}/${this.total} hits · combo ${this.combo}<div class="small" style="color:#ccc">Arrow keys / WASD, or tap the pads</div>`;
      if (now > this.end) return this.finish();
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },
  hit(lane) {
    const pad = $("#pads").children[lane]; pad.classList.add("hit"); setTimeout(() => pad.classList.remove("hit"), 90);
    const now = performance.now() / 1000 - this.start;
    const c = this.notes.filter(n => !n.done && n.lane === lane && Math.abs(n.t - now) < .2).sort((a, b) => Math.abs(a.t - now) - Math.abs(b.t - now))[0];
    if (!c) { Audio.play("miss"); return; }
    c.done = true; c.e.style.display = "none"; this.hits++; this.combo++; Audio.play("good");
    this.judge(Math.abs(c.t - now) < .08 ? "Perfect!" : "Good", this.COLORS[lane]);
  },
  judge(t, color) { const j = $("#djudge"); j.textContent = t; j.style.color = color; j.classList.remove("on"); void j.offsetWidth; j.classList.add("on"); },
  finish() {
    Audio.musicPaused = false;
    cancelAnimationFrame(this.raf); this.on = false;
    const acc = this.total ? this.hits / this.total : 0; const mult = diminish("dance");
    G.hist.push("dance"); setFlag("danced");
    const rep = Math.round(2 + 8 * acc);
    const watchers = Object.keys(CAST).filter(k => whereIs(k) === G.room && !isHidden(k));
    const fx = {reputation:rep, energy:-8}; watchers.forEach(k => fx["affection_" + k] = acc > .6 ? 2 : 1);
    $("#dance").classList.remove("on");
    const grade = acc > .85 ? "Legendary" : acc > .65 ? "Smooth moves" : acc > .4 ? "Enthusiastic" : "Bold. Very bold.";
    const d = applyEffects(fx, {mult}); announce(d);
    toast(`💃 ${grade}. ${Math.round(acc * 100)}% accuracy.${watchers.length ? " " + watchers.map(k => CAST[k].name).join(" & ") + " saw everything." : ""}`, "good");
    endSlot();
  }
};
function startDance() { hidePop(); Dance.run(); }

function sheetOverflows() {

}
function fitSheet() {

function finale() {

    const steps = [];
    if (pick) { setFlag("chose_" + pick); steps.push({id:pickEnding(pick), track:pick, misses:serious.filter(k => k !== pick)}); }

    steps.push({id:globalEnding(), track:null});

    const run = () => {
      const st = steps.shift(); if (!st) return results(played);
      const play = () => { unlock(st.id); played.push(st.id); if (st.track) Audio.motif(st.track); Dialogue.start(st.id, st.track, run); };
      if (st.misses && st.misses.length) Dialogue.runLines(st.misses.map(k => ({speaker:"", text:GALA_MISS[k]})), play); else play();

    closeSheet(true); hideTitle();
    const firstTime = !LS.get("guided", false);
    fadeThen(renderRoom, () => { if (firstTime) openHelp(); else toast("Welcome to Meridian. Tap Zara (with the pink !) to begin.", "good"); });
  });
}

showTitle();
</script>
